<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Owner — Interactive Product Ownership Toolkit</title>
<style>
  :root {
    --bg: #f4f7f8;
    --surface: #ffffff;
    --surface2: #ebf1f3;
    --surface3: #dde7ea;
    --border: #d8e2e6;
    --ink: #11242c;
    --muted: #5c7079;
    --accent: #0f6f8f;
    --accent-soft: rgba(15,111,143,0.10);
    --accent2: #b96a24;
    --accent2-soft: rgba(185,106,36,0.12);
    --danger: #c04148;
    --danger-soft: rgba(192,65,72,0.12);
    --ok: #2c8558;
    --ok-soft: rgba(44,133,88,0.12);
    --purple: #6c53b5;
    --purple-soft: rgba(108,83,181,0.12);
    --side: #0e202a;
    --side2: #1a303c;
    --side-text: #9fb3bc;
    --shadow: 0 1px 2px rgba(17,36,44,0.05), 0 4px 16px rgba(17,36,44,0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

  /* ---------- SIDEBAR ---------- */
  #sidebar {
    position: fixed; top: 0; left: 0; width: 274px; height: 100vh;
    background: var(--side); display: flex; flex-direction: column; z-index: 60;
    transition: transform .25s ease;
  }
  .brand { padding: 20px 20px 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .brand h1 { font-size: .82rem; font-weight: 700; color: #fff; letter-spacing: .12em; text-transform: uppercase; }
  .brand p { font-size: .68rem; color: var(--side-text); margin-top: 5px; letter-spacing: .02em; }
  .side-progress { padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .side-progress .lbl { display: flex; justify-content: space-between; font-size: .65rem; color: var(--side-text); text-transform: uppercase; letter-spacing: .07em; }
  .side-progress .track { height: 5px; background: rgba(255,255,255,.12); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .side-progress .fill { height: 100%; background: linear-gradient(90deg, #1e8fb0, #46b8a8); border-radius: 3px; transition: width .5s; width: 0; }
  .side-search { padding: 12px 14px 6px; }
  .side-search input {
    width: 100%; padding: 8px 10px; border-radius: 7px; font-size: .78rem;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.10); color: #fff;
  }
  .side-search input::placeholder { color: #6f8791; }
  .side-search input:focus { outline: none; border-color: #2b9cbd; background: rgba(255,255,255,.11); }
  nav { flex: 1; overflow-y: auto; padding: 6px 0 20px; }
  nav::-webkit-scrollbar { width: 7px; }
  nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 4px; }
  .nav-group-label {
    font-size: .6rem; color: #6f8791; text-transform: uppercase; letter-spacing: .1em;
    padding: 14px 20px 5px; font-weight: 700;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 20px; cursor: pointer;
    font-size: .8rem; color: var(--side-text); border-left: 3px solid transparent; transition: all .15s;
  }
  .nav-item:hover { background: var(--side2); color: #fff; }
  .nav-item.active { background: var(--side2); color: #fff; border-left-color: #34a7c9; font-weight: 600; }
  .nav-item .ico { width: 18px; text-align: center; font-size: .95rem; flex: none; }
  .nav-item .txt { flex: 1; line-height: 1.3; }
  .nav-item .dot { width: 7px; height: 7px; border-radius: 50%; background: transparent; flex: none; }
  .nav-item.started .dot { background: var(--accent2); }
  .nav-item.done .dot { background: #35c98a; }

  /* ---------- MAIN ---------- */
  #main { margin-left: 274px; min-height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,.93); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border); padding: 14px 34px;
    display: flex; align-items: center; gap: 16px;
  }
  .topbar .crumb { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .topbar h2 { font-size: 1.12rem; font-weight: 700; margin-top: 2px; }
  .topbar .spacer { flex: 1; }
  .btn {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; font-size: .78rem; font-weight: 600; color: var(--ink); transition: all .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #0b5670; color: #fff; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--surface2); color: var(--ink); }
  .btn.danger { color: var(--danger); border-color: var(--border); }
  .btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  .btn.sm { padding: 5px 10px; font-size: .72rem; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  #menu-toggle { display: none; }

  .content { padding: 26px 34px 80px; max-width: 1100px; width: 100%; }
  .lede { color: var(--muted); font-size: .87rem; line-height: 1.65; max-width: 800px; margin-bottom: 22px; }

  /* ---------- CARDS ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .card > h3 { font-size: .95rem; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .card > .hint { font-size: .78rem; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
  .card.flat { box-shadow: none; background: var(--surface2); }
  .card.accent { border-left: 4px solid var(--accent); }

  .principle {
    background: linear-gradient(135deg, rgba(15,111,143,.09), rgba(185,106,36,.07));
    border: 1px solid rgba(15,111,143,.22); border-radius: 12px; padding: 16px 20px; margin-bottom: 20px;
  }
  .principle .k { font-size: .62rem; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 700; }
  .principle p { font-size: .88rem; line-height: 1.65; margin-top: 6px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
  .grid4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
  .grid5 { display: grid; grid-template-columns: repeat(5,1fr); gap: 12px; }
  @media (max-width: 1000px) { .grid2, .grid3, .grid4, .grid5 { grid-template-columns: 1fr; } }

  /* ---------- STAT TILES ---------- */
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 16px 18px; }
  .stat .lab { font-size: .66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
  .stat .val { font-size: 1.5rem; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; }
  .stat .sub { font-size: .72rem; color: var(--muted); margin-top: 4px; line-height: 1.45; }
  .stat.hi { background: var(--accent-soft); border-color: rgba(15,111,143,.3); }
  .stat.hi .val { color: var(--accent); }
  .stat.warn { background: var(--accent2-soft); border-color: rgba(185,106,36,.3); }
  .stat.warn .val { color: var(--accent2); }
  .stat.ok { background: var(--ok-soft); border-color: rgba(44,133,88,.3); }
  .stat.ok .val { color: var(--ok); }
  .stat.bad { background: var(--danger-soft); border-color: rgba(192,65,72,.3); }
  .stat.bad .val { color: var(--danger); }
  .stat.pur { background: var(--purple-soft); border-color: rgba(108,83,181,.3); }
  .stat.pur .val { color: var(--purple); }

  /* ---------- FORM ---------- */
  .f { margin-bottom: 14px; }
  .f > label { display: block; font-size: .74rem; font-weight: 600; margin-bottom: 5px; }
  .f > .help { font-size: .71rem; color: var(--muted); margin-bottom: 6px; line-height: 1.5; }
  input[type=text], input[type=number], input[type=date], input[type=time], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); font-size: .84rem; transition: border-color .15s, box-shadow .15s;
  }
  textarea { resize: vertical; min-height: 74px; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[readonly] { background: var(--surface2); color: var(--muted); }
  .inline { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .inline .f { flex: 1; min-width: 150px; margin-bottom: 0; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }

  /* ---------- CHECKLIST ---------- */
  .chk { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: .82rem; line-height: 1.5; }
  .chk:hover { background: var(--surface2); }
  .chk input { margin-top: 3px; width: 15px; height: 15px; accent-color: var(--accent); flex: none; cursor: pointer; }
  .chk.on > span { color: var(--muted); text-decoration: line-through; }
  .chk .sub { display: block; font-size: .72rem; color: var(--muted); text-decoration: none !important; margin-top: 2px; }

  /* ---------- REPEATER TABLE ---------- */
  .rep { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .rep-head, .rep-row { display: grid; gap: 8px; padding: 8px 10px; align-items: center; }
  .rep-head { background: var(--surface2); font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
  .rep-row { border-top: 1px solid var(--border); }
  .rep-row:nth-child(even) { background: rgba(0,0,0,.012); }
  .rep-row input, .rep-row select, .rep-row textarea { padding: 6px 8px; font-size: .78rem; }
  .rep-row textarea { min-height: 38px; }
  .rep-empty { padding: 16px; text-align: center; color: var(--muted); font-size: .78rem; border-top: 1px solid var(--border); }
  .rep-foot { padding: 8px 10px; border-top: 1px solid var(--border); background: var(--surface2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row-del { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: .85rem; padding: 4px; border-radius: 6px; }
  .row-del:hover { background: var(--danger-soft); color: var(--danger); }
  @media (max-width: 920px) { .rep-head { display:none; } .rep-row { grid-template-columns: 1fr !important; } }

  /* ---------- BARS ---------- */
  .bar { margin-bottom: 10px; }
  .bar .top { display: flex; justify-content: space-between; font-size: .76rem; margin-bottom: 4px; }
  .bar .top .v { font-weight: 700; }
  .bar .track { height: 9px; background: var(--surface3); border-radius: 5px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 5px; background: var(--accent); transition: width .35s; }
  .bar .fill.low { background: var(--danger); }
  .bar .fill.mid { background: var(--accent2); }
  .bar .fill.high { background: var(--ok); }

  /* ---------- MISC ---------- */
  .tag { font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 20px; background: var(--surface3); color: var(--muted); }
  .tag.a { background: var(--accent-soft); color: var(--accent); }
  .tag.b { background: var(--accent2-soft); color: var(--accent2); }
  .tag.g { background: var(--ok-soft); color: var(--ok); }
  .tag.r { background: var(--danger-soft); color: var(--danger); }
  .tag.p { background: var(--purple-soft); color: var(--purple); }
  .callout { border-radius: 10px; padding: 13px 16px; font-size: .8rem; line-height: 1.6; margin: 14px 0; border: 1px solid; }
  .callout.info { background: var(--accent-soft); border-color: rgba(15,111,143,.25); }
  .callout.warn { background: var(--accent2-soft); border-color: rgba(185,106,36,.3); }
  .callout.bad { background: var(--danger-soft); border-color: rgba(192,65,72,.3); }
  .callout.good { background: var(--ok-soft); border-color: rgba(44,133,88,.3); }
  .callout b { display: block; margin-bottom: 3px; }
  .quote { font-size: 1rem; line-height: 1.85; font-style: italic; padding: 20px 24px; background: var(--surface2); border-left: 4px solid var(--accent); border-radius: 8px; }
  .quote .attr { display: block; font-style: normal; font-size: .74rem; color: var(--muted); margin-top: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); font-size: .74rem; cursor: pointer; margin: 0 6px 6px 0; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sect { font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; margin: 22px 0 10px; }
  .divider { height: 1px; background: var(--border); margin: 18px 0; }
  .muted { color: var(--muted); }
  .sm { font-size: .76rem; }
  .center { text-align: center; }
  .mono { font-variant-numeric: tabular-nums; }
  .nowrap { white-space: nowrap; }
  ul.plain { list-style: none; }
  ul.bul { padding-left: 18px; font-size: .81rem; line-height: 1.7; }
  ul.bul li { margin-bottom: 3px; }
  ol.bul { padding-left: 20px; font-size: .81rem; line-height: 1.7; }
  ol.bul li { margin-bottom: 4px; }
  .scrollx { overflow-x: auto; }
  code.k { background: var(--surface3); padding: 1px 5px; border-radius: 4px; font-size: .78rem; }

  /* ---------- OUTPUT BOX ---------- */
  .outbox {
    background: var(--side); color: #dfeaee; border-radius: 10px; padding: 16px 18px;
    font-size: .84rem; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
    font-family: 'Segoe UI', system-ui, sans-serif; min-height: 60px;
  }
  .outbox b { color: #7fd0e8; }
  .outbox.light { background: var(--surface2); color: var(--ink); border: 1px solid var(--border); }
  .outbox.light b { color: var(--accent); }

  /* ---------- BOARD COLUMNS ---------- */
  .cols { display: grid; gap: 12px; }
  .col { border: 1px solid var(--border); border-radius: 11px; background: var(--surface2); padding: 10px; }
  .col > .h { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 8px; display:flex; gap:6px; align-items:center; }
  .pcard { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: .78rem; line-height: 1.45; margin-bottom: 7px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .pcard .t { font-weight: 600; }
  .pcard .m { font-size: .69rem; color: var(--muted); margin-top: 3px; }
  .pcard.ghost { background: transparent; border-style: dashed; color: var(--muted); text-align: center; }

  /* ---------- TABLE ---------- */
  table.tbl { width: 100%; border-collapse: collapse; font-size: .79rem; }
  table.tbl th { text-align: left; background: var(--surface2); font-size: .65rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.5; }
  table.tbl tr:last-child td { border-bottom: none; }
  table.tbl tbody tr:hover { background: rgba(15,111,143,.04); }
  table.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rank1 { background: var(--accent-soft) !important; }

  /* ---------- SVG CHART ---------- */
  .chartwrap { width: 100%; overflow-x: auto; }
  svg.chart { display: block; width: 100%; height: auto; min-width: 520px; }
  svg.chart text { font-family: 'Segoe UI', system-ui, sans-serif; }
  .ax { stroke: #d8e2e6; stroke-width: 1; }
  .gl { stroke: #dde7ea; stroke-width: 1; }
  .axt { font-size: 10px; fill: #5c7079; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .73rem; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .legend i.sq { height: 10px; width: 10px; border-radius: 2px; }

  /* ---------- TOAST ---------- */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 9px; font-size: .8rem;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 200; box-shadow: 0 6px 24px rgba(0,0,0,.25);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 55; }
  @media (max-width: 880px) {
    #sidebar { transform: translateX(-100%); }
    #sidebar.open { transform: translateX(0); }
    #main { margin-left: 0; }
    #menu-toggle { display: inline-block; }
    #overlay.show { display: block; }
    .content { padding: 20px 16px 70px; }
    .topbar { padding: 12px 16px; }
  }
  @media print {
    #sidebar, .topbar, #toast, .btn, .row-del { display: none !important; }
    #main { margin-left: 0; }
    .card { break-inside: avoid; box-shadow: none; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <div class="brand">
    <h1>Product Owner</h1>
    <p>Interactive product ownership toolkit</p>
  </div>
  <div class="side-progress">
    <div class="lbl"><span>Tools used</span><span id="prog-txt">0/0</span></div>
    <div class="track"><div class="fill" id="prog-fill"></div></div>
  </div>
  <div class="side-search"><input type="text" id="nav-search" placeholder="Search tools…"></div>
  <nav id="nav"></nav>
</div>
<div id="overlay"></div>

<div id="main">
  <div class="topbar">
    <button class="btn sm" id="menu-toggle">☰</button>
    <div>
      <div class="crumb" id="crumb"></div>
      <h2 id="page-title"></h2>
    </div>
    <div class="spacer"></div>
    <button class="btn sm ghost" data-act="core.print">🖨 Print</button>
    <button class="btn sm" data-act="core.export">⬇ Backup</button>
    <button class="btn sm" data-act="core.import">⬆ Restore</button>
  </div>
  <div class="content" id="content"></div>
</div>

<div id="toast"></div>
<input type="file" id="file-input" accept=".json" style="display:none">

<script>
/* ============================================================
   CORE — state, storage, helpers
   ============================================================ */
const STORE_KEY = 'product-owner-v1';
let data = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
let currentPage = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const today = () => new Date().toISOString().slice(0, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const r1 = n => Math.round(n * 10) / 10;
const r2 = n => Math.round(n * 100) / 100;

let saveTimer = null;
function save(immediate) {
  if (saveTimer) clearTimeout(saveTimer);
  const doIt = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) { toast('Storage full — download a backup'); } markNav(); };
  if (immediate) doIt(); else saveTimer = setTimeout(doIt, 250);
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

function get(path, dflt) {
  const v = path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), data);
  return v === undefined || v === null || v === '' ? (dflt !== undefined ? dflt : '') : v;
}
function set(path, val) {
  const keys = path.split('.');
  let o = data;
  for (let i = 0; i < keys.length - 1; i++) { if (typeof o[keys[i]] !== 'object' || o[keys[i]] === null) o[keys[i]] = {}; o = o[keys[i]]; }
  o[keys[keys.length - 1]] = val;
}
function list(path) {
  const keys = path.split('.');
  let o = data;
  for (let i = 0; i < keys.length - 1; i++) { if (typeof o[keys[i]] !== 'object' || o[keys[i]] === null) o[keys[i]] = {}; o = o[keys[i]]; }
  const last = keys[keys.length - 1];
  if (!Array.isArray(o[last])) o[last] = [];
  return o[last];
}
function addRow(path, row) { list(path).push(Object.assign({ id: uid() }, row)); save(true); render(); }
function delRow(path, id) { const l = list(path); const i = l.findIndex(r => r.id === id); if (i > -1) l.splice(i, 1); save(true); render(); }
function moveRow(path, id, dir) {
  const l = list(path); const i = l.findIndex(r => r.id === id); const j = i + dir;
  if (i < 0 || j < 0 || j >= l.length) return;
  const t = l[i]; l[i] = l[j]; l[j] = t; save(true); render();
}

/* ---------- control builders ---------- */
function attrs(o) { return Object.entries(o).filter(([k, v]) => v !== undefined && v !== false).map(([k, v]) => v === true ? k : `${k}="${esc(v)}"`).join(' '); }

function inp(path, o = {}) {
  const v = get(path, o.dflt !== undefined ? o.dflt : '');
  return `<input type="${o.type || 'text'}" data-path="${path}" ${o.live ? 'data-live' : ''} value="${esc(v)}" ${attrs({ placeholder: o.ph, min: o.min, max: o.max, step: o.step, readonly: o.ro })}>`;
}
function ta(path, o = {}) {
  return `<textarea data-path="${path}" ${o.live ? 'data-live' : ''} ${attrs({ placeholder: o.ph, rows: o.rows, style: o.style })}>${esc(get(path, o.dflt || ''))}</textarea>`;
}
function sel(path, options, o = {}) {
  const v = get(path, o.dflt || '');
  const opts = options.map(x => {
    const val = typeof x === 'string' ? x : x.v, lab = typeof x === 'string' ? x : x.l;
    return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`;
  }).join('');
  return `<select data-path="${path}" ${o.live ? 'data-live' : ''}>${o.blank !== false ? `<option value="">${esc(o.blank || '— choose —')}</option>` : ''}${opts}</select>`;
}
function field(label, control, help) {
  return `<div class="f"><label>${label}</label>${help ? `<div class="help">${help}</div>` : ''}${control}</div>`;
}
function range(path, o = {}) {
  const v = num(get(path, o.dflt !== undefined ? o.dflt : 3));
  return `<div class="inline"><input type="range" style="flex:1;padding:0" min="${o.min || 1}" max="${o.max || 5}" step="${o.step || 1}" value="${v}" data-path="${path}" data-live>
    <span class="mono" style="min-width:34px;text-align:right;font-weight:700" id="rv_${path.replace(/\./g, '_')}">${v}</span></div>`;
}
function ckey(path, it) { return `${path}.${(typeof it === 'string' ? it : (it.k || it.l)).slice(0, 34).replace(/\W/g, '')}`; }
function checklist(path, items) {
  return items.map(it => {
    const label = typeof it === 'string' ? it : it.l;
    const sub = typeof it === 'string' ? '' : it.s;
    const key = ckey(path, it);
    const on = get(key, false) === true;
    return `<label class="chk ${on ? 'on' : ''}"><input type="checkbox" data-path="${key}" data-live ${on ? 'checked' : ''}><span>${esc(label)}${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</span></label>`;
  }).join('');
}
function checkDone(path, items) { return items.filter(it => get(ckey(path, it), false) === true).length; }
function bar(label, value, max, suffix) {
  const p = max ? clamp(value / max * 100, 0, 100) : 0;
  const cls = p < 40 ? 'low' : p < 70 ? 'mid' : 'high';
  return `<div class="bar"><div class="top"><span>${label}</span><span class="v">${suffix !== undefined ? suffix : r1(value)}</span></div>
    <div class="track"><div class="fill ${cls}" style="width:${p}%"></div></div></div>`;
}
function stat(lab, val, sub, cls) {
  return `<div class="stat ${cls || ''}"><div class="lab">${lab}</div><div class="val">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
}
function card(title, hint, body, cls) {
  return `<div class="card ${cls || ''}">${title ? `<h3>${title}</h3>` : ''}${hint ? `<div class="hint">${hint}</div>` : ''}${body}</div>`;
}
function callout(kind, title, body) { return `<div class="callout ${kind}">${title ? `<b>${title}</b>` : ''}${body}</div>`; }
function delBtn(path, id) { return `<button class="row-del" data-del="${path}" data-id="${id}" title="Delete">✕</button>`; }
function addBtn(path, tpl, label) { return `<button class="btn sm" data-add="${path}" data-tpl="${esc(JSON.stringify(tpl || {}))}">+ ${label || 'Add row'}</button>`; }
function act(name, label, cls) { return `<button class="btn ${cls || 'sm'}" data-act="${name}">${label}</button>`; }
function copyBtn(elId, label) { return `<button class="btn sm" data-copy="${elId}">📋 ${label || 'Copy'}</button>`; }

function repeater(path, fields, o = {}) {
  const items = list(path);
  const cols = fields.map(f => f.w || '1fr').join(' ') + (o.move ? ' 52px' : '') + ' 30px';
  let h = `<div class="rep"><div class="rep-head" style="grid-template-columns:${cols}">${fields.map(f => `<div>${esc(f.label)}</div>`).join('')}${o.move ? '<div></div>' : ''}<div></div></div>`;
  if (!items.length) h += `<div class="rep-empty">${esc(o.empty || 'Nothing yet — add the first row below.')}</div>`;
  items.forEach((it, i) => {
    h += `<div class="rep-row" style="grid-template-columns:${cols}">`;
    fields.forEach(f => {
      const p = `${path}.${i}.${f.k}`;
      if (f.type === 'ta') h += ta(p, { ph: f.ph, live: f.live });
      else if (f.type === 'sel') h += sel(p, f.options, { blank: f.blank, live: f.live, dflt: f.dflt });
      else if (f.type === 'chk') h += `<div class="center"><input type="checkbox" data-path="${p}" data-live ${get(p, false) === true ? 'checked' : ''} style="width:16px;height:16px;accent-color:var(--accent)"></div>`;
      else if (f.type === 'ro') h += `<div class="sm mono" style="font-weight:600">${f.val ? f.val(it, i) : ''}</div>`;
      else h += inp(p, { type: f.type || 'text', ph: f.ph, min: f.min, max: f.max, step: f.step, live: f.live, dflt: f.dflt });
    });
    if (o.move) h += `<div class="nowrap"><button class="row-del" data-move="${path}" data-id="${it.id}" data-dir="-1" title="Move up">▲</button><button class="row-del" data-move="${path}" data-id="${it.id}" data-dir="1" title="Move down">▼</button></div>`;
    h += delBtn(path, it.id) + `</div>`;
  });
  h += `<div class="rep-foot">${addBtn(path, o.tpl, o.addLabel)}${o.extra || ''}</div></div>`;
  return h;
}

/* ---------- clipboard ---------- */
function copyText(txt) {
  navigator.clipboard.writeText(txt).then(() => toast('Copied to clipboard')).catch(() => {
    const t2 = document.createElement('textarea'); t2.value = txt; document.body.appendChild(t2); t2.select();
    document.execCommand('copy'); t2.remove(); toast('Copied to clipboard');
  });
}

/* ---------- tiny SVG chart helpers ---------- */
function svgOpen(w, h) { return `<div class="chartwrap"><svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">`; }
function svgClose() { return `</svg></div>`; }
function pathOf(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + r1(p[0]) + ' ' + r1(p[1])).join(' '); }
function legend(items) { return `<div class="legend">${items.map(i => `<span><i class="${i.sq ? 'sq' : ''}" style="background:${i.c}"></i>${esc(i.l)}</span>`).join('')}</div>`; }

function visionText() {

function lifeLive() {
  const c = $('calc_life'); if (!c) return;
  const stage = get('life.stage', '');
  const W = 660, H = 210, pad = 34;
  const curve = [];
  for (let i = 0; i <= 100; i++) {
    const x = pad + (W - pad * 2) * i / 100;
    const t = i / 100;
    const y = H - 30 - (H - 70) * (Math.exp(-Math.pow((t - 0.55) * 2.9, 2)) * 0.95 + (t < 0.55 ? 0 : 0));
    curve.push([x, y]);
  }
  const zones = [['launch', 0, 0.16], ['growth', 0.16, 0.44], ['maturity', 0.44, 0.68], ['decline', 0.68, 0.88], ['retire', 0.88, 1]];
  let svg = svgOpen(W, H);
  zones.forEach(([k, a, b]) => {
    const x1 = pad + (W - pad * 2) * a, x2 = pad + (W - pad * 2) * b;
    const S = LIFE.find(s => s.k === k);
    svg += `<rect x="${r1(x1)}" y="14" width="${r1(x2 - x1)}" height="${H - 44}" fill="${stage === k ? 'rgba(15,111,143,.14)' : 'rgba(0,0,0,.02)'}" stroke="#dde7ea"/>`;

  });
  svg += `<path d="${pathOf(curve)}" fill="none" stroke="#0f6f8f" stroke-width="2.5"/>`;
  svg += `<line class="ax" x1="${pad}" y1="${H - 30}" x2="${W - pad}" y2="${H - 30}"/>`;

const SIZES = [{ v: 1, l: '1 — trivial' }, { v: 2, l: '2' }, { v: 3, l: '3' }, { v: 5, l: '5' }, { v: 8, l: '8' }, { v: 13, l: '13 — too big?' }, { v: 20, l: '20 — must split' }];
function itemPath(i) { return 'backlog.items.' + i; }
function orderWeights() {
  return {
    value: num(get('order.w.value', 3)), risk: num(get('order.w.risk', 2)),
    learn: num(get('order.w.learn', 2)), dep: num(get('order.w.dep', 2)),
  };
}
function orderScore(i) {
  const w = orderWeights();
  const v = num(get(itemPath(i) + '.value', 0)), rk = num(get(itemPath(i) + '.risk', 0));
  const ln = num(get(itemPath(i) + '.learn', 0)), dp = num(get(itemPath(i) + '.dep', 0));
  const sz = Math.max(1, num(get(itemPath(i) + '.size', 3)));
  const raw = v * w.value + rk * w.risk + ln * w.learn + dp * 2 * w.dep;
  const wsum = (w.value + w.risk + w.learn + w.dep) || 1;
  return (raw / wsum) / sz * 10;
}

function orderLive() {

      <ul class="bul">
        <li><b>Items are countable without negotiation.</b> Points drift as a team recalibrates; item counts do not.</li>
        <li><b>Monte Carlo needs samples, not averages.</b> The spread between your worst and best Sprint <i>is</i> the forecast.</li>
        <li><b>Splitting improves item counts honestly.</b> Smaller items raise throughput and reduce variability — a real improvement, not gaming.</li>
        <li><b>Never use throughput as a target.</b> The moment it becomes a goal, it stops being data. See <span data-page="antipatterns" style="cursor:pointer;color:var(--accent);font-weight:600">Metric Anti-Patterns</span>.</li>

function flowLive() {
  const c = $('calc_flow'); if (!c) return;
  const s = list('flow.sprints');
  const vals = throughputSamples();
  if (!vals.length) { c.innerHTML = callout('warn', 'No data yet', 'Add at least five Sprints of completed-item counts to unlock the Monte Carlo forecast.'); return; }
  const W = 700, H = 220, pad = 40;
  const maxV = Math.max(...vals, 1);
  const step = vals.length > 1 ? (W - pad * 2) / (vals.length - 1) : 0;
  const y = v => H - 34 - (v / maxV) * (H - 64);
  const pts = vals.map((v, i) => [pad + i * step, y(v)]);
  let svg = svgOpen(W, H);
  for (let g = 0; g <= 4; g++) {
    const yy = 26 + (H - 60) * g / 4;
    svg += `<line class="gl" x1="${pad}" y1="${r1(yy)}" x2="${W - pad}" y2="${r1(yy)}"/>`;
    svg += `<text class="axt" x="${pad - 6}" y="${r1(yy + 3)}" text-anchor="end">${Math.round(maxV * (1 - g / 4))}</text>`;
  }
  const m = avg(vals);
  svg += `<line x1="${pad}" y1="${r1(y(m))}" x2="${W - pad}" y2="${r1(y(m))}" stroke="#b96a24" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  svg += `<text class="axt" x="${W - pad}" y="${r1(y(m) - 5)}" text-anchor="end" style="fill:#b96a24">mean ${r1(m)}</text>`;
  if (pts.length > 1) svg += `<path d="${pathOf(pts)}" fill="none" stroke="#0f6f8f" stroke-width="2.5"/>`;
  pts.forEach((p, i) => {

function simulate(vals, scope, maxSprints, growthPct) {
  const TRIALS = 10000;
  const results = [];
  const capacity = [];
  const pick = () => vals[Math.floor(Math.random() * vals.length)];
  for (let t = 0; t < TRIALS; t++) {
    // Question 1 — how many Sprints until the scope is finished?
    let remaining = scope, sprints = 0;
    while (remaining > 0 && sprints < 200) {
      remaining -= pick();
      if (remaining > 0) remaining += remaining * (growthPct / 100);
      sprints++;
    }
    results.push(sprints);
    // Question 2 — how many items get finished in a fixed number of Sprints?
    let delivered = 0;
    for (let s = 0; s < maxSprints; s++) delivered += pick();
    capacity.push(delivered);
  }
  results.sort((a, b) => a - b); capacity.sort((a, b) => a - b);
  const q = (arr, p) => arr[clamp(Math.floor(p * (arr.length - 1)), 0, arr.length - 1)];
  return {
    // Later date = more confident.
    sprints: { p50: q(results, .5), p70: q(results, .7), p85: q(results, .85), p95: q(results, .95) },
    // Fewer items = more confident, so confidence reads from the LOW tail.
    capacity: { p50: q(capacity, .5), p70: q(capacity, .3), p85: q(capacity, .15), p95: q(capacity, .05) },
    raw: results,
  };
}
function addWeeks(dateStr, weeks) {
  const d = dateStr ? new Date(dateStr) : new Date();
  if (isNaN(d)) return '';
  d.setDate(d.getDate() + Math.round(weeks * 7));
  return d.toISOString().slice(0, 10);
}

function burnLive() {
  const c = $('calc_burn'); if (!c) return;
  const rows = list('burn.rows');
  if (rows.length < 2) { c.innerHTML = callout('warn', 'Need at least two Sprints', 'Two data points is the minimum for a trend; three or more before you trust the cone.'); return; }
  const mode = get('burn.mode', 'up');
  const proj = Math.max(1, num(get('burn.proj', 6)));
  const len = Math.max(1, num(get('burn.len', 2)));
  const dat = rows.map((r, i) => ({

  const deltas = [];
  for (let i = 1; i < dat.length; i++) deltas.push(Math.max(0, dat[i].done - dat[i - 1].done));
  const best = deltas.length ? Math.max(...deltas) : 0;
  const worst = deltas.length ? Math.min(...deltas) : 0;

  for (let k = 1; k <= proj; k++) { if (proj <= 8 || k % 2 === 0) svg += `<text class="axt" x="${r1(X(n - 1 + k))}" y="${H - padB + 14}" text-anchor="middle" style="fill:#8fa3ab">+${k}</text>`; }

  c.innerHTML = card(mode === 'up' ? 'Burn-up with cone of uncertainty' : 'Burn-down with cone of uncertainty',

    svg + legend(mode === 'up'
      ? [{ c: '#0f6f8f', l: 'completed' }, { c: '#b96a24', l: 'total scope' }, { c: '#2c8558', l: 'optimistic' }, { c: '#c04148', l: 'pessimistic' }]

  const W = 460, H = 400, pad = 52;
  let svg = svgOpen(W, H);
  svg += `<rect x="${pad}" y="20" width="${W - pad - 20}" height="${H - pad - 20}" fill="none" stroke="#d8e2e6"/>`;
  svg += `<line class="gl" x1="${pad + (W - pad - 20) / 2}" y1="20" x2="${pad + (W - pad - 20) / 2}" y2="${H - pad}"/>`;
  svg += `<line class="gl" x1="${pad}" y1="${20 + (H - pad - 20) / 2}" x2="${W - 20}" y2="${20 + (H - pad - 20) / 2}"/>`;
  const qlab = [['Keep informed', pad + 8, H - pad - 10, '#0f6f8f'], ['Involve in decisions', pad + (W - pad - 20) / 2 + 8, 36, '#c04148'], ['Monitor', pad + 8, 36, '#8fa3ab'], ['Keep satisfied', pad + (W - pad - 20) / 2 + 8, H - pad - 10, '#b96a24']];
  qlab.forEach(([t, x, y, col]) => { svg += `<text x="${x}" y="${y}" style="font-size:10px;font-weight:700;fill:${col}">${t}</text>`; });
  const X = v => pad + (W - pad - 20) * ((clamp(v, 1, 5) - 1) / 4);
  const Y = v => (H - pad) - (H - pad - 20) * ((clamp(v, 1, 5) - 1) / 4);
  const stanceColor = { Champion: '#2c8558', Supportive: '#0f6f8f', Neutral: '#8fa3ab', 'Sceptical': '#b96a24', Blocker: '#c04148' };
  const overdue = [];
  people.forEach((p, i) => {
    const inf = num(get('stake.people.' + i + '.infl', 3)), it = num(get('stake.people.' + i + '.int', 3));
    const st = get('stake.people.' + i + '.stance', 'Neutral');
    const nm = get('stake.people.' + i + '.name', '?');
    const jx = ((i % 3) - 1) * 7, jy = ((i % 2) ? 1 : -1) * 6;
    svg += `<circle cx="${r1(X(it) + jx)}" cy="${r1(Y(inf) + jy)}" r="7" fill="${stanceColor[st] || '#8fa3ab'}" opacity=".85"/>`;
    svg += `<text x="${r1(X(it) + jx + 11)}" y="${r1(Y(inf) + jy + 4)}" style="font-size:10px;fill:#11242c">${esc(nm.slice(0, 14))}</text>`;
    const ds = daysSince(get('stake.people.' + i + '.last', ''));
    const limit = CADENCE_DAYS[get('stake.people.' + i + '.cadence', 'Sprint')] || 14;
    if (ds === null || ds > limit) overdue.push({ nm, ds, limit, inf });
  });
  svg += `<text class="axt" x="${W / 2}" y="${H - 14}" text-anchor="middle">interest →</text>`;
  svg += `<text class="axt" x="16" y="${H / 2}" text-anchor="middle" transform="rotate(-90 16 ${H / 2})">influence →</text>`;
  svg += svgClose();
  const blockers = people.filter((p, i) => get('stake.people.' + i + '.stance', '') === 'Blocker');
  const champions = people.filter((p, i) => get('stake.people.' + i + '.stance', '') === 'Champion');
  const highInfLowInt = people.filter((p, i) => num(get('stake.people.' + i + '.infl', 3)) >= 4 && num(get('stake.people.' + i + '.int', 3)) <= 2);
  c.innerHTML = card('The map', 'Dot colour is stance. Names are jittered so they do not overlap.', svg +
    legend(Object.entries(stanceColor).map(([l, cc]) => ({ c: cc, l, sq: true }))) +
    `<div class="grid4" style="margin-top:16px">
      ${stat('Mapped', people.length, 'stakeholders', people.length >= 4 ? 'ok' : 'warn')}
      ${stat('Overdue a conversation', overdue.length, overdue.length ? overdue.slice(0, 2).map(o => o.nm).join(', ') : 'all current', overdue.length ? 'bad' : 'ok')}
      ${stat('Champions', champions.length, 'use them at Sprint Review', champions.length ? 'ok' : 'warn')}
      ${stat('Blockers', blockers.length, blockers.length ? 'needs a plan each' : 'none', blockers.length ? 'bad' : 'ok')}
    </div>` +
    (overdue.length ? callout('warn', 'Conversations overdue', overdue.map(o => `<b>${esc(o.nm)}</b> — ${o.ds === null ? 'never recorded' : o.ds + ' days ago'} (cadence: every ${o.limit === 9999 ? 'as needed' : o.limit + ' days'})`).join('<br>')) : '') +
    (highInfLowInt.length ? callout('info', 'High influence, low interest', `${highInfLowInt.map((p, n) => esc(get('stake.people.' + people.indexOf(p) + '.name', '?'))).join(', ')} — this is the quadrant that surprises Product Owners. They are not paying attention until suddenly they are. Short monthly summaries prevent late interventions.`) : '') +
    (blockers.length ? callout('bad', 'Blockers on the map', 'A blocker with high influence is a risk to the Product Goal, not a personality problem. Find out what they are protecting — it is usually a legitimate concern expressed badly.') : ''), 'flat');
}

      </div>`);

    h += card('The evidence', 'Data is what makes a no discussable rather than personal.', `
      ${field('Usage or value data that bears on it', ta('no.data', { ph: 'e.g. the existing report is opened by 4% of teams; the last three requests for it came from one account', rows: 2, live: true }), 'Pull from your EBM measures and product metrics.')}
      ${field('What we already tried here', ta('no.tried', { ph: 'Previous attempts and what happened.', rows: 2 }))}

      return sel('no.displace', ranked.map(r => itemTitle(r.i)), { blank: '— choose from the top of the backlog —', live: true });

function noLive() {
  const c = $('calc_no');
  const serves = get('no.serves', ''), persona = get('no.persona', '');
  const sz = num(get('no.size', 0));
  const disp = get('no.displace', '');
  if (c) {
    const alignScore = ({ 'Directly serves it': 3, 'Indirectly related': 2, 'Unrelated': 1, 'Actively pulls against it': 0 })[serves];
    const personaScore = ({ 'A primary persona': 3, 'A secondary persona': 2, 'Someone we chose not to serve': 0, 'Nobody we can name': 0 })[persona];
    let verdict = null;
    if (alignScore !== undefined && personaScore !== undefined) {
      const t = alignScore + personaScore;
      verdict = t >= 5 ? { k: 'good', t: 'This probably deserves a yes', d: 'It serves the goal and a persona you chose to serve. The remaining question is only what it displaces.' }
        : t >= 3 ? { k: 'warn', t: 'Borderline — defer rather than decline', d: 'Real but not aligned enough to displace goal-serving work. "Not now, and here is when" is usually the honest answer.' }
          : { k: 'bad', t: 'This is a no', d: 'It does not serve the Product Goal or a persona you chose. Decline it clearly, with the evidence, and offer the alternative.' };
    }
    c.innerHTML = card('Assessment', '', `<div class="grid4">
      ${stat('Goal alignment', serves ? serves.split(' ')[0] : '—', serves || 'assess it above', alignScore >= 3 ? 'ok' : alignScore >= 2 ? 'warn' : alignScore !== undefined ? 'bad' : '')}
      ${stat('Persona fit', persona ? (persona.includes('primary') ? 'Primary' : persona.includes('secondary') ? 'Secondary' : 'Outside') : '—', '', personaScore >= 3 ? 'ok' : personaScore >= 2 ? 'warn' : personaScore !== undefined ? 'bad' : '')}
      ${stat('Cost', sz ? sz + ' points' : '—', disp ? 'displaces work' : 'size it', sz >= 8 ? 'bad' : sz ? 'warn' : '')}
      ${stat('Evidence', get('no.data', '') ? 'Have it' : 'None', get('no.data', '') ? 'use it in the conversation' : 'a no without data is an opinion', get('no.data', '') ? 'ok' : 'bad')}
    </div>` + (verdict ? callout(verdict.k, verdict.t, verdict.d) : ''), 'flat');
  }
  const o = $('no-out'); if (!o) return;
  const who = get('no.who', '') || 'there';
  const req = get('no.request', '');
  if (!req) { o.textContent = 'Describe the request above and the script appears here.'; return; }
  const L = [];
  L.push(`${who}, thank you — let me tell you where this sits and why.`);
  L.push(`What I understand you are asking for: ${req}${get('no.need', '') ? `\nAnd what you are really trying to achieve: ${get('no.need')}.` : ''}`);
  if (get('goal.statement', '')) L.push(`Our current Product Goal is: ${get('goal.statement')}${get('goal.metric', '') ? ` — measured by ${get('goal.metric')}${get('goal.target', '') ? `, target ${get('goal.target')}` : ''}.` : '.'}`);
  if (serves) L.push(`Against that goal, this request is ${serves.toLowerCase()}.`);
  if (get('no.data', '')) L.push(`What the evidence says: ${get('no.data')}`);
  if (sz || disp) L.push(`The cost of doing it now: roughly ${sz || '?'} points of work, which would displace ${disp || 'work already ordered above it'}. That is the specific trade-off, not a general "we are busy".`);
  const dec = get('no.decision', '');
  if (dec) L.push(`My decision: ${dec}.`);
  if (get('no.alt', '')) L.push(`What I can offer instead: ${get('no.alt')}`);
  if (get('no.revisit', '')) L.push(`I will bring this back on ${get('no.revisit')} with fresh data, whatever it says.`);
  L.push(`If you think I have the evidence wrong, tell me now — I would rather change my mind here than discover it in three Sprints.`);
  o.textContent = L.join('\n\n');
}

function priceLive() {

  if (!p && !u) { c.innerHTML = ''; return; }
  const margin = p ? (p - cost) / p * 100 : 0;
  const mrr = p * u;
  const gross = (p - cost) * u;

  const newMrr = newP * newU, newGross = (newP - cost) * newU;

  c.innerHTML = card('What the numbers say', '', `<div class="grid4">
    ${stat('Gross margin', p ? Math.round(margin) + '%' : '—', p ? `${fmt(p - cost)} per unit` : '', margin >= 70 ? 'ok' : margin >= 40 ? 'warn' : p ? 'bad' : '')}
    ${stat('MRR', mrr ? fmt(mrr) : '—', u ? u + ' units' : '', mrr ? 'hi' : '')}
    ${stat('Monthly gross profit', gross ? fmt(gross) : '—', '', gross > 0 ? 'ok' : gross < 0 ? 'bad' : '')}
    ${stat('Lifetime value', ltv ? fmt(ltv) : '—', churn ? `at ${churn}% monthly churn` : 'enter churn', ltv ? 'pur' : '')}
  </div>
  <div class="sect">If you raised the price ${up}% and lost ${loss}% of units</div>
  <div class="scrollx"><table class="tbl"><thead><tr><th></th><th>Now</th><th>After</th><th>Change</th></tr></thead><tbody>
    <tr><td style="font-weight:600">Price</td><td class="num">${fmt(p)}</td><td class="num">${fmt(newP)}</td><td class="num" style="color:var(--ok)">+${up}%</td></tr>
    <tr><td style="font-weight:600">Units</td><td class="num">${Math.round(u)}</td><td class="num">${Math.round(newU)}</td><td class="num" style="color:var(--danger)">−${loss}%</td></tr>
    <tr><td style="font-weight:600">MRR</td><td class="num">${fmt(mrr)}</td><td class="num">${fmt(newMrr)}</td><td class="num" style="color:${newMrr >= mrr ? 'var(--ok)' : 'var(--danger)'};font-weight:700">${mrr ? (newMrr >= mrr ? '+' : '') + Math.round((newMrr / mrr - 1) * 100) + '%' : '—'}</td></tr>
    <tr class="rank1"><td style="font-weight:600">Gross profit</td><td class="num">${fmt(gross)}</td><td class="num">${fmt(newGross)}</td><td class="num" style="color:${newGross >= gross ? 'var(--ok)' : 'var(--danger)'};font-weight:700">${gross ? (newGross >= gross ? '+' : '') + Math.round((newGross / gross - 1) * 100) + '%' : '—'}</td></tr>
  </tbody></table></div>` +
    (newGross > gross && gross ? callout('good', 'The rise pays for itself', `Even losing ${loss}% of units, gross profit rises. This is the usual result and the usual surprise — which is why price is tested far too rarely.`) : gross ? callout('warn', 'That rise does not pay', `At ${loss}% unit loss the increase costs you. Either the loss estimate is pessimistic, or the value story is not strong enough yet to support the price.`) : '') +

  d.forEach((x, i) => {
    const y = 26 + i * rowH;
    svg += `<text class="axt" x="${labW - 8}" y="${y + 14}" text-anchor="end" style="fill:#11242c">${esc(x.n.slice(0, 28))}</text>`;
    const wpx = (x.w / maxT) * barW, qpx = (x.q / maxT) * barW;
    svg += `<rect x="${labW}" y="${y + 4}" width="${r1(Math.max(0, wpx))}" height="15" fill="#0f6f8f" rx="2"/>`;
    svg += `<rect x="${r1(labW + wpx)}" y="${y + 4}" width="${r1(Math.max(0, qpx))}" height="15" fill="#e0b48a" rx="2"/>`;
    svg += `<text class="axt" x="${r1(labW + wpx + qpx + 6)}" y="${y + 16}">${r1(x.w + x.q)}h</text>`;
  });
  svg += `<text class="axt" x="${labW}" y="16">working time / waiting time (hours)</text>`;
  svg += svgClose();
  c.innerHTML = card('The stream', 'Blue is working time, sand is waiting. In most streams the sand dominates — and it is where the cheapest improvements are.',
    svg + legend([{ c: '#0f6f8f', l: 'working', sq: true }, { c: '#e0b48a', l: 'waiting', sq: true }]) +
    `<div class="grid4" style="margin-top:16px">
      ${stat('Lead time', r1(lead) + ' h', r1(lead / 24) + ' days elapsed', 'hi')}
      ${stat('Flow efficiency', Math.round(eff) + '%', 'working ÷ total elapsed', eff >= 40 ? 'ok' : eff >= 15 ? 'warn' : 'bad')}
      ${stat('Total waiting', r1(totalWait) + ' h', lead ? Math.round(totalWait / lead * 100) + '% of the stream' : '', totalWait > totalWork ? 'bad' : 'ok')}
      ${stat('Right first time', Math.round(rolled) + '%', 'rolled through all steps', rolled >= 80 ? 'ok' : rolled >= 50 ? 'warn' : 'bad')}
    </div>` +
    (worst && worst.q > 0 ? callout('warn', 'Biggest wait', `<b>${esc(worst.n)}</b> holds work for ${r1(worst.q)} hours — ${Math.round(worst.q / Math.max(1, totalWait) * 100)}% of all waiting in the stream. Attack this before optimising anything the Developers do.`) : '') +
    (eff < 15 && lead ? callout('bad', `Flow efficiency of ${Math.round(eff)}%`, 'Under 15% means the work spends over six hours queueing for every hour of progress. Typical, and it means the Sprint is not your constraint — the queues around it are. That is a legitimate target for Product Backlog items.') : '') +
    (rolled < 70 ? callout('warn', 'Rework is compounding', `Only ${Math.round(rolled)}% of work passes every step first time. Rework inflates lead time invisibly, because each loop looks like a small local delay.`) : '') +
    callout('info', 'Why this is a PO tool', 'Understanding and optimising the value stream your product sits in is part of the job. It also gives you the evidence for the most commonly resisted backlog items: the ones that make delivery faster rather than the product bigger. Poor flow efficiency shows up directly in EBM as bad <b>Time to Market</b>.'), 'flat');
}

/* ============================================================
   NAV + ROUTER
   ============================================================ */
function pageTouched(p) {
  if (!p.touch) return 0;
  try { return p.touch(); } catch (e) { return 0; }
}
function buildNav() {
  const q = ($('nav-search').value || '').toLowerCase();
  let h = '';
  GROUPS.forEach(g => {
    const items = PAGES.filter(p => p.group === g.k && (!q || (p.title + ' ' + (p.keywords || '')).toLowerCase().includes(q)));
    if (!items.length) return;
    h += `<div class="nav-group-label">${g.label}</div>`;
    items.forEach(p => {
      const t = pageTouched(p);
      h += `<div class="nav-item ${p.id === currentPage ? 'active' : ''} ${t === 2 ? 'done' : t === 1 ? 'started' : ''}" data-page="${p.id}">
        <span class="ico">${p.icon}</span><span class="txt">${esc(p.title)}</span><span class="dot"></span></div>`;
    });
  });
  if (!h) h = `<div class="nav-group-label">No tool matches that</div>`;
  $('nav').innerHTML = h;
}
function markNav() {
  const usable = PAGES.filter(p => p.touch);
  const used = usable.filter(p => pageTouched(p) > 0).length;
  $('prog-txt').textContent = `${used}/${usable.length}`;
  $('prog-fill').style.width = (usable.length ? used / usable.length * 100 : 0) + '%';
  document.querySelectorAll('.nav-item').forEach(el => {
    const p = P(el.dataset.page); if (!p) return;
    const t = pageTouched(p);
    el.classList.toggle('done', t === 2); el.classList.toggle('started', t === 1);
  });
}
function go(id) {
  currentPage = id;
  set('_last', id); save();
  location.hash = id;
  render();
  buildNav();
  window.scrollTo(0, 0);
  $('sidebar').classList.remove('open'); $('overlay').classList.remove('show');
}
function render() {
  const p = P(currentPage) || PAGES[0];
  currentPage = p.id;
  const g = GROUPS.find(x => x.k === p.group);
  $('crumb').textContent = g ? g.label : '';
  $('page-title').textContent = p.title;
  document.title = p.title + ' — Product Owner Toolkit';
  $('content').innerHTML = (p.lede ? `<div class="lede">${p.lede}</div>` : '') + p.body();
  if (p.live) { try { p.live(); } catch (e) { console.warn('live() failed on ' + p.id, e); } }
  markNav();
}
function live() { const p = P(currentPage); if (p && p.live) { try { p.live(); } catch (e) { console.warn(e); } } }

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('input', e => {
  const el = e.target.closest('[data-path]'); if (!el) return;
  const v = el.type === 'checkbox' ? el.checked : el.value;
  set(el.dataset.path, v);
  if (el.type === 'range') { const s = $('rv_' + el.dataset.path.replace(/\./g, '_')); if (s) s.textContent = v; }
  save();
  if (el.hasAttribute('data-live')) live();
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-path]');
  if (el && (el.tagName === 'SELECT' || el.type === 'checkbox')) {
    const lbl = el.closest('.chk'); if (lbl) lbl.classList.toggle('on', el.checked);
    if (el.tagName === 'SELECT') { set(el.dataset.path, el.value); save(); if (el.hasAttribute('data-live')) live(); }
  }
});
document.addEventListener('click', e => {
  const ac = e.target.closest('[data-act]'); if (ac) { const fn = ACTIONS[ac.dataset.act]; if (fn) { fn(ac); return; } }
  const a = e.target.closest('[data-add]'); if (a) { addRow(a.dataset.add, JSON.parse(a.dataset.tpl || '{}')); return; }
  const d = e.target.closest('[data-del]'); if (d) { delRow(d.dataset.del, d.dataset.id); return; }
  const mv = e.target.closest('[data-move]'); if (mv) { moveRow(mv.dataset.move, mv.dataset.id, num(mv.dataset.dir)); return; }
  const cp = e.target.closest('[data-copy]'); if (cp) { const t = $(cp.dataset.copy); copyText(t ? (t.value || t.innerText) : ''); return; }
  const nav = e.target.closest('[data-page]'); if (nav) { go(nav.dataset.page); return; }
});
$('nav-search').addEventListener('input', buildNav);
$('menu-toggle').addEventListener('click', () => { $('sidebar').classList.add('open'); $('overlay').classList.add('show'); });
$('overlay').addEventListener('click', () => { $('sidebar').classList.remove('open'); $('overlay').classList.remove('show'); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && P(id) && id !== currentPage) go(id); });

/* ---------- core actions ---------- */
ACTIONS['core.print'] = () => window.print();
ACTIONS['core.export'] = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `product-owner-backup-${today()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('Backup downloaded');
};
ACTIONS['core.import'] = () => $('file-input').click();
$('file-input').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = JSON.parse(r.result);
      if (!confirm('Restore this backup? Everything currently stored in this browser will be replaced.')) return;
      data = parsed; save(true); render(); buildNav(); toast('Backup restored');
    } catch (err) { alert('That file could not be read as a valid backup.'); }
  };
  r.readAsText(f); e.target.value = '';
});
ACTIONS['core.reset'] = () => {
  if (!confirm('Erase every answer stored in this browser? Download a backup first if you want to keep it.')) return;
  data = {}; save(true); render(); buildNav(); toast('All data cleared');
};

/* ---------- boot ---------- */
currentPage = (location.hash.slice(1) && P(location.hash.slice(1))) ? location.hash.slice(1)
  : (get('_last', '') && P(get('_last', '')) ? get('_last') : PAGES[0].id);
buildNav();
render();
</script>
</body>
</html>
