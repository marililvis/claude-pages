    <text x="14" y="${H / 2}" text-anchor="middle" font-size="11" fill="var(--muted)" transform="rotate(-90 14 ${H / 2})">Impact on the team →</text>
    <text x="${m + 8}" y="${m + 16}" font-size="10" font-weight="700" fill="var(--danger)">BUILD A COALITION</text>
    <text x="${W - m - 8}" y="${m + 16}" text-anchor="end" font-size="10" font-weight="700" fill="var(--ok)">ACT NOW</text>
    <text x="${m + 8}" y="${H - m - 8}" font-size="10" font-weight="700" fill="var(--muted)">MAKE VISIBLE, ACCEPT</text>
    <text x="${W - m - 8}" y="${H - m - 8}" text-anchor="end" font-size="10" font-weight="700" fill="var(--accent2)">QUICK WIN</text>`;
  it.forEach((x, i) => {

  const weak = SAFETY.filter(s => num(get('cul.s.' + s.k, 0)) > 0 && num(get('cul.s.' + s.k, 0)) <= 2);
  const after = get('cul.after', '');
  const practices = checkDone('cul.p', ['Blameless review after anything significant goes wrong', 'I say when I was wrong, in front of the team', 'Experiments are named as experiments, with a review date', 'We celebrate a disproved hypothesis as a completed learning cycle', 'Nobody is asked to explain themselves in front of stakeholders', 'Rotating who takes risks — it is not always the same brave person'].map(l => ({ l })));
  let h = `<div class="grid4">
    ${stat('Safety', a + '/5', n + '/' + SAFETY.length + ' signals rated', a >= 3.5 ? 'ok' : a >= 2.5 ? 'warn' : 'bad')}
    ${stat('Weak signals', weak.length, weak.length ? 'at 2 or below' : 'none', weak.length ? 'bad' : 'ok')}
    ${stat('Practices in place', practices + '/6', 'room for failure', practices >= 4 ? 'ok' : 'warn')}
    ${stat('Last failure', after ? (after.startsWith('We looked') ? 'Handled' : 'Mishandled') : '—', after || 'not answered', after.startsWith('We looked') ? 'ok' : after ? 'bad' : '')}
  </div>`;
  h += card('Signal detail', '', SAFETY.map(s => bar(s.l, num(get('cul.s.' + s.k, 0)), 5, num(get('cul.s.' + s.k, 0)) || '–')).join(''));
  if (after === 'Someone was quietly blamed') h += callout('bad', 'Blame is the fastest way to lose transparency', 'Everyone in that room learned what happens when things go wrong. Expect problems to surface later and later from now on — and treat this as your most urgent impediment.');
  if (after === 'It was not discussed at all') h += callout('bad', 'A failure nobody discussed', 'Silence after a failure is not neutrality — people fill it with the worst available explanation. Run a blameless review of it even now, late.');
  if (after === 'We discussed it and changed nothing') h += callout('warn', 'Discussed, nothing changed', 'A second identical failure will not be raised. Pick one systemic change, however small, and make it visible.');
  if (weak.length) h += callout('warn', 'Weakest signals', '<ul class="bul">' + weak.map(s => `<li>${esc(s.l)}</li>`).join('') + '</ul>Safety is built by what you do in the first ten seconds after someone says something risky. Thank them for it, out loud, before you respond to the content.');
  if (a >= 4 && practices >= 4) h += callout('good', 'A culture with room for failure', 'This is the substrate everything else in this dashboard runs on. Protect it — one public blaming undoes months.');
  return h;
}

/* ============================================================
   SELF-CHECK
   ============================================================ */
page({
  id: 'stances', group: 'self', icon: '🎭', title: '8 Stances Self-Check',
  keywords: 'stances servant leader facilitator coach manager mentor teacher impediment remover change agent',
  lede: 'Eight stances, from Barry Overeem’s whitepaper. This is a practitioner model layered on top of the Scrum Guide, not Guide terminology — useful for seeing your range, and worth labelling as such if you use it in a PSM answer. Rate how well you actually hold each one.',
  touch() { const n = rateCount('stance.score', STANCES); return n === 0 ? 0 : n === STANCES.length ? 2 : 1; },
  body() {
    let h = srcline('stances', 'Overeem’s model — widely cited in the Scrum.org ecosystem, but a personal synthesis rather than Scrum Guide content.');
    h += card('Rate your range', '0 = I never work this way, 5 = I hold this stance well and deliberately.',
      STANCES.map(s => `<div class="f"><label>${s.n} <span class="mono muted" style="float:right">${num(get('stance.score.' + s.k, 0)) || '–'}/5</span></label>
        <div class="help">${esc(s.d)}</div>${range('stance.score.' + s.k, { min: 0, max: 5, dflt: 0 })}</div>`).join(''));
    h += `<div id="calc_stance">${stanceCalc()}</div>`;
    h += card('Which stance does this situation need?', 'The most common mistake is bringing the stance you are comfortable with rather than the one the situation asks for.',
      field('The situation', inp('stance.sit', { ph: 'The team keeps missing the Sprint Goal and nobody mentions it', live: true })) +
      field('The stance you would naturally take', sel('stance.natural', STANCES.map(s => s.n), { live: true })) +
      field('The stance the situation may actually need', sel('stance.needed', STANCES.map(s => s.n), { live: true })) +
      `<div id="calc_stancefit">${stanceFit()}</div>`);
    return h;
  },
  live() { $('calc_stance').innerHTML = stanceCalc(); $('calc_stancefit').innerHTML = stanceFit(); }
});
function stanceCalc() {
  const vals = STANCES.map(s => ({ s, v: num(get('stance.score.' + s.k, 0)) }));
  const scored = vals.filter(x => x.v > 0);
  if (!scored.length) return '';
  const a = r1(avg(scored.map(x => x.v)));
  const strong = scored.filter(x => x.v >= 4);
  const weak = scored.filter(x => x.v <= 2);
  const spread = scored.length > 1 ? Math.max.apply(null, scored.map(x => x.v)) - Math.min.apply(null, scored.map(x => x.v)) : 0;
  let h = `<div class="grid4">
    ${stat('Average', a + '/5', scored.length + '/8 rated', a >= 3.5 ? 'ok' : 'warn')}
    ${stat('Strong stances', strong.length, strong.length ? strong.slice(0, 2).map(x => x.s.n).join(', ') : 'none yet', strong.length ? 'ok' : '')}
    ${stat('Weak stances', weak.length, weak.length ? 'rarely used' : 'none', weak.length ? 'warn' : 'ok')}
    ${stat('Range', spread ? spread + ' points' : '—', spread >= 3 ? 'lopsided' : 'balanced', spread >= 3 ? 'warn' : 'ok')}
  </div>`;
  h += card('Your range', '', radar(vals.map(x => ({ label: x.s.n.split(' ')[0], v: x.v })), 5));
  if (weak.length) h += callout('warn', 'Least-used stances', '<ul class="bul">' + weak.map(x => `<li><b>${esc(x.s.n)}</b> — ${esc(x.s.d)}</li>`).join('') + '</ul>Nobody holds all eight equally. But a stance you never use is a set of situations you are not serving — and usually the ones you find uncomfortable.');
  if (spread >= 3) h += callout('warn', 'A lopsided profile', 'You are reaching for the same two stances regardless of the situation. Use the picker below before your next difficult conversation and deliberately take the stance you would not have chosen.');
  return h;
}
function stanceFit() {
  const nat = get('stance.natural', ''), need = get('stance.needed', '');
  if (!nat || !need) return '';
  if (nat === need) return callout('good', 'Instinct and need agree', 'Go with it — and check afterwards whether it worked, in the Weekly Review.');
  const sc = num(get('stance.score.' + (STANCES.find(s => s.n === need) || {}).k, 0));
  return callout('warn', 'Your instinct is ' + esc(nat) + '; the situation may need ' + esc(need),
    (sc && sc <= 2 ? 'This is also one of your weaker stances, which is probably why it is not your instinct. ' : '') +
    'Name it to yourself before you walk in: "in this conversation I am the ' + esc(need.toLowerCase()) + '." Stating the stance is most of holding it.');
}

page({
  id: 'anti', group: 'self', icon: '🚫', title: 'Anti-Pattern Check',
  keywords: 'anti patterns scribe secretary scrum police team boss admin chairman super hero coffee clerk',
  lede: 'Eight misunderstood stances the whitepaper names explicitly as things the role is <b>not</b>. They are not tools to use — they are what the job decays into when nobody looks. Rate how often each describes your last month.',
  touch() { const n = ANTI.filter(a => get('anti.freq.' + a.k, '') !== '').length; return n === 0 ? 0 : n === ANTI.length ? 2 : 1; },
  body() {
    let h = srcline('stances', 'The eight anti-patterns are listed in the whitepaper as misunderstood stances to avoid.');
    h += card('How often, honestly, in the last month?', '0 = never, 5 = this is most of my week.',
      ANTI.map(a => `<div class="f"><label>${a.n} <span class="mono muted" style="float:right">${num(get('anti.freq.' + a.k, 0)) || '–'}/5</span></label>
        <div class="help">${esc(a.d)}</div>${range('anti.freq.' + a.k, { min: 0, max: 5, dflt: 0 })}</div>`).join(''));
    h += `<div id="calc_anti">${antiCalc()}</div>`;
    return h;
  },
  live() { $('calc_anti').innerHTML = antiCalc(); }
});
function antiCalc() {
  const vals = ANTI.map(a => ({ a, v: num(get('anti.freq.' + a.k, 0)) }));
  const rated = vals.filter(x => x.v > 0);
  if (!rated.length) return '';
  const flagged = vals.filter(x => x.v >= 3).sort((x, y) => y.v - x.v);
  const total = r1(avg(vals.map(x => x.v)));
  const escape = {
    scribe: 'Hand the pen over. Ask a different person to capture each event; nobody will do it as neatly as you, and that is the point.',
    sec: 'Give the calendar to the team. Booking the room is not facilitation, and the moment it is yours it will always be yours.',
    police: 'Replace the correction with a question. "What is this event for?" teaches; "that is not how Scrum works" only wins.',
    boss: 'Stop answering "what should I work on?" Turn it back every time, even when you know the answer and it is slower.',
    admin: 'Timebox tool work to one hour a week. Everything you automate in the board, you stop noticing in the room.',
    chair: 'Stop reporting upward on the team’s behalf. Take the manager to the Sprint Review instead — that is the event built for it.',
    hero: 'Say out loud that you will not solve the next one, and let one visible thing stay unsolved for a day. This is the hardest one to leave.',
    coffee: 'This one usually means the role was never properly explained here. Teach the accountabilities upward before anything else changes.',
  };
  let h = `<div class="grid3">
    ${stat('Average drift', total + '/5', 'across all eight', total >= 2.5 ? 'bad' : total >= 1.5 ? 'warn' : 'ok')}
    ${stat('Flagged', flagged.length, flagged.length ? 'at 3 or above' : 'none', flagged.length >= 3 ? 'bad' : flagged.length ? 'warn' : 'ok')}
    ${stat('Biggest', flagged.length ? flagged[0].a.n : '—', flagged.length ? flagged[0].v + '/5' : 'nothing dominant', flagged.length ? 'bad' : 'ok')}
  </div>`;
  h += card('Where the role is drifting', '', vals.filter(x => x.v > 0).sort((a, b) => b.v - a.v).map(x => bar(x.a.n, x.v, 5, x.v)).join(''));
  flagged.slice(0, 3).forEach(x => { h += callout('bad', x.a.n + ' — ' + x.v + '/5', esc(x.a.d) + '<br><b>Way out:</b> ' + escape[x.a.k]); });
  if (!flagged.length && rated.length >= 6) h += callout('good', 'No anti-pattern is dominating', 'Re-run this monthly. Drift is gradual, and it always starts with something that felt helpful at the time.');
  if (flagged.length >= 4) h += callout('bad', 'The role has largely become something else', 'Four or more at once is rarely a personal failing — it usually means nobody in this organisation was ever told what a Scrum Master is for. Start with the Accountability Map and teach it upward.' + `<div class="btnrow">${jump('acc', 'Accountability Map')}${jump('teach', 'Teaching Plan')}</div>`);
  return h;
}

page({
  id: 'weekly', group: 'self', icon: '📝', title: 'Weekly Review',
  keywords: 'weekly review reflection self journal scrum master practice',
  lede: 'Fifteen minutes on a Friday. The numbers below come from the rest of the dashboard; the three questions are the ones that actually change your next week.',
  touch() { const n = list('wk.log').length; return n === 0 ? 0 : n >= 3 ? 2 : 1; },
  body() {
    let h = srcline('mix', 'A practice habit, not a framework artefact.');
    h += `<div id="calc_wk">${wkCalc()}</div>`;
    h += card('This week', '', `
      ${field('What did I do that only a Scrum Master could have done?', ta('wk.only', { ph: 'Got the platform team and our PO in the same room about the shared environment' }))}
      ${field('What did I do that the team could have done themselves?', ta('wk.theirs', { ph: 'Updated the board, chased two people for estimates' }), 'This is the anti-pattern question. Be specific.')}
      ${field('What will I stop, start or ask for next week?', ta('wk.next'))}
      <div class="inline">
        ${field('Energy this week', sel('wk.energy', ['Good', 'Flat', 'Depleted'], { live: true }))}
        ${field('Week ending', inp('wk.date', { type: 'date', dflt: today() }))}
      </div>
      <div class="btnrow">${act('wk.save', '＋ Save this week', 'btn primary')}</div>`);
    h += card('Review log', '',
      repeater('wk.log', [
        { k: 'date', label: 'Week', w: '.8fr', type: 'date' },
        { k: 'only', label: 'Only a Scrum Master could', w: '1.8fr' },
        { k: 'theirs', label: 'Could have been theirs', w: '1.6fr' },
        { k: 'next', label: 'Next week', w: '1.4fr' },
        { k: 'energy', label: 'Energy', w: '.7fr', type: 'sel', options: ['Good', 'Flat', 'Depleted'], blank: '—', live: true },
      ], { addLabel: 'Add week', empty: 'No weeks logged yet.' }));
    return h;
  },
  live() { $('calc_wk').innerHTML = wkCalc(); }
});
function wkCalc() {
  const open = list('imped.items').filter(i => (i.status || 'To do') !== 'Done');
  const removed = list('imped.items').filter(i => (i.status || 'To do') === 'Done').length;
  const disr = r1(sum(list('shield.items').map(d => num(d.mins))) / 60);
  const impr = list('improve.actions').filter(a => a.done !== true).length;
  const moves = sum(MOVES.map(m => num(get('moves.count.' + m.k, 0))));
  const weeks = list('wk.log');
  const depleted = weeks.filter(w => w.energy === 'Depleted').length;
  let h = `<div class="grid4">
    ${stat('Open impediments', open.length, removed + ' removed in total', open.length > 4 ? 'bad' : open.length ? 'warn' : 'ok')}
    ${stat('Disruption logged', disr + ' h', 'pulled off the Sprint Goal', disr > 8 ? 'bad' : '')}
    ${stat('Open improvements', impr, 'from retrospectives', impr > 4 ? 'warn' : 'ok')}
    ${stat('Coaching moves used', moves, 'logged in total', moves ? 'hi' : 'warn')}
  </div>`;
  if (weeks.length >= 3 && depleted >= 2) h += callout('bad', 'Depleted more than once recently', 'The role has no natural stopping point, which is exactly why it needs one. Look at the anti-pattern check — depletion in this job is almost always the Super Hero or the Secretary, not the work itself.' + `<div class="btnrow">${jump('anti', 'Anti-Pattern Check')}</div>`);
  if (!moves) h += callout('warn', 'No coaching moves logged', 'Weeks with no coaching in them are usually weeks spent on admin. Worth checking what filled the time.');
  if (weeks.length >= 4) h += callout('good', weeks.length + ' weeks logged', 'Read the last four "could have been theirs" answers together. The pattern in that column is the single most useful thing this dashboard will ever tell you.');
  return h;
}
ACTIONS['wk.save'] = () => {
  if (!get('wk.only', '') && !get('wk.theirs', '')) { toast('Answer at least one question'); return; }
  addRow('wk.log', { date: get('wk.date', '') || today(), only: get('wk.only', ''), theirs: get('wk.theirs', ''), next: get('wk.next', ''), energy: get('wk.energy', '') });
  ['only', 'theirs', 'next', 'energy'].forEach(k => set('wk.' + k, ''));
  save(true); render(); toast('Week saved');
};

/* ============================================================
   NAV + ROUTER
   ============================================================ */
function pageTouched(p) {
  if (!p.touch) return 0;
  try { return p.touch(); } catch (e) { return 0; }
}
function buildNav() {
  const q = ($('nav-search').value || '').toLowerCase();
  let h = '';
  GROUPS.forEach(g => {
    const items = PAGES.filter(p => p.group === g.k && (!q || (p.title + ' ' + (p.keywords || '')).toLowerCase().includes(q)));
    if (!items.length) return;
    h += `<div class="nav-group-label">${g.label}</div>`;
    items.forEach(p => {
      const t = pageTouched(p);
      h += `<div class="nav-item ${p.id === currentPage ? 'active' : ''} ${t === 2 ? 'done' : t === 1 ? 'started' : ''}" data-page="${p.id}">
        <span class="ico">${p.icon}</span><span class="txt">${esc(p.title)}</span><span class="dot"></span></div>`;
    });
  });
  $('nav').innerHTML = h;
}
function markNav() {
  const usable = PAGES.filter(p => p.touch);
  const used = usable.filter(p => pageTouched(p) > 0).length;
  $('prog-txt').textContent = `${used}/${usable.length}`;
  $('prog-fill').style.width = (usable.length ? used / usable.length * 100 : 0) + '%';
  document.querySelectorAll('.nav-item').forEach(el => {
    const p = P(el.dataset.page); if (!p) return;
    const t = pageTouched(p);
    el.classList.toggle('done', t === 2); el.classList.toggle('started', t === 1);
  });
}
function go(id) {
  currentPage = id;
  set('_last', id); save();
  location.hash = id;
  render();
  buildNav();
  window.scrollTo(0, 0);
  $('sidebar').classList.remove('open'); $('overlay').classList.remove('show');
}
function render() {
  const p = P(currentPage) || PAGES[0];
  currentPage = p.id;
  const g = GROUPS.find(x => x.k === p.group);
  $('crumb').textContent = g ? g.label : '';
  $('page-title').textContent = p.title;
  $('content').innerHTML = (p.lede ? `<div class="lede">${p.lede}</div>` : '') + p.body();
  if (p.live) p.live();
  markNav();
}
function live() { const p = P(currentPage); if (p && p.live) p.live(); }

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('input', e => {
  const el = e.target.closest('[data-path]'); if (!el) return;
  const v = el.type === 'checkbox' ? el.checked : el.value;
  set(el.dataset.path, v);
  if (el.type === 'range') { const s = $('rv_' + el.dataset.path.replace(/\./g, '_')); if (s) s.textContent = v; }
  save();
  if (el.hasAttribute('data-live')) live();
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-path]');
  if (el && (el.tagName === 'SELECT' || el.type === 'checkbox')) {
    const lbl = el.closest('.chk'); if (lbl) lbl.classList.toggle('on', el.checked);
  }
});
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-page]'); if (nav) { go(nav.dataset.page); return; }
  const a = e.target.closest('[data-add]'); if (a) { addRow(a.dataset.add, JSON.parse(a.dataset.tpl || '{}')); return; }
  const d = e.target.closest('[data-del]'); if (d) { delRow(d.dataset.del, d.dataset.id); return; }
  const c = e.target.closest('[data-copy]'); if (c) { const t = $(c.dataset.copy); copyText(t ? (t.value || t.innerText) : ''); return; }
  const go1 = e.target.closest('[data-tgo]'); if (go1) { const t = TIMERS[go1.dataset.tgo]; t.running = !t.running; if (t.rem === 0) t.rem = t.total; go1.textContent = t.running ? '❚❚ Pause' : '▶ Start'; return; }
  const rs = e.target.closest('[data-trst]'); if (rs) { const t = TIMERS[rs.dataset.trst]; t.running = false; t.rem = t.total; $('td_' + rs.dataset.trst).textContent = fmtT(t.rem); const w = $('tw_' + rs.dataset.trst); w.classList.remove('running', 'done'); const b = w.querySelector('[data-tgo]'); if (b) b.textContent = '▶ Start'; return; }
  const ts = e.target.closest('[data-tset]'); if (ts) { const t = TIMERS[ts.dataset.tset]; t.total = num(ts.dataset.secs); t.rem = t.total; t.running = false; $('td_' + ts.dataset.tset).textContent = fmtT(t.rem); const w = $('tw_' + ts.dataset.tset); w.classList.remove('running', 'done'); const b = w.querySelector('[data-tgo]'); if (b) b.textContent = '▶ Start'; return; }
  const ac = e.target.closest('[data-act]'); if (ac) { const fn = ACTIONS[ac.dataset.act]; if (fn) fn(ac); return; }
});
$('nav-search').addEventListener('input', buildNav);
$('menu-toggle').addEventListener('click', () => { $('sidebar').classList.add('open'); $('overlay').classList.add('show'); });
$('overlay').addEventListener('click', () => { $('sidebar').classList.remove('open'); $('overlay').classList.remove('show'); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && P(id) && id !== currentPage) go(id); });

/* ---------- core actions ---------- */
ACTIONS['core.print'] = () => window.print();
ACTIONS['core.export'] = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `scrum-master-backup-${today()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('Backup downloaded');
};
ACTIONS['core.import'] = () => $('file-input').click();
$('file-input').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = JSON.parse(r.result);
      if (!confirm('Restore this backup? Everything currently stored in this browser will be replaced.')) return;
      data = parsed; save(true); render(); buildNav(); toast('Backup restored');
    } catch (err) { alert('That file could not be read as a valid backup.'); }
  };
  r.readAsText(f); e.target.value = '';
});
ACTIONS['core.reset'] = () => {
  if (!confirm('Erase every answer stored in this browser? Download a backup first if you want to keep it.')) return;
  data = {}; save(true); render(); buildNav(); toast('All data cleared');
};

/* ---------- boot ---------- */
currentPage = (location.hash.slice(1) && P(location.hash.slice(1))) ? location.hash.slice(1) : (get('_last', '') && P(get('_last', '')) ? get('_last') : PAGES[0].id);
buildNav();
render();
</script>
</body>
</html>
