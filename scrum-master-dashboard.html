<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrum Master Toolkit — Interactive Dashboard</title>
<style>
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface2: #eef0f7;
    --surface3: #e3e7f2;
    --border: #dde1ec;
    --ink: #15192e;
    --muted: #626a85;
    --accent: #0e6f78;
    --accent-soft: rgba(14,111,120,0.10);
    --accent2: #c2701c;
    --accent2-soft: rgba(194,112,28,0.12);
    --danger: #c2434b;
    --danger-soft: rgba(194,67,75,0.12);
    --ok: #2f8a52;
    --ok-soft: rgba(47,138,82,0.12);
    --side: #14202a;
    --side2: #1f303c;
    --side-text: #9fb2bd;
    --shadow: 0 1px 2px rgba(21,25,46,0.05), 0 4px 16px rgba(21,25,46,0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

  /* ---------- SIDEBAR ---------- */
  #sidebar {
    position: fixed; top: 0; left: 0; width: 270px; height: 100vh;
    background: var(--side); display: flex; flex-direction: column; z-index: 60;
    transition: transform .25s ease;
  }
  .brand { padding: 20px 20px 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .brand h1 { font-size: .82rem; font-weight: 700; color: #fff; letter-spacing: .12em; text-transform: uppercase; }
  .brand p { font-size: .68rem; color: var(--side-text); margin-top: 5px; letter-spacing: .02em; }
  .side-progress { padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .side-progress .lbl { display: flex; justify-content: space-between; font-size: .65rem; color: var(--side-text); text-transform: uppercase; letter-spacing: .07em; }
  .side-progress .track { height: 5px; background: rgba(255,255,255,.12); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .side-progress .fill { height: 100%; background: linear-gradient(90deg, #0e6f78, #46b8a8); border-radius: 3px; transition: width .5s; width: 0; }
  .side-search { padding: 12px 14px 6px; }
  .side-search input {
    width: 100%; padding: 8px 10px; border-radius: 7px; font-size: .78rem;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.10); color: #fff;
  }
  .side-search input::placeholder { color: #737a99; }
  .side-search input:focus { outline: none; border-color: #2b8f96; background: rgba(255,255,255,.11); }
  nav { flex: 1; overflow-y: auto; padding: 6px 0 20px; }
  nav::-webkit-scrollbar { width: 7px; }
  nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 4px; }
  .nav-group-label {
    font-size: .6rem; color: #737a99; text-transform: uppercase; letter-spacing: .1em;
    padding: 14px 20px 5px; font-weight: 700;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 20px; cursor: pointer;
    font-size: .8rem; color: var(--side-text); border-left: 3px solid transparent; transition: all .15s;
  }
  .nav-item:hover { background: var(--side2); color: #fff; }
  .nav-item.active { background: var(--side2); color: #fff; border-left-color: #35b3ac; font-weight: 600; }
  .nav-item .ico { width: 18px; text-align: center; font-size: .95rem; flex: none; }
  .nav-item .txt { flex: 1; line-height: 1.3; }
  .nav-item .dot { width: 7px; height: 7px; border-radius: 50%; background: transparent; flex: none; }
  .nav-item.started .dot { background: var(--accent2); }
  .nav-item.done .dot { background: #35c98a; }

  /* ---------- MAIN ---------- */
  #main { margin-left: 270px; min-height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,.93); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border); padding: 14px 34px;
    display: flex; align-items: center; gap: 16px;
  }
  .topbar .crumb { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .topbar h2 { font-size: 1.12rem; font-weight: 700; margin-top: 2px; }
  .topbar .spacer { flex: 1; }
  .btn {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; font-size: .78rem; font-weight: 600; color: var(--ink); transition: all .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #0a565d; color: #fff; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--surface2); color: var(--ink); }
  .btn.danger { color: var(--danger); border-color: var(--border); }
  .btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  .btn.sm { padding: 5px 10px; font-size: .72rem; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  #menu-toggle { display: none; }

  .content { padding: 26px 34px 80px; max-width: 1080px; width: 100%; }
  .lede { color: var(--muted); font-size: .87rem; line-height: 1.65; max-width: 780px; margin-bottom: 22px; }

  /* ---------- CARDS ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .card > h3 { font-size: .95rem; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .card > .hint { font-size: .78rem; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
  .card.flat { box-shadow: none; background: var(--surface2); }
  .card.accent { border-left: 4px solid var(--accent); }

  .principle {
    background: linear-gradient(135deg, rgba(14,111,120,.10), rgba(194,112,28,.07));
    border: 1px solid rgba(14,111,120,.24); border-radius: 12px; padding: 16px 20px; margin-bottom: 20px;
  }
  .principle .k { font-size: .62rem; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 700; }
  .principle p { font-size: .88rem; line-height: 1.65; margin-top: 6px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
  .grid4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
  .grid5 { display: grid; grid-template-columns: repeat(5,1fr); gap: 12px; }
  @media (max-width: 980px) { .grid2, .grid3, .grid4, .grid5 { grid-template-columns: 1fr; } }

  /* ---------- STAT TILES ---------- */
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 16px 18px; }
  .stat .lab { font-size: .66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
  .stat .val { font-size: 1.5rem; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; }
  .stat .sub { font-size: .72rem; color: var(--muted); margin-top: 4px; line-height: 1.45; }
  .stat.hi { background: var(--accent-soft); border-color: rgba(14,111,120,.32); }
  .stat.hi .val { color: var(--accent); }
  .stat.warn { background: var(--accent2-soft); border-color: rgba(194,112,28,.3); }
  .stat.warn .val { color: var(--accent2); }
  .stat.ok { background: var(--ok-soft); border-color: rgba(47,138,82,.3); }
  .stat.ok .val { color: var(--ok); }
  .stat.bad { background: var(--danger-soft); border-color: rgba(194,67,75,.3); }
  .stat.bad .val { color: var(--danger); }

  /* ---------- FORM ---------- */
  .f { margin-bottom: 14px; }
  .f > label { display: block; font-size: .74rem; font-weight: 600; margin-bottom: 5px; }
  .f > .help { font-size: .71rem; color: var(--muted); margin-bottom: 6px; line-height: 1.5; }
  input[type=text], input[type=number], input[type=date], input[type=time], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); font-size: .84rem; transition: border-color .15s, box-shadow .15s;
  }
  textarea { resize: vertical; min-height: 74px; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[readonly] { background: var(--surface2); color: var(--muted); }
  .inline { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .inline .f { flex: 1; min-width: 150px; margin-bottom: 0; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }

  /* ---------- CHECKLIST ---------- */
  .chk { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: .82rem; line-height: 1.5; }
  .chk:hover { background: var(--surface2); }
  .chk input { margin-top: 3px; width: 15px; height: 15px; accent-color: var(--accent); flex: none; cursor: pointer; }
  .chk.on > span { color: var(--muted); text-decoration: line-through; }
  .chk .sub { display: block; font-size: .72rem; color: var(--muted); text-decoration: none !important; margin-top: 2px; }

  /* ---------- REPEATER TABLE ---------- */
  .rep { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .rep-head, .rep-row { display: grid; gap: 8px; padding: 8px 10px; align-items: center; }
  .rep-head { background: var(--surface2); font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
  .rep-row { border-top: 1px solid var(--border); }
  .rep-row:nth-child(even) { background: rgba(0,0,0,.012); }
  .rep-row input, .rep-row select, .rep-row textarea { padding: 6px 8px; font-size: .78rem; }
  .rep-row textarea { min-height: 38px; }
  .rep-empty { padding: 16px; text-align: center; color: var(--muted); font-size: .78rem; border-top: 1px solid var(--border); }
  .rep-foot { padding: 8px 10px; border-top: 1px solid var(--border); background: var(--surface2); }
  .row-del { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: .85rem; padding: 4px; border-radius: 6px; }
  .row-del:hover { background: var(--danger-soft); color: var(--danger); }
  @media (max-width: 900px) { .rep-head { display:none; } .rep-row { grid-template-columns: 1fr !important; } }

  /* ---------- BARS ---------- */
  .bar { margin-bottom: 10px; }
  .bar .top { display: flex; justify-content: space-between; font-size: .76rem; margin-bottom: 4px; }
  .bar .top .v { font-weight: 700; }
  .bar .track { height: 9px; background: var(--surface3); border-radius: 5px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 5px; background: var(--accent); transition: width .35s; }
  .bar .fill.low { background: var(--danger); }
  .bar .fill.mid { background: var(--accent2); }
  .bar .fill.high { background: var(--ok); }

  /* ---------- MISC ---------- */
  .tag { font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 20px; background: var(--surface3); color: var(--muted); }
  .tag.a { background: var(--accent-soft); color: var(--accent); }
  .tag.b { background: var(--accent2-soft); color: var(--accent2); }
  .tag.g { background: var(--ok-soft); color: var(--ok); }
  .tag.r { background: var(--danger-soft); color: var(--danger); }
  .callout { border-radius: 10px; padding: 13px 16px; font-size: .8rem; line-height: 1.6; margin: 14px 0; border: 1px solid; }
  .callout.info { background: var(--accent-soft); border-color: rgba(14,111,120,.26); }
  .callout.warn { background: var(--accent2-soft); border-color: rgba(194,112,28,.3); }
  .callout.bad { background: var(--danger-soft); border-color: rgba(194,67,75,.3); }
  .callout.good { background: var(--ok-soft); border-color: rgba(47,138,82,.3); }
  .callout b { display: block; margin-bottom: 3px; }
  .quote { font-size: 1rem; line-height: 1.85; font-style: italic; padding: 20px 24px; background: var(--surface2); border-left: 4px solid var(--accent); border-radius: 8px; }
  .quote .attr { display: block; font-style: normal; font-size: .74rem; color: var(--muted); margin-top: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); font-size: .74rem; cursor: pointer; margin: 0 6px 6px 0; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sect { font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; margin: 22px 0 10px; }
  .divider { height: 1px; background: var(--border); margin: 18px 0; }
  .muted { color: var(--muted); }
  .sm { font-size: .76rem; }
  .center { text-align: center; }
  .mono { font-variant-numeric: tabular-nums; }
  ul.plain { list-style: none; }
  ul.bul { padding-left: 18px; font-size: .81rem; line-height: 1.7; }
  ul.bul li { margin-bottom: 3px; }

  /* ---------- TIMER ---------- */
  .timer { display: flex; align-items: center; gap: 12px; background: var(--side); color: #fff; border-radius: 12px; padding: 14px 18px; flex-wrap: wrap; }
  .timer .disp { font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; min-width: 108px; }
  .timer .lab { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--side-text); }
  .timer .spacer { flex: 1; }
  .timer button { border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; border-radius: 8px; padding: 7px 13px; font-size: .76rem; font-weight: 600; cursor: pointer; }
  .timer button:hover { background: rgba(255,255,255,.18); }
  .timer.running .disp { color: #8ee7c8; }
  .timer.done { background: var(--danger); }
  .timer.done .disp { color: #fff; }
  .timer .presets { display: flex; gap: 5px; }
  .timer .presets button { padding: 5px 9px; font-size: .7rem; }

  /* ---------- CLUSTERS / CARDS BOARD ---------- */
  .cluster { border: 1px solid var(--border); border-radius: 11px; background: var(--surface); margin-bottom: 14px; overflow: hidden; }
  .cluster > .h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface2); border-bottom: 1px solid var(--border); }
  .cluster > .h .n { font-weight: 700; font-size: .84rem; flex: 1; }
  .cluster .items { padding: 10px 14px; }
  .idea { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: .82rem; border-bottom: 1px dashed var(--border); }
  .idea:last-child { border-bottom: none; }
  .idea .txt { flex: 1; line-height: 1.5; }
  .idea select { width: auto; min-width: 140px; padding: 4px 8px; font-size: .74rem; }

  /* ---------- DIAMOND ---------- */
  .diamond { width: 100%; max-width: 640px; margin: 0 auto; display: block; }
  .diamond .zone { cursor: pointer; transition: opacity .2s; }
  .diamond .zone:hover { opacity: .85; }

  /* ---------- TOAST ---------- */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 9px; font-size: .8rem;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 200; box-shadow: 0 6px 24px rgba(0,0,0,.25);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 55; }
  @media (max-width: 860px) {
    #sidebar { transform: translateX(-100%); }
    #sidebar.open { transform: translateX(0); }
    #main { margin-left: 0; }
    #menu-toggle { display: inline-block; }
    #overlay.show { display: block; }
    .content { padding: 20px 16px 70px; }
    .topbar { padding: 12px 16px; }
  }
  @media print {
    #sidebar, .topbar, #toast, .btn, .row-del { display: none !important; }
    #main { margin-left: 0; }
    .card { break-inside: avoid; box-shadow: none; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <div class="brand">
    <h1>Scrum Master</h1>
    <p>40 tools for the accountability</p>
  </div>
  <div class="side-progress">
    <div class="lbl"><span>Tools used</span><span id="prog-txt">0/0</span></div>
    <div class="track"><div class="fill" id="prog-fill"></div></div>
  </div>
  <div class="side-search"><input type="text" id="nav-search" placeholder="Search tools…"></div>
  <nav id="nav"></nav>
</div>
<div id="overlay"></div>

<div id="main">
  <div class="topbar">
    <button class="btn sm" id="menu-toggle">☰</button>
    <div>
      <div class="crumb" id="crumb"></div>
      <h2 id="page-title"></h2>
    </div>
    <div class="spacer"></div>
    <button class="btn sm ghost" data-act="core.print">🖨 Print</button>
    <button class="btn sm" data-act="core.export">⬇ Backup</button>
    <button class="btn sm" data-act="core.import">⬆ Restore</button>
  </div>
  <div class="content" id="content"></div>
</div>

<div id="toast"></div>
<input type="file" id="file-input" accept=".json" style="display:none">

<script>
/* ============================================================
   CORE — state, storage, helpers
   ============================================================ */
const STORE_KEY = 'scrum-master-v1';
let data = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
let currentPage = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const today = () => new Date().toISOString().slice(0, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const r1 = n => Math.round(n * 10) / 10;

let saveTimer = null;
function save(immediate) {
  if (saveTimer) clearTimeout(saveTimer);
  const doIt = () => { localStorage.setItem(STORE_KEY, JSON.stringify(data)); markNav(); };
  if (immediate) doIt(); else saveTimer = setTimeout(doIt, 250);
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2100);
}

function get(path, dflt) {
  const v = path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), data);
  return v === undefined || v === null || v === '' ? (dflt !== undefined ? dflt : '') : v;
}
function set(path, val) {
  const keys = path.split('.');
  let o = data;
  for (let i = 0; i < keys.length - 1; i++) { if (typeof o[keys[i]] !== 'object' || o[keys[i]] === null) o[keys[i]] = {}; o = o[keys[i]]; }
  o[keys[keys.length - 1]] = val;
}
function list(path) {
  const keys = path.split('.');
  let o = data;
  for (let i = 0; i < keys.length - 1; i++) { if (typeof o[keys[i]] !== 'object' || o[keys[i]] === null) o[keys[i]] = {}; o = o[keys[i]]; }
  const last = keys[keys.length - 1];
  if (!Array.isArray(o[last])) o[last] = [];
  return o[last];
}
function addRow(path, row) { list(path).push(Object.assign({ id: uid() }, row)); save(true); render(); }
function delRow(path, id) { const l = list(path); const i = l.findIndex(r => r.id === id); if (i > -1) l.splice(i, 1); save(true); render(); }

/* ---------- control builders ---------- */
function attrs(o) { return Object.entries(o).filter(([k, v]) => v !== undefined && v !== false).map(([k, v]) => v === true ? k : `${k}="${esc(v)}"`).join(' '); }

function inp(path, o = {}) {
  const v = get(path, o.dflt !== undefined ? o.dflt : '');
  return `<input type="${o.type || 'text'}" data-path="${path}" ${o.live ? 'data-live' : ''} value="${esc(v)}" ${attrs({ placeholder: o.ph, min: o.min, max: o.max, step: o.step, readonly: o.ro })}>`;
}
function ta(path, o = {}) {
  return `<textarea data-path="${path}" ${o.live ? 'data-live' : ''} ${attrs({ placeholder: o.ph, rows: o.rows, style: o.style })}>${esc(get(path, o.dflt || ''))}</textarea>`;
}
function sel(path, options, o = {}) {
  const v = get(path, o.dflt || '');
  const opts = options.map(x => {
    const val = typeof x === 'string' ? x : x.v, lab = typeof x === 'string' ? x : x.l;
    return `<option value="${esc(val)}" ${val === v ? 'selected' : ''}>${esc(lab)}</option>`;
  }).join('');
  return `<select data-path="${path}" ${o.live ? 'data-live' : ''}>${o.blank !== false ? `<option value="">${esc(o.blank || '— choose —')}</option>` : ''}${opts}</select>`;
}
function field(label, control, help) {
  return `<div class="f"><label>${label}</label>${help ? `<div class="help">${help}</div>` : ''}${control}</div>`;
}
function range(path, o = {}) {
  const v = num(get(path, o.dflt !== undefined ? o.dflt : 3));
  return `<div class="inline"><input type="range" style="flex:1;padding:0" min="${o.min || 1}" max="${o.max || 5}" step="${o.step || 1}" value="${v}" data-path="${path}" data-live>
    <span class="mono" style="min-width:34px;text-align:right;font-weight:700" id="rv_${path.replace(/\./g, '_')}">${v}</span></div>`;
}
function checklist(path, items) {
  return items.map((it, i) => {
    const label = typeof it === 'string' ? it : it.l;

}

function bar(label, value, max, suffix) {
  const p = max ? clamp(value / max * 100, 0, 100) : 0;
  const cls = p < 40 ? 'low' : p < 70 ? 'mid' : 'high';
  return `<div class="bar"><div class="top"><span>${label}</span><span class="v">${suffix !== undefined ? suffix : r1(value)}</span></div>
    <div class="track"><div class="fill ${cls}" style="width:${p}%"></div></div></div>`;
}
function stat(lab, val, sub, cls) {
  return `<div class="stat ${cls || ''}"><div class="lab">${lab}</div><div class="val">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;

function card(title, hint, body, cls) {
  return `<div class="card ${cls || ''}">${title ? `<h3>${title}</h3>` : ''}${hint ? `<div class="hint">${hint}</div>` : ''}${body}</div>`;

function callout(kind, title, body) { return `<div class="callout ${kind}">${title ? `<b>${title}</b>` : ''}${body}</div>`; }
function delBtn(path, id) { return `<button class="row-del" data-del="${path}" data-id="${id}" title="Delete">✕</button>`; }
function addBtn(path, tpl, label) { return `<button class="btn sm" data-add="${path}" data-tpl="${esc(JSON.stringify(tpl || {}))}">+ ${label || 'Add row'}</button>`; }
function act(name, label, cls) { return `<button class="btn ${cls || 'sm'}" data-act="${name}">${label}</button>`; }

function repeater(path, fields, o = {}) {
  const items = list(path);
  const cols = fields.map(f => f.w || '1fr').join(' ') + ' 30px';
  let h = `<div class="rep"><div class="rep-head" style="grid-template-columns:${cols}">${fields.map(f => `<div>${esc(f.label)}</div>`).join('')}<div></div></div>`;
  if (!items.length) h += `<div class="rep-empty">${esc(o.empty || 'Nothing yet — add the first row below.')}</div>`;
  items.forEach((it, i) => {
    h += `<div class="rep-row" style="grid-template-columns:${cols}">`;
    fields.forEach(f => {
      const p = `${path}.${i}.${f.k}`;
      if (f.type === 'ta') h += ta(p, { ph: f.ph, live: f.live });
      else if (f.type === 'sel') h += sel(p, f.options, { blank: f.blank, live: f.live });
      else if (f.type === 'chk') h += `<div class="center"><input type="checkbox" data-path="${p}" data-live ${get(p, false) === true ? 'checked' : ''} style="width:16px;height:16px;accent-color:var(--accent)"></div>`;
      else h += inp(p, { type: f.type || 'text', ph: f.ph, min: f.min, max: f.max, step: f.step, live: f.live });
    });
    h += delBtn(path, it.id) + `</div>`;
  });
  h += `<div class="rep-foot">${addBtn(path, o.tpl, o.addLabel)}${o.extra || ''}</div></div>`;
  return h;
}

/* ---------- timers ---------- */
const TIMERS = {};
function timerT(id, secs, label, presets) {
  if (!TIMERS[id]) TIMERS[id] = { rem: secs, total: secs, running: false };
  const t = TIMERS[id];
  const ps = (presets || []).map(m => `<button data-tset="${id}" data-secs="${m * 60}">${m}m</button>`).join('');
  return `<div class="timer" id="tw_${id}">
    <div><div class="lab">${esc(label || 'Timer')}</div><div class="disp" id="td_${id}">${fmtT(t.rem)}</div></div>
    <div class="spacer"></div>
    ${ps ? `<div class="presets">${ps}</div>` : ''}
    <button data-tgo="${id}">${t.running ? '❚❚ Pause' : '▶ Start'}</button>
    <button data-trst="${id}">↺ Reset</button>
  </div>`;
}
function fmtT(s) { s = Math.max(0, Math.round(s)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
setInterval(() => {
  Object.entries(TIMERS).forEach(([id, t]) => {
    if (t.running) { t.rem = Math.max(0, t.rem - 1); if (t.rem === 0) { t.running = false; flash(id); } }
    const d = $('td_' + id); if (d) d.textContent = fmtT(t.rem);
    const w = $('tw_' + id);
    if (w) { w.classList.toggle('running', t.running); w.classList.toggle('done', t.rem === 0 && t.total > 0); }
  });
}, 1000);
function flash(id) { toast('⏰ Time is up — ' + id.replace(/_/g, ' ')); }

/* ---------- clipboard ---------- */
function copyText(txt) {
  navigator.clipboard.writeText(txt).then(() => toast('Copied to clipboard')).catch(() => {
    const ta2 = document.createElement('textarea'); ta2.value = txt; document.body.appendChild(ta2); ta2.select();
    document.execCommand('copy'); ta2.remove(); toast('Copied to clipboard');
  });
}

function radar(items, max) {
  max = max || 5;
  const n = items.length; if (!n) return '';
  const cx = 200, cy = 165, R = 112;
  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  let g = '';
  for (let ring = 1; ring <= 4; ring++) {
    const pts = items.map((_, i) => pt(i, R * ring / 4).map(x => x.toFixed(1)).join(',')).join(' ');
    g += `<polygon points="${pts}" fill="${ring === 4 ? 'var(--surface2)' : 'none'}" stroke="var(--border)" stroke-width="1"/>`;
  }
  items.forEach((_, i) => { const [x, y] = pt(i, R); g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)"/>`; });
  const dpts = items.map((it, i) => pt(i, R * clamp(num(it.v), 0, max) / max).map(x => x.toFixed(1)).join(',')).join(' ');
  g += `<polygon points="${dpts}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>`;
  items.forEach((it, i) => {
    const [px, py] = pt(i, R * clamp(num(it.v), 0, max) / max);
    g += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.5" fill="var(--accent)"/>`;
    const [x, y] = pt(i, R + 26);
    g += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="600" fill="var(--muted)">${esc(it.label)}</text>`;
    g += `<text x="${x.toFixed(1)}" y="${(y + 12).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--accent)">${num(it.v) || '–'}/${max}</text>`;
  });
  return `<svg viewBox="0 0 400 340" style="width:100%;max-width:430px;display:block;margin:6px auto">${g}</svg>`;
}

  lede: 'Six dimensions the Scrum Master is accountable for growing in the team. Score what you observe — not what you hope. The lowest bar is where your next intervention belongs, and the radar makes an uneven team obvious at a glance.',
  touch() { const n = rateCount('health.score', HEALTH_ITEMS); return n === 0 ? 0 : n === HEALTH_ITEMS.length ? 2 : 1; },
  body() {
    let h = srcline('guide', 'Dimensions map to the Scrum Guide accountabilities toward the Scrum Team.');
    h += card('Score what you see', 'Anchor each rating in a concrete observation from the last Sprint. 0 = not observed at all, 5 = consistently true without you in the room.',
      rateRows('health.score', HEALTH_ITEMS) +
      `<div class="f" style="margin-top:6px"><label>Observation notes</label>${ta('health.notes', { ph: 'What did you actually see that made you pick these numbers?' })}</div>`);
    h += `<div id="calc_health">${healthCalc()}</div>`;
    h += card('Sprint-over-sprint history', 'Snapshot the average each Sprint so you can see whether anything is really moving.',
      repeater('health.hist', [
        { k: 'sprint', label: 'Sprint', w: '.8fr', ph: 'S24' },
        { k: 'score', label: 'Avg /5', w: '.6fr', type: 'number', step: '0.1', live: true },
        { k: 'note', label: 'What changed', w: '2fr', ph: 'Ran a skills matrix, two people picked up testing' },
      ], { addLabel: 'Add snapshot', empty: 'No history yet.', extra: ' ' + act('health.snap', '📸 Snapshot current score') }));
    return h;
  },
  live() { $('calc_health').innerHTML = healthCalc(); }
});
function healthCalc() {
  const a = rateAvg('health.score', HEALTH_ITEMS);
  const scored = HEALTH_ITEMS.map(i => ({ i, v: num(get('health.score.' + i.k, 0)) })).filter(x => x.v > 0);
  const weakest = scored.slice().sort((x, y) => x.v - y.v)[0];
  const advice = {
    auton: ['intervene', 'Intervene or Step Back? — you are probably deciding too much for them.'],
    cross: ['skills', 'Cross-Functional Skills Matrix — find the single points of failure.'],
    own: ['boundaries', 'Boundaries of Self-Organization — make the edges of their mandate explicit.'],
    open: ['culture', 'Safety & Culture Check — people do not speak up in unsafe rooms.'],
    improve: ['improve', 'Improvement Tracker — retro actions are probably dying quietly.'],
    focus: ['shield', 'Disruption Shield — count what is pulling them off the Sprint Goal.'],
  };
  let h = `<div class="card"><h3>Radar</h3><div class="hint">${scored.length}/${HEALTH_ITEMS.length} dimensions scored${a ? ` · average <b>${a}/5</b>` : ''}</div>`;
  h += radar(HEALTH_ITEMS.map(i => ({ label: i.l.split(' ')[0], v: num(get('health.score.' + i.k, 0)) })), 5);
  h += HEALTH_ITEMS.map(i => bar(i.l, num(get('health.score.' + i.k, 0)), 5, num(get('health.score.' + i.k, 0)) || '–')).join('');
  if (weakest) {
    const t = advice[weakest.i.k];
    h += callout(weakest.v <= 2 ? 'bad' : 'warn', `Weakest dimension: ${weakest.i.l} (${weakest.v}/5)`,
      t ? `Suggested next tool — ${esc(t[1])}<div class="btnrow">${jump(t[0], 'Open it')}</div>` : '');
  }
  if (a && a >= 4) h += callout('good', 'This team is in good shape', 'Spend the freed-up capacity on the organisation direction — that is where your leverage is now.');
  h += `</div>`;
  return h;
}
ACTIONS['health.snap'] = () => {
  const a = rateAvg('health.score', HEALTH_ITEMS);
  if (!a) { toast('Score some dimensions first'); return; }
  addRow('health.hist', { sprint: '', score: a, note: '' });
  toast('Snapshot added: ' + a + '/5');
};

page({
  id: 'skills', group: 'team', icon: '🧩', title: 'Cross-Functional Skills Matrix',
  keywords: 'cross functional skills matrix bus factor dependency t-shaped',
  lede: 'A team is cross-functional when it can take an item from start to finish with no external dependency. List the skills the work really needs, rate everyone, and the matrix will show you every skill that rests on one person.',
  touch() { const p = list('skills.people').length, s = list('skills.list').length; return (!p || !s) ? 0 : (p >= 2 && s >= 3 ? 2 : 1); },
  body() {
    let h = srcline('guide', 'Serves “promote a broad, cross-functional skill set so the team can go start-to-finish”.');
    h += card('1 · The skills this work needs', 'Not job titles — the actual capabilities needed to get a Product Backlog Item to Done. Include the awkward ones: release, test data, security review, deployment.',
      repeater('skills.list', [
        { k: 'name', label: 'Skill', w: '1.6fr', ph: 'Automated testing', live: true },
        { k: 'crit', label: 'Critical to Done?', w: '.9fr', type: 'sel', options: ['Yes', 'Nice to have'], blank: '—', live: true },
      ], { addLabel: 'Add skill', empty: 'Add the first skill.', tpl: { crit: 'Yes' } }));
    h += card('2 · The people', 'Developers, and anyone else who has to touch the work.',
      repeater('skills.people', [{ k: 'name', label: 'Name', w: '1fr', ph: 'Andrei', live: true }], { addLabel: 'Add person', empty: 'Add the first person.' }));
    h += `<div id="calc_skills">${skillsCalc()}</div>`;
    return h;
  },
  live() { $('calc_skills').innerHTML = skillsCalc(); }
});
function skillsCalc() {
  const people = list('skills.people'), sk = list('skills.list');
  if (!people.length || !sk.length) return card('3 · Matrix', 'Add at least one skill and one person to build the grid.', '');
  const LV = [{ v: '0', l: '– none' }, { v: '1', l: '1 learning' }, { v: '2', l: '2 can do' }, { v: '3', l: '3 can teach' }];
  const cols = '1.4fr ' + people.map(() => '1fr').join(' ');
  let g = `<div class="rep"><div class="rep-head" style="grid-template-columns:${cols}"><div>Skill</div>${people.map(p => `<div>${esc(p.name || '—')}</div>`).join('')}</div>`;
  const risk = [];
  sk.forEach(s => {
    const lvls = people.map(p => num(get(`skills.m.${s.id}.${p.id}`, 0)));
    const able = lvls.filter(v => v >= 2).length;
    if (able <= 1 && (s.crit || 'Yes') === 'Yes') risk.push({ s, able });
    g += `<div class="rep-row" style="grid-template-columns:${cols}">
      <div class="sm" style="font-weight:600">${esc(s.name || '—')}${able <= 1 ? ' <span class="tag r">risk</span>' : ''}</div>
      ${people.map(p => sel(`skills.m.${s.id}.${p.id}`, LV, { blank: false, live: true })).join('')}</div>`;
  });
  g += `</div>`;
  const totalCells = sk.length * people.length;
  const filled = sk.reduce((acc, s) => acc + people.filter(p => num(get(`skills.m.${s.id}.${p.id}`, 0)) >= 2).length, 0);
  const cov = totalCells ? Math.round(filled / totalCells * 100) : 0;
  const teachers = sk.filter(s => people.some(p => num(get(`skills.m.${s.id}.${p.id}`, 0)) === 3)).length;

  let h = card('3 · Matrix', '0 none · 1 learning · 2 can do it alone · 3 can teach it. Rate honestly — the point is to find gaps, not to grade people.', g);
  h += `<div class="grid4">
    ${stat('Skills tracked', sk.length, 'critical: ' + sk.filter(s => (s.crit || 'Yes') === 'Yes').length)}
    ${stat('Coverage', cov + '%', 'person/skill pairs at level 2+', pctCls(cov))}
    ${stat('Single points of failure', risk.length, risk.length ? 'critical skills with ≤1 able person' : 'none', risk.length ? 'bad' : 'ok')}
    ${stat('Teachable skills', teachers + '/' + sk.length, 'someone can pass it on', teachers >= sk.length / 2 ? 'ok' : 'warn')}
  </div>`;
  if (risk.length) {
    h += callout('bad', 'These skills rest on one person (or nobody)',
      '<ul class="bul">' + risk.map(r => `<li><b>${esc(r.s.name)}</b> — ${r.able === 0 ? 'nobody in the team can do this without help' : 'only one person can do it'}</li>`).join('') + '</ul>' +
      'Pairing, mob sessions and a deliberate “learning” item in the next Sprint are the usual moves. If nobody in the team has it at all, that is an external dependency — treat it as an impediment.' +
      `<div class="btnrow">${jump('triage', 'Take it to Impediment Triage')}</div>`);
  } else if (cov >= 70) {
    h += callout('good', 'Genuinely cross-functional', 'No critical skill depends on a single person. Keep the matrix and re-check when someone joins or leaves.');
  }
  h += card('Learning plan', 'One line per person per skill they are deliberately growing this Sprint.',
    repeater('skills.plan', [
      { k: 'who', label: 'Who', w: '.8fr', ph: 'Andrei' },
      { k: 'what', label: 'Growing', w: '1fr', ph: 'Release process' },
      { k: 'how', label: 'How', w: '1.4fr', ph: 'Pairs with Dana on the next two releases' },
      { k: 'by', label: 'By', w: '.7fr', type: 'date' },
    ], { addLabel: 'Add learning item', empty: 'No learning items yet.' }));
  return h;
}

page({
  id: 'shield', group: 'team', icon: '🛡', title: 'Disruption Shield',
  keywords: 'shield protect interruptions distractions sprint goal focus',
  lede: 'Shielding the team is not saying no to everything — it is knowing what actually costs them the Sprint Goal. Log every interruption for one Sprint and the pattern usually names itself.',
  touch() { const n = list('shield.items').length; return n === 0 ? 0 : n >= 3 ? 2 : 1; },
  body() {
    let h = srcline('guide', 'Serves “shield the team from unnecessary disruptions that threaten the Sprint Goal”.');
    h += card('Interruption log', 'Log it the moment it happens — reconstructing at the end of the Sprint always undercounts.',
      repeater('shield.items', [
        { k: 'date', label: 'Date', w: '.8fr', type: 'date', live: true },
        { k: 'src', label: 'Source', w: '1fr', type: 'sel', options: ['Stakeholder', 'Manager', 'Other team', 'Support / prod issue', 'Internal meeting', 'Unplanned work', 'Other'], blank: '—', live: true },
        { k: 'what', label: 'What was asked', w: '1.6fr', ph: 'Ad-hoc report for the steering committee' },
        { k: 'who', label: 'Who was pulled', w: '.9fr', ph: 'Dana' },
        { k: 'mins', label: 'Minutes', w: '.7fr', type: 'number', live: true },
        { k: 'goal', label: 'Hit the goal?', w: '.7fr', type: 'chk', live: true },
        { k: 'act', label: 'What you did', w: '1.2fr', ph: 'Deflected to next Sprint / absorbed it' },
      ], { addLabel: 'Log an interruption', empty: 'Nothing logged yet — start on day one of the Sprint.', tpl: { date: today() } }));
    h += `<div id="calc_shield">${shieldCalc()}</div>`;
    return h;
  },
  live() { $('calc_shield').innerHTML = shieldCalc(); }
});
function shieldCalc() {
  const it = list('shield.items');
  const mins = sum(it.map(x => num(x.mins)));
  const hrs = r1(mins / 60);
  const goalHits = it.filter(x => x.goal === true);
  const capH = num(get('avail.capHours', 0));
  const pct = capH ? Math.round(mins / 60 / capH * 100) : 0;
  const bySrc = {};
  it.forEach(x => { const s = x.src || 'Other'; bySrc[s] = (bySrc[s] || 0) + num(x.mins); });
  const top = Object.entries(bySrc).sort((a, b) => b[1] - a[1]);

  let h = `<div class="grid4">
    ${stat('Interruptions', it.length, 'logged this Sprint')}
    ${stat('Time lost', hrs + ' h', capH ? pct + '% of Sprint capacity' : 'set capacity in Team Availability', hrs > 8 ? 'bad' : hrs ? 'warn' : '')}
    ${stat('Threatened the goal', goalHits.length, goalHits.length ? 'these were real impediments' : 'none did', goalHits.length ? 'bad' : 'ok')}
    ${stat('Biggest source', top.length ? top[0][0] : '—', top.length ? r1(top[0][1] / 60) + ' h' : '', top.length ? 'warn' : '')}
  </div>`;
  if (top.length > 1) h += card('Where it comes from', 'Fix the biggest bar, not the loudest one.', top.map(([s, m]) => bar(s, m, top[0][1], r1(m / 60) + ' h')).join(''));
  if (goalHits.length) {
    h += callout('bad', 'Interruptions that threatened the Sprint Goal', '<ul class="bul">' + goalHits.map(x => `<li>${esc(x.what || '(no description)')} — ${esc(x.src || 'unknown source')}, ${num(x.mins)} min</li>`).join('') + '</ul>' +
      'Anything on this list passes the Sprint Goal litmus test — it is a genuine impediment, not a nuisance.' +
      `<div class="btnrow">${act('shield.toBoard', '→ Push these to the Impediment Board', 'btn primary')}</div>`);
  }
  if (top.length && capH && pct > 15) h += callout('warn', 'More than a sixth of the Sprint is going elsewhere', 'Take the log itself to the Sprint Review or to the manager behind the biggest source. A log beats an opinion.');
  h += card('Standing protection agreements', 'What you and the team agreed about interruptions — so you are not re-negotiating every time.',
    repeater('shield.rules', [
      { k: 'rule', label: 'Agreement', w: '2fr', ph: 'Support requests go to the PO, never to a developer directly' },
      { k: 'with', label: 'Agreed with', w: '1fr', ph: 'Head of Support' },
      { k: 'when', label: 'Since', w: '.8fr', type: 'date' },
    ], { addLabel: 'Add agreement', empty: 'No agreements captured yet.' }));
  return h;
}
ACTIONS['shield.toBoard'] = () => {
  const hits = list('shield.items').filter(x => x.goal === true);
  if (!hits.length) { toast('Nothing flagged as threatening the goal'); return; }
  const board = list('imped.items');
  let added = 0;
  hits.forEach(x => {
    const title = (x.what || 'Interruption') + ' (' + (x.src || 'unknown') + ')';
    if (board.some(b => b.title === title)) return;
    board.push({ id: uid(), title: title, scope: 'Team', status: 'To do', raised: x.date || today(), owner: '', notes: 'From the Disruption Shield log.' });
    added++;
  });
  save(true); render();
  toast(added ? added + ' pushed to the Impediment Board' : 'Already on the board');
};

function improveCalc() {
  const a = list('improve.actions');

  const open = a.filter(x => x.done !== true);
  const overdue = open.filter(x => x.due && dayDiff(x.due) > 0);
  const rate = a.length ? Math.round(done.length / a.length * 100) : 0;
  let h = `<div class="grid4">
    ${stat('Improvements', a.length, 'tracked in total')}
    ${stat('Done', done.length, rate + '% completion rate', rate >= 60 ? 'ok' : a.length ? 'warn' : '')}
    ${stat('Open', open.length, open.length > 4 ? 'too many at once' : 'in flight', open.length > 4 ? 'bad' : open.length ? 'warn' : 'ok')}
    ${stat('Overdue', overdue.length, overdue.length ? 'past their own date' : 'none late', overdue.length ? 'bad' : 'ok')}
  </div>`;
  if (open.length > 4) h += callout('warn', 'More than four improvements open at once', 'A team that is improving five things is improving none of them. Pick one per Sprint and let the retro re-choose.');
  if (overdue.length) h += callout('bad', 'Overdue improvements', '<ul class="bul">' + overdue.map(x => `<li>${esc(x.what || '(untitled)')} — ${dayDiff(x.due)} days late, owner ${esc(x.owner || '—')}</li>`).join('') + '</ul>Take these to the next Retrospective as the first agenda item: keep, re-own or drop.');
  if (a.length >= 3 && rate < 40) h += callout('bad', 'Your retrospectives are not landing', `Only ${rate}% of what the team decided actually happened. That is a retro design problem, not a team discipline problem.<div class="btnrow">${jump('retro', 'Open the Retrospective Designer')}</div>`);
  if (a.length >= 3 && rate >= 70) h += callout('good', 'The improvement loop is working', 'Show this completion rate at the Sprint Review — it is one of the few honest signals that the team is adapting.');
  return h;
}

page({
  id: 'triage', group: 'imped', icon: '🚦', title: 'Impediment Triage',
  keywords: 'impediment block triage judgment call sprint goal litmus test',
  lede: 'Every raised issue deserves a conscious judgment call: is this a genuine impediment, a block the team should clear itself, or just an irritation? Answer the questions and the verdict follows — then push it to the board if it earns a place there.',
  touch() { return get('triage.what', '') ? (get('triage.goal', '') ? 2 : 1) : 0; },
  body() {
    let h = srcline('stances', 'The Sprint Goal litmus test and the block-versus-impediment distinction come from the 8 Stances whitepaper.');
    h += card('1 · What was actually raised?', 'Write it in the words the person used. You will test later whether that is the real problem.',
      field('The issue as presented', ta('triage.what', { ph: 'The test environment is unstable', live: true })) +
      `<div class="inline">${field('Raised by', inp('triage.by', { ph: 'Dana' }))}${field('When', inp('triage.when', { type: 'date' }))}</div>`);

    h += card('2 · The five questions', 'Answer in order. Question 1 is the litmus test — the Sprint Goal decides what counts.', `
      ${field('Does it block or slow progress toward the <b>Sprint Goal</b>?', sel('triage.goal', ['Yes — the goal is at risk', 'Slows us but the goal holds', 'No effect on the goal'], { live: true }))}
      ${field('How wide is the effect?', sel('triage.scope', ['One person or one task', 'Several people or the whole team', 'Beyond this team'], { live: true }))}
      ${field('Can the team resolve it themselves inside this Sprint?', sel('triage.self', ['Yes, comfortably', 'Probably, with effort', 'No — outside their control'], { live: true }))}
      ${field('Have they actually tried yet?', sel('triage.tried', ['Not yet', 'Tried once', 'Tried repeatedly'], { live: true }))}
      ${field('Is it recurring?', sel('triage.recur', ['First time', 'Happened before', 'Chronic — every Sprint'], { live: true }))}`);

    h += card('3 · Is that the real problem?', 'Ask, do not solve. The first-presented problem is rarely the one worth fixing — the whitepaper is explicit about this.', `
      ${field('Why is that a problem? (1)', inp('triage.w1', { ph: 'Because we cannot verify the integration' }))}
      ${field('And why is that a problem? (2)', inp('triage.w2'))}
      ${field('And why is that a problem? (3)', inp('triage.w3'))}
      ${field('So the real problem seems to be…', ta('triage.real', { ph: 'We have no owned, reproducible test environment', live: true }))}`);

    h += `<div id="calc_triage">${triageCalc()}</div>`;
    return h;
  },
  live() { $('calc_triage').innerHTML = triageCalc(); }
});
function triageCalc() {
  const goal = get('triage.goal', ''), scope = get('triage.scope', ''), self = get('triage.self', ''), tried = get('triage.tried', ''), recur = get('triage.recur', '');
  if (!goal) return card('Verdict', 'Answer question 1 to get a verdict.', '');
  let verdict, kind, why, moves;
  if (goal === 'No effect on the goal' && scope === 'One person or one task') {
    verdict = 'Not an impediment'; kind = 'info';
    why = 'It does not touch the Sprint Goal and it affects one task. That is an irritation, not an impediment.';
    moves = ['Acknowledge it — dismissing it teaches people not to raise things.', 'Park it visibly (improvement list or Retro input) so it is not lost.', 'Let the person decide whether to spend time on it.'];
  } else if (self === 'No — outside their control' || scope === 'Beyond this team') {
    verdict = 'Systemic impediment — yours to carry'; kind = 'bad';
    why = 'It sits outside the team’s control. No amount of self-organization inside the team will clear it, so it is squarely Scrum Master work.';
    moves = ['Put it on the Impediment Board with scope = Organization.', 'Find who owns the system, not who is nearest.', 'Build a coalition before you push — organisational change moves slower than team change.', 'Take the pattern, not the incident, to the person with authority.'];
  } else if (goal === 'Yes — the goal is at risk') {
    verdict = 'Genuine impediment'; kind = 'bad';
    why = 'It passes the litmus test: the Sprint Goal is at risk. Impediments that threaten the goal are the ones you are accountable for helping remove.';
    moves = ['Add it to the Impediment Board today, with an owner and a date.', 'Ask the team what they need from you rather than assuming.', 'Make it visible in the Daily until it is gone.', 'Record how it was resolved — it is input for the Review and the Retro.'];
  } else if (scope === 'One person or one task' && self !== 'No — outside their control') {
    verdict = 'A block — the team clears this one'; kind = 'warn';
    why = 'It affects a single task and the team can resolve it. Solving it yourself would take the learning away and feed the Super Hero anti-pattern.';
    moves = ['Ask what they have tried and what they would do next.', 'Offer to be the fallback, with a time limit: "if it is still stuck tomorrow, bring it back".', 'Watch it — a block that keeps recurring becomes an impediment.'];
  } else {
    verdict = 'Impediment — but coach first'; kind = 'warn';
    why = 'It is wider than one task but still inside the team’s reach. Your job is to make it removable, not to remove it for them.';
    moves = ['Name it in the Daily and let the team propose the fix.', 'Take the part that needs your access or authority — leave the rest.', 'If nothing moves by the next Daily, escalate it on the board.'];
  }
  if (tried === 'Not yet' && kind === 'warn') moves.unshift('They have not tried yet — that alone is a reason to hold back a beat.');
  if (recur === 'Chronic — every Sprint') moves.push('Chronic: stop fixing instances. Take the pattern to the Retrospective or the Systemic Obstacle Map.');

  let h = card('Verdict', '', callout(kind, verdict, esc(why) + '<ul class="bul" style="margin-top:8px">' + moves.map(m => `<li>${esc(m)}</li>`).join('') + '</ul>') + `
    <div class="btnrow">
      ${act('triage.toBoard', '＋ Add to the Impediment Board', 'btn primary')}
      ${act('triage.clear', '↺ Clear and triage the next one')}
      ${recur === 'Chronic — every Sprint' ? jump('systemic', 'Systemic Obstacle Map') : ''}
    </div>`);
  h += card('The distinction, for reference', '', `
    <div class="grid2">
      <div class="card flat" style="margin-bottom:0"><h3>Block</h3><div class="hint" style="margin-bottom:0">Affects one task. The team can usually self-fix it. You stay available, not involved.</div></div>
      <div class="card flat" style="margin-bottom:0"><h3>Impediment</h3><div class="hint" style="margin-bottom:0">Affects overall progress and the Sprint Goal. Often needs your reach, access or authority.</div></div>
    </div>`);
  return h;
}
ACTIONS['triage.toBoard'] = () => {
  const t = get('triage.real', '') || get('triage.what', '');
  if (!t) { toast('Describe the issue first'); return; }
  const scopeAns = get('triage.scope', ''), selfAns = get('triage.self', '');
  const scope = (scopeAns === 'Beyond this team' || selfAns === 'No — outside their control') ? 'Organization' : 'Team';
  list('imped.items').push({
    id: uid(), title: t, scope: scope, status: 'To do', raised: get('triage.when', '') || today(),

function boardCalc() {

page({
  id: 'intervene', group: 'imped', icon: '🤔', title: 'Intervene or Step Back?',
  keywords: 'intervene step back self-organization super hero servant leader',

  touch() { return get('int.sit', '') ? (rateCount('int.q', INT_Q) >= 4 ? 2 : 1) : 0; },
  body() {
    let h = srcline('stances', 'Built on “actively decide when to intervene and when to let the team self-organize”, plus the Super Hero anti-pattern.');
    h += card('The situation', '', field('What is in front of you right now?', ta('int.sit', { ph: 'Two developers have disagreed about the approach for three days', live: true })));
    h += card('Score it', '0 = strongly disagree, 5 = strongly agree.', rateRows('int.q', INT_Q));
    h += `<div id="calc_int">${intCalc()}</div>`;
    return h;
  },
  live() { $('calc_int').innerHTML = intCalc(); }
});
const INT_Q = [
  { k: 'goal',   l: 'The Sprint Goal is genuinely at risk if nothing changes', s: 'Not "it would be tidier" — actually at risk.' },
  { k: 'reach',  l: 'It needs access, authority or relationships the team does not have' },
  { k: 'tried',  l: 'The team has already tried and is still stuck' },
  { k: 'safe',   l: 'Letting them struggle is safe — nobody gets hurt, nothing irreversible breaks', s: 'A high score here argues for stepping back.' },
  { k: 'learn',  l: 'There is real learning for them in working it out themselves', s: 'A high score here argues for stepping back.' },
  { k: 'habit',  l: 'I have solved this kind of thing for them before', s: 'A high score here is a Super Hero warning.' },
];
function intCalc() {
  const g = num(get('int.q.goal', 0)), reach = num(get('int.q.reach', 0)), tried = num(get('int.q.tried', 0));
  const safe = num(get('int.q.safe', 0)), learn = num(get('int.q.learn', 0)), habit = num(get('int.q.habit', 0));
  const answered = rateCount('int.q', INT_Q);
  if (answered < 3) return card('Recommendation', 'Score at least three statements.', '');
  const forAct = g * 1.4 + reach * 1.3 + tried * 1.1;
  const forBack = safe * 1.2 + learn * 1.3 + habit * 0.9;
  const delta = forAct - forBack;
  let title, kind, body;
  if (delta > 6) {
    title = 'Intervene — this one is yours'; kind = 'bad';
    body = 'The goal is at risk and it needs reach the team does not have. Act, but narrate what you are doing and why, so it does not read as rescue.';
  } else if (delta > 2) {
    title = 'Act on the part only you can reach'; kind = 'warn';
    body = 'Split the problem. Take the piece that needs your access or authority; leave the technical or interpersonal piece with the team and say so out loud.';
  } else if (delta > -2) {
    title = 'Coach, do not solve'; kind = 'info';
    body = 'Ask what they have tried, what they would do with no constraints, and what they need from you. Set a checkpoint — "if it is still here at tomorrow’s Daily, bring it back to me".';
  } else {
    title = 'Step back'; kind = 'good';
    body = 'It is safe, they can learn from it, and you have form for taking this away from them. Stay visible and quiet. Self-organization is a muscle that only grows under load.';
  }
  let h = `<div class="grid3">
    ${stat('Pull to act', r1(forAct), 'goal risk · reach · already tried', forAct > forBack ? 'warn' : '')}
    ${stat('Pull to step back', r1(forBack), 'safety · learning · your habit', forBack >= forAct ? 'ok' : '')}
    ${stat('Lean', delta > 2 ? 'Act' : delta > -2 ? 'Coach' : 'Step back', 'net signal', delta > 2 ? 'bad' : delta > -2 ? 'warn' : 'ok')}
  </div>`;
  h += callout(kind, title, body);
  if (habit >= 4) h += callout('bad', 'Super Hero warning', 'You have solved this kind of thing for them before. Every rescue lowers the odds they try next time. If you act, say explicitly that this is the last time you take this one.');
  h += card('Decide and record it', '', field('What you decided, and what you will watch for', ta('int.decision', { ph: 'Stepping back until Thursday’s Daily. If the approach is still undecided, I will facilitate a 30-minute decision session.' })) +
    `<div class="btnrow">${act('int.log', '＋ Log this call')}</div>` +
    repeater('int.log', [
      { k: 'sit', label: 'Situation', w: '1.6fr' },
      { k: 'call', label: 'Call', w: '.9fr', type: 'sel', options: ['Intervened', 'Coached', 'Stepped back'], blank: '—' },
      { k: 'out', label: 'How it turned out', w: '1.4fr', ph: 'They resolved it in a day' },
      { k: 'date', label: 'Date', w: '.8fr', type: 'date' },
    ], { addLabel: 'Add row', empty: 'No calls logged yet — this log is how you learn your own bias.' }));
  return h;
}

page({

function empCalc() {
  const hist = list('emp.hist').map(x => num(x.done)).filter(v => v > 0);
  if (hist.length < 2) return card('Forecast', 'Add at least two Sprints of completed work.', '');
  const mean = avg(hist), lo = Math.min.apply(null, hist), hi = Math.max.apply(null, hist);
  const rem = num(get('emp.remain', 0));
  const wk = num(get('emp.weeks', 2)) || 2;
  const start = get('emp.start', '');
  const spr = v => v > 0 ? Math.ceil(rem / v) : 0;
  const best = spr(hi), likely = spr(mean), worst = spr(lo);
  const dt = n => start && n ? niceDate(addDays(start, n * wk * 7 - 1)) : '—';
  const spread = mean ? Math.round((hi - lo) / mean * 100) : 0;

  let h = `<div class="grid4">
    ${stat('Sprints measured', hist.length, hist.length < 3 ? 'three is the minimum' : 'enough to forecast', hist.length < 3 ? 'warn' : 'ok')}
    ${stat('Average', r1(mean), 'per Sprint', 'hi')}
    ${stat('Range', lo + ' – ' + hi, 'lowest to highest')}
    ${stat('Variability', spread + '%', spread > 60 ? 'too noisy to promise dates' : 'usable spread', spread > 60 ? 'bad' : spread > 35 ? 'warn' : 'ok')}
  </div>`;
  if (rem > 0) {
    h += card('Forecast for ' + rem + ' remaining', 'Three numbers, always given together. If someone asks for “the” date, give them the likely case and the worst case in the same sentence.', `
      <div class="grid3">
        ${stat('Best case', best + ' Sprint' + (best === 1 ? '' : 's'), dt(best), 'ok')}
        ${stat('Likely', likely + ' Sprint' + (likely === 1 ? '' : 's'), dt(likely), 'hi')}
        ${stat('Worst case', worst + ' Sprint' + (worst === 1 ? '' : 's'), dt(worst), 'bad')}
      </div>`);
    const maxV = Math.max.apply(null, hist);
    h += card('History', '', list('emp.hist').filter(x => num(x.done) > 0).map(x => bar(x.sprint || '—', num(x.done), maxV, num(x.done))).join(''));
  } else {
    h += callout('info', 'Enter what is left', 'Add the remaining backlog size above to turn this history into a forecast.');
  }
  if (spread > 60) h += callout('bad', 'The spread is too wide to commit to', 'A range this noisy usually means unfinished work carrying over, items sized inconsistently, or the team being interrupted. Look at the Disruption Shield before you look at estimation.');
  h += callout('warn', 'How to say it', 'Not “it will be done on the 14th”. Say: “based on the last ' + hist.length + ' Sprints, the likely range is ' + best + ' to ' + worst + ' Sprints. We will know more each Sprint and I will update the range.” That sentence is empiricism in practice.');
  return h;
}

  const histAvg = hist.length ? r1(avg(hist)) : 0;
  if (histAvg && !get('plan.avg', '')) { set('plan.avg', histAvg); }
  const cap = num(get('plan.cap', 0)), pulled = num(get('plan.pulled', 0));
  const serves = get('plan.serves', '');
  const ready = checkDone('plan.ready', ['Every item has a shared understanding of what Done means', 'Items are small enough to finish inside the Sprint', 'Dependencies outside the team are named', 'The team, not the PO alone, judged the items ready', 'Nothing was added after the discussion "just in case there is time"'].map(l => ({ l })));
  const over = cap ? Math.round((pulled - cap) / cap * 100) : 0;
  const vsHist = histAvg ? Math.round((pulled - histAvg) / histAvg * 100) : 0;

  let h = `<div class="grid4">
    ${stat('Sprint Goal', get('plan.goal', '') ? (serves === 'Yes — clearly' ? 'Set' : serves ? 'Weak' : 'Set') : '—', serves || 'not tested against the Product Goal', serves === 'Yes — clearly' ? 'ok' : serves ? 'bad' : '')}
    ${stat('Items ready', ready + '/5', ready === 5 ? 'good to plan' : 'gaps to raise', ready === 5 ? 'ok' : ready >= 3 ? 'warn' : 'bad')}
    ${stat('Pulled vs capacity', cap ? (over > 0 ? '+' + over + '%' : over + '%') : '—', cap ? pulled + ' against ' + cap : 'enter both numbers', over > 10 ? 'bad' : cap ? 'ok' : '')}
    ${stat('Vs history', histAvg ? (vsHist > 0 ? '+' + vsHist + '%' : vsHist + '%') : '—', histAvg ? 'average ' + histAvg : 'no history yet', vsHist > 20 ? 'bad' : histAvg ? 'ok' : '')}
  </div>`;
  const flags = [];
  if (serves === 'No — it is a list of tasks') flags.push(['bad', 'The Sprint Goal does not support the Product Goal', 'This is one of the four moments the material tells you to step in. Ask: "if we finish all of this, what will be true for a user that is not true today?" The answer is the goal.']);
  else if (serves === 'Partly') flags.push(['warn', 'The Sprint Goal only partly serves the Product Goal', 'Worth one question in the room before you move on.']);
  if (ready < 4 && (get('plan.goal', '') || pulled)) flags.push(['warn', 'The items are not sufficiently defined', 'Step in now, not on day three. Either refine in the room or take less into the Sprint.']);
  if (over > 10) flags.push(['bad', 'The team is pulling ' + over + '% more than its own capacity', 'Do not decide for them. Show them the number and ask what they would drop if the Sprint Goal had to survive.']);
  if (vsHist > 20 && histAvg) flags.push(['warn', 'This is ' + vsHist + '% above the historical average of ' + histAvg, 'Ask what is different this Sprint. If nothing is, the plan is optimism.']);
  if (get('plan.imped', '')) flags.push(['info', 'An impediment is already visible', 'Put it on the board before the Sprint starts — it will not get smaller.']);
  if (!flags.length && get('plan.goal', '')) flags.push(['good', 'Nothing to intervene on', 'Goal serves the Product Goal, items are ready, the amount is realistic. Facilitate and stay out of the way.']);
  flags.forEach(f => { h += callout(f[0], f[1], f[2]); });
  if (get('plan.imped', '')) h += `<div class="btnrow" style="margin-bottom:20px">${act('plan.toBoard', '＋ Put that impediment on the board')}</div>`;
  return h;
}
ACTIONS['plan.toBoard'] = () => {

  list('imped.items').push({ id: uid(), title: t, scope: 'Team', status: 'To do', raised: today(), impact: 'Sprint Goal at risk', owner: '', notes: 'Spotted during Sprint Planning.' });

function calCalc() {
  const w = num(get('cal.weeks', 2)) || 2;
  const start = get('cal.start', '');
  const days = w * 5;
  const box = { plan: 120 * w, review: 60 * w, retro: 45 * w, daily: 15 };
  const end = start ? addDays(start, w * 7 - 3) : '';
  const rows = [
    ['Sprint Planning', start ? niceDate(start) : '—', box.plan, 'The whole Scrum Team. You often facilitate.'],
    ['Daily Scrum ×' + days, get('cal.dailyat', '09:30') + ' each working day', box.daily, 'Developers only run it. You attend at most as an observer.'],
    ['Sprint Review', end ? niceDate(end) : '—', box.review, 'Team plus stakeholders. Progress and priorities visible.'],
    ['Sprint Retrospective', end ? niceDate(end) : '—', box.retro, 'You facilitate. Ends the Sprint.'],
  ];
  const eventMins = box.plan + box.daily * days + box.review + box.retro;
  const extra = sum(list('cal.extra').map(e => num(e.mins)));
  const capMins = days * 6 * 60;
  const pct = Math.round((eventMins + extra) / capMins * 100);

  let h = card('The Sprint at a glance', 'Maximum timeboxes — shorter is fine, longer is not.',
    `<div class="rep"><div class="rep-head" style="grid-template-columns:1.2fr 1.2fr .8fr 1.6fr"><div>Event</div><div>When</div><div>Max</div><div>Whose event</div></div>` +
    rows.map(r => `<div class="rep-row" style="grid-template-columns:1.2fr 1.2fr .8fr 1.6fr">

  h += `<div class="grid4">
    ${stat('Sprint length', w + ' week' + (w === 1 ? '' : 's'), days + ' working days')}

    ${stat('Time in Scrum events', r1(eventMins / 60) + ' h', 'across the Sprint')}
    ${stat('Meeting load', pct + '%', 'of a 6-hour working day', pct > 25 ? 'bad' : pct > 15 ? 'warn' : 'ok')}
  </div>`;
  if (pct > 25) h += callout('bad', 'A quarter of the Sprint is in meetings', 'Scrum events are not the problem here — look at what is in the extra list. Removing a recurring meeting is one of the most valuable impediments you will ever clear.');

  h += callout('info', 'Teach the picture', 'Print this and put it where the team sits. Teaching the team to visualise the Sprint — calendar, backlog, burn-down, impediment board, availability — is one of the named teaching tasks of the role.');
  return h;
}

        { k: 'note', label: 'Note', w: '2.4fr', ph: 'Two items added mid-Sprint at the PO’s request' },
      ], { addLabel: 'Add day', empty: 'No days recorded yet.', tpl: {} }));
    h += `<div id="calc_burn">${burnCalc()}</div>`;
    return h;
  },
  live() { $('calc_burn').innerHTML = burnCalc(); }
});
function burnCalc() {
  const total = num(get('burn.total', 0));
  const nd = num(get('burn.days_n', 10)) || 10;
  const unit = get('burn.unit', 'story points');
  const pts = list('burn.days').map(d => ({ x: num(d.day), y: num(d.rem), note: d.note })).filter(p => p.x > 0).sort((a, b) => a.x - b.x);
  if (!total || !pts.length) return card('Chart', 'Enter the starting scope and at least one day.', '');

  const W = 640, H = 300, ml = 42, mb = 30, mt = 14, mr = 12;
  const maxY = Math.max(total, Math.max.apply(null, pts.map(p => p.y))) * 1.05 || 1;
  const px = x => ml + (x / nd) * (W - ml - mr);
  const py = y => mt + (1 - y / maxY) * (H - mt - mb);
  let g = `<rect x="${ml}" y="${mt}" width="${W - ml - mr}" height="${H - mt - mb}" fill="var(--surface2)" opacity=".5"/>`;
  for (let i = 0; i <= 4; i++) {
    const y = maxY * i / 4;
    g += `<line x1="${ml}" y1="${py(y).toFixed(1)}" x2="${W - mr}" y2="${py(y).toFixed(1)}" stroke="var(--border)"/>`;
    g += `<text x="${ml - 6}" y="${(py(y) + 3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(y)}</text>`;
  }
  for (let d = 0; d <= nd; d++) {
    if (d % (nd > 12 ? 2 : 1)) continue;
    g += `<text x="${px(d).toFixed(1)}" y="${H - mb + 15}" text-anchor="middle" font-size="10" fill="var(--muted)">${d}</text>`;
  }
  g += `<line x1="${px(0)}" y1="${py(total).toFixed(1)}" x2="${px(nd).toFixed(1)}" y2="${py(0).toFixed(1)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  const path = [[0, total]].concat(pts.map(p => [p.x, p.y])).map(p => `${px(p[0]).toFixed(1)},${py(p[1]).toFixed(1)}`).join(' ');
  g += `<polyline points="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach(p => {
    g += `<circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="4" fill="var(--accent)"><title>Day ${p.x}: ${p.y} left${p.note ? ' — ' + p.note : ''}</title></circle>`;
  });
  g += `<text x="${W - mr}" y="${mt + 12}" text-anchor="end" font-size="10" fill="var(--muted)">ideal ---  ·  actual —</text>`;
  const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${g}</svg>`;

  const last = pts[pts.length - 1];
  const ideal = total * (1 - last.x / nd);
  const diff = last.y - ideal;
  const doneSoFar = total - last.y;
  const rate = last.x ? doneSoFar / last.x : 0;
  const projDays = rate > 0 ? r1(last.y / rate) : 0;
  const projEnd = rate > 0 ? r1(last.x + projDays) : 0;
  const flat = pts.length >= 3 && pts[pts.length - 1].y === pts[pts.length - 2].y && pts[pts.length - 2].y === pts[pts.length - 3].y;
  const rises = pts.filter((p, i) => i > 0 && p.y > pts[i - 1].y);

  let h = card('Burn-down', `Day ${last.x} of ${nd} · ${last.y} ${esc(unit)} remaining`, svg);
  h += `<div class="grid4">
    ${stat('Remaining', last.y + '', esc(unit))}
    ${stat('Versus ideal', (diff > 0 ? '+' : '') + r1(diff), diff > 0 ? 'behind the line' : 'at or ahead of the line', diff > total * 0.15 ? 'bad' : diff > 0 ? 'warn' : 'ok')}
    ${stat('Burn rate', r1(rate), esc(unit) + ' per day')}
    ${stat('Projected finish', projEnd ? 'day ' + projEnd : '—', projEnd && projEnd > nd ? (r1(projEnd - nd)) + ' days late' : 'inside the Sprint', projEnd > nd ? 'bad' : projEnd ? 'ok' : '')}
  </div>`;
  if (flat) h += callout('bad', 'Three flat days', 'Nothing finished for three days. Usually one of three things: items too big to close, work in progress everywhere, or an impediment nobody named. Ask which — do not guess out loud.');
  if (rises.length) h += callout('warn', rises.length + ' upward step' + (rises.length === 1 ? '' : 's'), 'Scope went up mid-Sprint. That is legitimate if the Sprint Goal is unchanged and the team agreed — and corrosive if it just appeared. Check the notes on those days.');
  if (projEnd > nd) h += callout('bad', 'At this rate the Sprint will not finish', 'The conversation is with the Product Owner, today rather than on the last day: what part of the Sprint Goal still has to survive?');
  if (diff <= 0 && pts.length >= 3) h += callout('good', 'Tracking at or ahead of the line', 'Resist reporting it upward as a promise. A burn-down is an inspection aid for the team, not a performance metric.');
  h += callout('info', 'Say this out loud when you show it', 'The chart shows what happened, not who is at fault. The moment it is used to compare people or teams it stops being usable — everyone learns to make the line look right.');
  return h;
}

function availCalc() {
  const days = num(get('avail.days', 10)) || 10;
  const hpd = num(get('avail.hours', 8)) || 8;
  const ppl = list('avail.people').filter(p => p.name);
  if (!ppl.length) return '';
  const rows = ppl.map(p => {
    const d = Math.max(0, days - num(p.off));
    const f = clamp(num(p.focus) || 75, 10, 100) / 100;
    return { p, personDays: r1(d * f), hours: r1(d * hpd * f) };
  });
  const totalDays = r1(sum(rows.map(r => r.personDays)));
  const totalHours = r1(sum(rows.map(r => r.hours)));
  const nominal = ppl.length * days;
  const lossPct = nominal ? Math.round((1 - totalDays / nominal) * 100) : 0;
  set('avail.capHours', totalHours); set('avail.capDays', totalDays); save();

  let h = `<div class="grid4">
    ${stat('People', ppl.length, 'in the Sprint')}
    ${stat('Capacity', totalDays + ' person-days', totalHours + ' hours', 'hi')}
    ${stat('Nominal', nominal + ' person-days', 'if nobody was away or interrupted')}
    ${stat('Reduction', lossPct + '%', 'absence and focus factor', lossPct > 40 ? 'bad' : lossPct > 25 ? 'warn' : 'ok')}
  </div>`;
  h += card('Per person', 'The bar is available person-days after time off and focus factor.',
    rows.map(r => bar(r.p.name + (r.p.note ? ' — ' + r.p.note : ''), r.personDays, days, r.personDays + ' d')).join(''));
  if (lossPct > 40) h += callout('bad', 'Less than two-thirds of the nominal capacity is really there', 'Take this number into Sprint Planning before the team pulls work, not after. It is also the honest answer when someone asks why velocity dropped.');
  const thin = rows.filter(r => r.personDays < days * 0.4);
  if (thin.length) h += callout('warn', thin.length + ' person' + (thin.length === 1 ? '' : 's') + ' barely available', thin.map(r => esc(r.p.name)).join(', ') + '. Check the skills matrix — if one of them holds a critical skill, this Sprint has a hidden single point of failure.' + `<div class="btnrow">${jump('skills', 'Check the matrix')}</div>`);
  h += callout('info', 'Feeds two other tools', 'This capacity number is used by the Disruption Shield to show interruptions as a percentage of the Sprint, and it is the sanity check in the Sprint Planning Guard.');
  return h;
}

function visCalc() {
  const sc = { 'Does not exist': 0, 'Exists but stale': 1, 'Current but hidden': 2, 'Current and visible': 3 };
  const vals = VIS_ITEMS.map(v => ({ v, s: sc[get('vis.' + v.k + '.state', '')] }));

  if (!rated.length) return '';
  const pct = Math.round(sum(rated.map(x => x.s)) / (rated.length * 3) * 100);
  const missing = rated.filter(x => x.s === 0);
  const hidden = rated.filter(x => x.s === 2);
  const stale = rated.filter(x => x.s === 1);
  const youKeep = VIS_ITEMS.filter(v => /^(me|i|scrum master|sm)$/i.test(String(get('vis.' + v.k + '.who', '')).trim()));

    ${stat('Stale', stale.length, 'exist but out of date', stale.length ? 'warn' : 'ok')}

  if (youKeep.length) h += callout('warn', 'You are maintaining ' + youKeep.length + ' of these yourself', 'That is the Admin and Scribe anti-pattern arriving quietly. Teach the team to keep them; ownership is the point of the artefact, not neatness.');
  if (pct >= 85) h += callout('good', 'The Sprint is genuinely visible', 'You can stop explaining status in meetings and start pointing at things.');
  return h;
}

const QBANK = {
  'Opening a conversation': ['What is most on your mind right now?', 'Where would you like to start?', 'What would make this half hour worth it?'],
  'When someone is stuck': ['What have you already tried?', 'What would you do if it were entirely up to you?', 'What is stopping you that is not the obvious thing?', 'What would good look like here?'],
  'When the team blames elsewhere': ['What part of this is inside our control?', 'What would we do if they never changed?', 'What have we contributed to this?'],
  'When a decision is circling': ['What do we need to know before we can decide?', 'What happens if we decide nothing?', 'How will we know if this was the right call?'],
  'When something failed': ['What did we learn that we could not have learned any other way?', 'What did we know at the time?', 'What would we do differently at the same moment?'],
  'Closing / forwarding the action': ['What will you do before we next talk?', 'What might get in the way of that?', 'What support do you want from me — and what do you not want?'],
};
function qCalc() {
  const q = String(get('q.text', '')).trim();
  if (!q) return '';
  const words = q.split(/\s+/).filter(Boolean);
  const first = words[0] ? words[0].toLowerCase().replace(/[^a-z]/g, '') : '';
  const closedStart = ['do', 'did', 'does', 'is', 'are', 'was', 'were', 'can', 'could', 'should', 'would', 'will', 'have', 'has', 'shall', 'am', 'dont', 'doesnt', 'didnt', 'isnt', 'arent', 'wasnt', 'werent', 'cant', 'couldnt', 'shouldnt', 'wouldnt', 'wont', 'havent', 'hasnt'].includes(first);
  const open = ['what', 'how', 'who', 'when', 'where', 'which'].includes(first);
  const why = first === 'why';
  const leading = /(don't you|dont you|shouldn't|shouldnt|isn't it|isnt it|obviously|surely|just|why don't you|why dont you|have you tried|instead of)/i.test(q);
  const short = words.length <= 12;
  const stacked = (q.match(/\?/g) || []).length > 1;

  const checks = [
    { ok: open || (!closedStart && !why), l: open ? 'Open — starts with "' + first + '"' : closedStart ? 'Closed — invites yes or no' : why ? 'Starts with "why"' : 'Open enough', bad: closedStart, warn: why },
    { ok: !leading, l: leading ? 'Leading — it carries your answer inside it' : 'Neutral — no answer smuggled in', bad: leading },
    { ok: short, l: short ? 'Short — ' + words.length + ' words' : 'Long — ' + words.length + ' words, the point will be lost', bad: !short },
    { ok: !stacked, l: stacked ? 'Two questions in one — they will answer only the easier one' : 'One question', bad: stacked },
  ];
  const score = checks.filter(c => c.ok).length;
  const names = ['Open', 'Neutral', 'Short', 'Single'];
  let h = `<div class="grid4">${checks.map((c, i) => stat(names[i], c.ok ? '✓' : '✕', c.l, c.bad ? 'bad' : c.ok ? 'ok' : 'warn')).join('')}</div>`;
  if (score === 4) h += callout('good', 'That is a powerful question', 'Ask it, then stop talking.');
  else {
    const fixes = [];
    if (closedStart) fixes.push('Swap the opening word for <b>what</b> or <b>how</b>. "Can you fix it?" becomes "what would it take to fix it?"');
    if (why) fixes.push('"Why" often lands as an accusation even when it is not meant that way. "What led to…" gets the same information without the defence.');
    if (leading) fixes.push('Take your own answer out of the sentence. If they can hear what you want them to say, it is advice wearing a question mark.');
    if (!short) fixes.push('Cut it to under twelve words. Long questions get answered in the last clause only.');
    if (stacked) fixes.push('Ask one. Then be quiet. Then ask the other if it is still needed.');
    h += callout(score <= 2 ? 'bad' : 'warn', 'How to sharpen it', '<ul class="bul">' + fixes.map(f => `<li>${f}</li>`).join('') + '</ul>');
  }
  return h;
}

function facCalc() {
  const total = num(get('fac.mins', 60)) || 60;
  const ag = list('fac.agenda');
  const planned = sum(ag.map(a => num(a.mins)));
  const people = num(get('fac.people', 7)) || 7;
  const plenary = ag.filter(a => a.mode === 'Plenary');
  const plenaryMins = sum(plenary.map(a => num(a.mins)));
  const rule = get('fac.rule', ''), said = get('fac.said', '');
  const left = total - planned;
  let h = `<div class="grid4">
    ${stat('Planned', planned + ' min', 'across ' + ag.length + ' activities')}
    ${stat('Slack', left + ' min', left < 0 ? 'over the timebox' : left < total * 0.1 ? 'no room to breathe' : 'room for the unexpected', left < 0 ? 'bad' : left < total * 0.1 ? 'warn' : 'ok')}
    ${stat('Plenary time', planned ? Math.round(plenaryMins / planned * 100) + '%' : '—', 'whole-group discussion', plenaryMins / Math.max(1, planned) > 0.5 ? 'warn' : 'ok')}
    ${stat('Decision rule', rule ? (said === 'Yes' ? 'Agreed' : 'Chosen') : '—', rule ? (said === 'Yes' ? 'and stated out loud' : 'say it at the start') : 'not chosen yet', rule && said === 'Yes' ? 'ok' : rule ? 'warn' : 'bad')}
  </div>`;
  if (left < 0) h += callout('bad', 'The agenda does not fit', 'You are ' + Math.abs(left) + ' minutes over. Cut an activity now rather than rushing the last one — the last activity is usually the decision.');
  if (!rule) h += callout('bad', 'No decision rule chosen', 'This is the technique the material flags specifically. Without it, whatever the group decides can be re-litigated by whoever is unhappy.');
  else if (said !== 'Yes') h += callout('warn', 'Say the rule out loud before you start', '"We will decide by ' + esc(rule.toLowerCase()) + '. Everyone all right with that?" Ten seconds, and the end of the session becomes possible.');
  if (planned && plenaryMins / planned > 0.5 && people > 5) h += callout('warn', 'Mostly whole-group discussion with ' + people + ' people', 'Plenary favours the confident. Move at least the generating activities to solo or pairs first — 1-2-4-All exists for exactly this.');
  if (ag.length && left >= 0 && rule && said === 'Yes') h += callout('good', 'This session is designed', 'Objective stated, decision rule agreed, agenda fits, participation mixed. Now be willing to abandon the agenda if the objective needs it.');
  return h;
}

function delCalc() {
  const rows = DELEG.map(d => {
    const k = d.slice(0, 20).replace(/\W/g, '');
    return { d, now: num(get('del.' + k, 0)), tgt: num(get('deltgt.' + k, 0)) };
  }).filter(r => r.now > 0);
  if (!rows.length) return '';
  const a = r1(avg(rows.map(r => r.now)));
  const gaps = rows.filter(r => r.tgt > 0 && r.tgt > r.now).sort((x, y) => (y.tgt - y.now) - (x.tgt - x.now));
  const low = rows.filter(r => r.now <= 2);
  let h = `<div class="grid3">
    ${stat('Average authority', a + '/7', rows.length + ' decisions placed', a >= 5 ? 'ok' : a >= 3.5 ? 'warn' : 'bad')}
    ${stat('Still told', low.length, 'decided at level 1–2', low.length ? 'bad' : 'ok')}
    ${stat('Gaps to close', gaps.length, gaps.length ? 'below their target level' : 'none', gaps.length ? 'warn' : 'ok')}
  </div>`;
  h += card('Current placement', '', rows.map(r => bar(r.d, r.now, 7, 'L' + r.now + (r.tgt ? ' → L' + r.tgt : ''))).join(''));
  if (gaps.length) h += callout('warn', 'Biggest delegation gap: ' + esc(gaps[0].d), 'From level ' + gaps[0].now + ' to level ' + gaps[0].tgt + '. Move one level at a time and say the move out loud — "from now on you decide this and tell me afterwards". A silent promotion in authority is never used.');
  if (low.length >= 4) h += callout('bad', 'Most decisions are still being told', 'A team told what to do on this many fronts will not self-organise on any of them, however often they are invited to. Pick one and move it two levels this month.');
  if (a >= 5.5) h += callout('good', 'Genuinely delegated', 'Check that the team agrees with these numbers. Delegation that only exists in your head is not delegation.');
  return h;
}

function sysCalc() {

  const W = 460, H = 380, m = 46;
  const px = v => m + ((clamp(num(v), 1, 5) - 1) / 4) * (W - m * 2);
  const py = v => H - m - ((clamp(num(v), 1, 5) - 1) / 4) * (H - m * 2);
  let g = `<rect x="${m}" y="${m}" width="${W - m * 2}" height="${H - m * 2}" fill="var(--surface2)" opacity=".55"/>
