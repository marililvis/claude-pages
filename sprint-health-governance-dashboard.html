  { id: uid('sw'), storyRef: 'S-411', note: 'Session timeout modal fired on active tabs', people: 2, startedAt: agoAt(2, '10:00'), resolvedAt: agoAt(2, '12:45') },
];

const dayAvg = (counts) => {
  const n = sum(counts);
  return n ? sum(counts.map((c, i) => c * (i + 1))) / n : 0;
};
const hoursBetween = (a, b) => {
  const ms = new Date(b) - new Date(a);
  return isFinite(ms) ? ms / 3600000 : 0;
};
const durationLabel = (h) => (h < 24 ? round1(h) + ' h' : round1(h / 24) + ' d (' + Math.round(h) + ' h)');

function SentimentChart({ rows }) {
  const W = 780, H = 260;
  const m = { l: 42, r: 18, t: 18, b: 42 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const step = rows.length > 1 ? pw / (rows.length - 1) : 0;
  const x = (i) => (rows.length === 1 ? m.l + pw / 2 : m.l + i * step);
  const y = (v) => m.t + ph - ((clamp(v, 1, 5) - 1) / 4) * ph;
  const mean = avg(rows.filter((r) => r.n > 0).map((r) => r.avg));
  const labelEvery = Math.max(1, Math.ceil(rows.length / 10));

  return (
    <svg viewBox={'0 0 ' + W + ' ' + H} className="h-[260px] w-full" preserveAspectRatio="xMidYMid meet">
      {[1, 2, 3, 4, 5].map((t) => (
        <g key={t}>
          <line x1={m.l} x2={W - m.r} y1={y(t)} y2={y(t)} stroke={GRID} strokeWidth="1" />
          <text x={m.l - 8} y={y(t) + 4} textAnchor="end" fontSize="11" fill={TICK} className="num">{t}</text>
        </g>
      ))}

      {mean > 0 && (
        <>
          <line x1={m.l} x2={W - m.r} y1={y(mean)} y2={y(mean)} stroke="#94a3b8" strokeWidth="1.5" strokeDasharray="5 4" />
          <text x={W - m.r} y={y(mean) - 6} textAnchor="end" fontSize="10" fill="#94a3b8" className="num">sprint mean {round2(mean)}</text>
        </>
      )}

      <polyline
        points={rows.filter((r) => r.n > 0).map((r) => x(rows.indexOf(r)) + ',' + y(r.avg)).join(' ')}
        fill="none" stroke="#0d9488" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"
      />

      {rows.map((r, i) => (r.n > 0 ? (
        <g key={r.id}>
          <circle cx={x(i)} cy={y(r.avg)} r={4 + Math.min(4, r.n * 0.35)} fill="#0d9488" fillOpacity="0.85" stroke="#fff" strokeWidth="1.5">
            <title>{shortDate(r.date) + ' — average ' + round2(r.avg) + ' from ' + r.n + ' anonymous check-ins'}</title>
          </circle>
          <text x={x(i)} y={y(r.avg) - 12} textAnchor="middle" fontSize="10" fill="#0f766e" fontWeight="700" className="num">{round1(r.avg)}</text>
        </g>
      ) : null))}

      {rows.map((r, i) => (i % labelEvery === 0 || i === rows.length - 1 ? (
        <text key={r.id + '-l'} x={x(i)} y={H - 18} textAnchor="middle" fontSize="10" fill={TICK}>{shortDate(r.date)}</text>
      ) : null))}

      <line x1={m.l} x2={m.l} y1={m.t} y2={m.t + ph} stroke={AXIS} />
      <line x1={m.l} x2={W - m.r} y1={m.t + ph} y2={m.t + ph} stroke={AXIS} />
      <text x={12} y={m.t + ph / 2} textAnchor="middle" fontSize="11" fill={TICK} transform={'rotate(-90 12 ' + (m.t + ph / 2) + ')'}>
        average mood
      </text>
    </svg>
  );
}

function TeamHealthTab({ sentiment, setSentiment, swarms, setSwarms }) {
  const [checkinDate, setCheckinDate] = useState(TODAY_ISO);
  const [justSubmitted, setJustSubmitted] = useState(null);
  const [draft, setDraft] = useState({ storyRef: '', note: '', people: 3, startedAt: agoAt(0, '10:00'), resolvedAt: agoAt(0, '14:00') });

  const rows = useMemo(
    () => sentiment
      .slice()
      .sort((a, b) => (a.date < b.date ? -1 : 1))
      .map((d) => ({ ...d, n: sum(d.counts), avg: dayAvg(d.counts) })),
    [sentiment]
  );

  const submit = (score) => {
    setSentiment((all) => {
      const existing = all.find((d) => d.date === checkinDate);
      if (existing) {
        return all.map((d) => (d.date === checkinDate
          ? { ...d, counts: d.counts.map((c, i) => (i === score - 1 ? c + 1 : c)) }
          : d));
      }
      const counts = [0, 0, 0, 0, 0];
      counts[score - 1] = 1;
      return [...all, { id: uid('m'), date: checkinDate, counts }];
    });
    setJustSubmitted(score);
    setTimeout(() => setJustSubmitted(null), 1600);
  };

  const withDuration = swarms
    .map((s) => ({ ...s, hours: hoursBetween(s.startedAt, s.resolvedAt) }))
    .sort((a, b) => (a.startedAt < b.startedAt ? 1 : -1));

  const responded = rows.filter((r) => r.n > 0);
  const latest = responded[responded.length - 1];
  const prev = responded[responded.length - 2];
  const delta = latest && prev ? round2(latest.avg - prev.avg) : 0;
  const totalCheckins = sum(rows.map((r) => r.n));
  const sprintMean = avg(responded.map((r) => r.avg));
  const lowDays = responded.filter((r) => r.avg < 3).length;
  const swarmMeanHours = avg(withDuration.map((s) => s.hours));

  const addSwarm = () => {
    if (!draft.storyRef.trim()) return;
    setSwarms((all) => [...all, { ...draft, id: uid('sw'), storyRef: draft.storyRef.trim(), note: draft.note.trim() }]);
    setDraft((d) => ({ ...d, storyRef: '', note: '' }));
  };

  return (
    <div className="space-y-5">
      <PageHead
        title="Team Health Check-in"
        lead="An anonymous read on how the sprint actually feels, next to the swarm log that often explains it. Check-ins are stored as daily counts only — there is no name, initial or identifier attached to a submission anywhere in this model."
      />

      <div className="rounded-lg border border-teal-200 bg-teal-50 px-3 py-2 text-[12px] leading-relaxed text-teal-900">
        <strong>Anonymous by construction.</strong> A submission increments a counter for a day and a score, and nothing
        else is recorded. Because individual responses are never stored, they cannot be filtered, sorted or traced back —
        not by this UI, and not by anything reading the data. On very small teams remember that a single distinctive
        score can still be recognisable in the aggregate, so treat a one-person shift as a prompt for a conversation, not
        a finding.
      </div>

      <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
        <StatCard
          label="Latest daily average"
          value={latest ? round2(latest.avg) : '—'}
          sub={latest ? shortDate(latest.date) + ' · ' + latest.n + ' check-ins' : 'no submissions yet'}
          tone={latest ? (latest.avg >= 3.5 ? 'green' : latest.avg >= 2.75 ? 'amber' : 'red') : 'slate'}
        />
        <StatCard
          label="Movement on the day before"
          value={(delta > 0 ? '+' : delta < 0 ? '−' : '') + Math.abs(delta).toFixed(2)}
          sub={delta > 0 ? 'improving' : delta < 0 ? 'dropping' : 'holding steady'}
          tone={delta > 0.1 ? 'green' : delta < -0.1 ? 'red' : 'slate'}
        />
        <StatCard label="Sprint mean" value={round2(sprintMean)} sub={totalCheckins + ' check-ins over ' + responded.length + ' days'} tone="teal" />
        <StatCard label="Days below 3.0" value={lowDays} sub="worth a look in the retro" tone={lowDays >= 2 ? 'amber' : 'slate'} />
      </div>

      <Card
        className="no-print"
        title="Submit a check-in"
        right={
          <label className="flex items-center gap-2 text-[12px] text-slate-500">
            for
            <input type="date" value={checkinDate} max={TODAY_ISO} onChange={(e) => setCheckinDate(e.target.value)} className={inputCls + ' num'} />
          </label>
        }
      >
        <div className="flex flex-wrap items-center justify-center gap-3 px-3 py-4">
          {MOOD.map((m) => (
            <button
              key={m.score}
              onClick={() => submit(m.score)}
              className={
                'flex w-[104px] flex-col items-center gap-1 rounded-lg border px-2 py-3 transition ' +
                (justSubmitted === m.score
                  ? 'border-teal-500 bg-teal-50 ring-2 ring-teal-200'
                  : 'border-slate-200 bg-white hover:border-teal-400 hover:bg-teal-50/40')
              }
            >
              <span className="text-3xl leading-none">{m.face}</span>
              <span className="text-[12px] font-semibold text-slate-600">{m.label}</span>
              <span className="num text-[11px] text-slate-400">{m.score}</span>
            </button>
          ))}
        </div>
        <div className="border-t border-slate-100 bg-slate-50 px-3 py-2 text-center text-[11px] text-slate-500">
          {justSubmitted
            ? 'Recorded anonymously for ' + shortDate(checkinDate) + '. Nothing about who submitted it was stored.'
            : 'One tap per person. Submissions are counted, never attributed.'}
        </div>
      </Card>

      <Card title="Sentiment trend across the sprint">
        <SentimentChart rows={rows} />
        <div className="overflow-x-auto border-t border-slate-100">
          <table className="w-full min-w-[620px] text-[12px]">
            <thead>
              <tr className="border-b border-slate-100 text-[11px] uppercase tracking-wide text-slate-400">
                <th className="px-3 py-2 text-left font-semibold">Day</th>
                {MOOD.map((m) => (
                  <th key={m.score} className="px-2 py-2 text-center font-semibold" title={m.label}>
                    <span className="text-base">{m.face}</span>
                  </th>
                ))}
                <th className="px-2 py-2 text-right font-semibold">Responses</th>
                <th className="px-3 py-2 text-right font-semibold">Average</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {rows.map((r) => (
                <tr key={r.id} className="hover:bg-slate-50">
                  <td className="px-3 py-1.5 text-slate-600">{shortDate(r.date)}</td>
                  {r.counts.map((c, i) => (
                    <td key={i} className="px-2 py-1.5 text-center">
                      <input
                        type="number" min="0" value={c}
                        onChange={(e) => setSentiment((all) => upd(all, r.id, (d) => ({
                          counts: d.counts.map((v, k) => (k === i ? Math.max(0, Number(e.target.value) || 0) : v)),
                        })))}
                        className={inputCls + ' num w-14 py-0.5 text-center text-[12px]'}
                      />
                    </td>
                  ))}
                  <td className="num px-2 py-1.5 text-right text-slate-500">{r.n}</td>
                  <td className={'num px-3 py-1.5 text-right font-semibold ' + (r.n === 0 ? 'text-slate-300' : r.avg < 3 ? 'text-red-700' : r.avg >= 3.5 ? 'text-emerald-700' : 'text-amber-700')}>
                    {r.n ? round2(r.avg) : '—'}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>

      <Card
        title="Swarm events"
        right={
          <span className="text-[11px] text-slate-400">
            Mean resolution <span className="num font-semibold text-slate-600">{durationLabel(swarmMeanHours || 0)}</span> across {withDuration.length} events
          </span>
        }
      >
        <div className="overflow-x-auto">
          <table className="w-full min-w-[820px] text-[13px]">
            <thead>
              <tr className="border-b border-slate-100 text-[11px] uppercase tracking-wide text-slate-400">
                <th className="px-3 py-2 text-left font-semibold">Story</th>
                <th className="px-2 py-2 text-left font-semibold">What was swarmed</th>
                <th className="px-2 py-2 text-right font-semibold">People</th>
                <th className="px-2 py-2 text-left font-semibold">Started</th>
                <th className="px-2 py-2 text-left font-semibold">Resolved</th>
                <th className="px-2 py-2 text-right font-semibold">Elapsed</th>
                <th className="w-8" />
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {withDuration.length === 0 && <tr><td colSpan="7"><Empty>No swarm events logged.</Empty></td></tr>}
              {withDuration.map((s) => (
                <tr key={s.id} className="group hover:bg-slate-50">
                  <td className="px-3 py-1.5">
                    <span className="num text-[12px] font-semibold text-slate-600">
                      <Editable value={s.storyRef} onChange={(v) => setSwarms((all) => upd(all, s.id, { storyRef: v }))} className="px-1" placeholder="S-000" />
                    </span>
                  </td>
                  <td className="px-2 py-1.5 text-slate-600">
                    <Editable value={s.note} onChange={(v) => setSwarms((all) => upd(all, s.id, { note: v }))} className="px-1" placeholder="what the swarm was about" />
                  </td>
                  <td className="px-2 py-1.5 text-right">
                    <NumField value={s.people} min={1} width="w-16" onChange={(v) => setSwarms((all) => upd(all, s.id, { people: Math.max(1, v) }))} />
                  </td>
                  <td className="px-2 py-1.5">
                    <input type="datetime-local" value={s.startedAt} onChange={(e) => setSwarms((all) => upd(all, s.id, { startedAt: e.target.value }))} className={inputCls + ' num py-0.5 text-[12px]'} />
                  </td>
                  <td className="px-2 py-1.5">
                    <input type="datetime-local" value={s.resolvedAt} onChange={(e) => setSwarms((all) => upd(all, s.id, { resolvedAt: e.target.value }))} className={inputCls + ' num py-0.5 text-[12px]'} />
                  </td>
                  <td className="px-2 py-1.5 text-right">
                    <Chip tone={s.hours <= 0 ? 'slate' : s.hours < 8 ? 'green' : s.hours < 24 ? 'amber' : 'red'}>
                      <span className="num">{s.hours > 0 ? durationLabel(s.hours) : '—'}</span>
                    </Chip>
                  </td>
                  <td className="pr-2 text-right">
                    <span className="opacity-0 transition group-hover:opacity-100">
                      <XBtn onClick={() => setSwarms((all) => rm(all, s.id))} />
                    </span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <div className="no-print flex flex-wrap items-center gap-2 border-t border-slate-100 bg-slate-50 px-3 py-2">
          <input value={draft.storyRef} onChange={(e) => setDraft({ ...draft, storyRef: e.target.value })} placeholder="Story ref, e.g. S-409" className={inputCls + ' num w-32'} />
          <input value={draft.note} onChange={(e) => setDraft({ ...draft, note: e.target.value })} placeholder="What was swarmed" className={inputCls + ' min-w-[180px] flex-1'} />
          <NumField value={draft.people} min={1} width="w-16" onChange={(v) => setDraft({ ...draft, people: Math.max(1, v) })} suffix="people" />
          <input type="datetime-local" value={draft.startedAt} onChange={(e) => setDraft({ ...draft, startedAt: e.target.value })} className={inputCls + ' num'} />
          <input type="datetime-local" value={draft.resolvedAt} onChange={(e) => setDraft({ ...draft, resolvedAt: e.target.value })} className={inputCls + ' num'} />
          <button className={btnPrimary} onClick={addSwarm}>+ Swarm</button>
        </div>
      </Card>

      <FootNote>
        a check-in stores nothing but a date, a score and a count, so the anonymity holds at the data level rather than
        by convention — but the aggregate is only as safe as the group size, and a day with two responses reveals more
        than a day with ten. The daily average is a plain mean of whatever was submitted that day, with no weighting and
        no correction for who did or did not respond, so a quiet day is a small sample rather than a neutral one. Swarm
        events deliberately record a headcount and a story reference and never a roster; elapsed time is wall-clock
        between the two timestamps, so an overnight swarm includes the hours nobody was working.
      </FootNote>
    </div>
  );
}

      </span>
      {!collapsed && (
        <span className="min-w-0">
          <span className="block text-[14px] font-bold leading-tight tracking-tight text-white">Sprint Health</span>
          <span className="block text-[11px] font-medium uppercase tracking-[0.14em] text-teal-400">&amp; Governance</span>
        </span>
      )}
    </div>
  );
}

function Toast({ message }) {
  if (!message) return null;
  return (
    <div className="no-print pointer-events-none fixed bottom-5 left-1/2 z-50 -translate-x-1/2">
      <div className="rounded-lg bg-slate-900 px-4 py-2 text-[13px] font-medium text-white shadow-lg">{message}</div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('retro');
  const [collapsed, setCollapsed] = useState(false);
  const [drawer, setDrawer] = useState(false);
  const [toast, setToast] = useState('');
  const toastTimer = React.useRef(null);
  const fileRef = React.useRef(null);

  /* every tab's state lives here — nothing is persisted, reload resets it all */
  const [retroSprints, setRetroSprints] = useState(SEED_RETRO);
  const [dodCriteria, setDodCriteria] = useState(SEED_DOD_CRITERIA);
  const [dodStories, setDodStories] = useState(SEED_DOD_STORIES);
  const [estSprints, setEstSprints] = useState(SEED_EST_SPRINTS);
  const [estStories, setEstStories] = useState(SEED_EST_STORIES);
  const [evmRows, setEvmRows] = useState(SEED_EVM);
  const [columns, setColumns] = useState(SEED_COLUMNS);
  const [flowStories, setFlowStories] = useState(SEED_FLOW_STORIES);
  const [sprintStart, setSprintStart] = useState(ago(13));
  const [sentiment, setSentiment] = useState(SEED_SENTIMENT);
  const [swarms, setSwarms] = useState(SEED_SWARMS);

  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') setDrawer(false); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const pick = (id) => { setTab(id); setDrawer(false); };
  const current = NAV.find((n) => n.id === tab) || NAV[0];

  const say = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 2600);
  };

  /* ---------- print / backup / restore ---------- */

  /** Everything the six tabs hold, in one serialisable object. */
  const snapshot = () => ({
    app: 'sprint-health-governance-dashboard',
    version: 1,
    exportedAt: new Date().toISOString(),
    activeTab: tab,
    data: {
      retroSprints, dodCriteria, dodStories, estSprints, estStories,
      evmRows, columns, flowStories, sprintStart, sentiment, swarms,
    },
  });

  const doBackup = () => {
    const blob = new Blob([JSON.stringify(snapshot(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sprint-health-backup-' + TODAY_ISO + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    say('Backup downloaded');
  };

  const onRestoreFile = (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (err) { window.alert('That file could not be read as JSON.'); return; }

      const d = parsed && parsed.data ? parsed.data : parsed;
      const looksRight = d && typeof d === 'object' &&
        (Array.isArray(d.retroSprints) || Array.isArray(d.dodStories) || Array.isArray(d.evmRows));
      if (!looksRight) {
        window.alert('That file is not a Sprint Health & Governance backup.');
        return;
      }
      if (!window.confirm('Restore this backup? Everything currently on screen will be replaced.')) return;

      /* Restore each section only if the backup carries a usable value, so an
         older or partial file loads what it can instead of failing outright. */
      let restored = 0;
      const putList = (val, setter) => { if (Array.isArray(val)) { setter(val); restored++; } };
      putList(d.retroSprints, setRetroSprints);
      putList(d.dodCriteria, setDodCriteria);
      putList(d.dodStories, setDodStories);
      putList(d.estSprints, setEstSprints);
      putList(d.estStories, setEstStories);
      putList(d.evmRows, setEvmRows);
      putList(d.columns, setColumns);
      putList(d.flowStories, setFlowStories);
      putList(d.sentiment, setSentiment);
      putList(d.swarms, setSwarms);
      if (typeof d.sprintStart === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d.sprintStart)) {
        setSprintStart(d.sprintStart);
        restored++;
      }
      if (parsed.activeTab && NAV.some((n) => n.id === parsed.activeTab)) setTab(parsed.activeTab);

      say('Backup restored — ' + restored + ' section' + (restored === 1 ? '' : 's'));
    };
    reader.readAsText(f);
  };

  const body = (
    <>
      {tab === 'retro' && <RetrospectiveTab sprints={retroSprints} setSprints={setRetroSprints} />}
      {tab === 'dod' && (
        <DefinitionOfDoneTab
          criteria={dodCriteria} setCriteria={setDodCriteria}
          stories={dodStories} setStories={setDodStories}
        />
      )}
      {tab === 'estimation' && (
        <EstimationAccuracyTab
          sprints={estSprints} setSprints={setEstSprints}
          stories={estStories} setStories={setEstStories}
        />
      )}
      {tab === 'evm' && <HybridEvmTab rows={evmRows} setRows={setEvmRows} />}
      {tab === 'cfd' && (
        <CumulativeFlowTab
          columns={columns} setColumns={setColumns}
          stories={flowStories} setStories={setFlowStories}
          sprintStart={sprintStart} setSprintStart={setSprintStart}
        />
      )}
      {tab === 'health' && (
        <TeamHealthTab sentiment={sentiment} setSentiment={setSentiment} swarms={swarms} setSwarms={setSwarms} />
      )}
    </>
  );

  return (
    <div className="flex min-h-screen bg-slate-100">
      {/* desktop sidebar */}
      <aside
        className={
          'no-print sticky top-0 hidden h-screen shrink-0 flex-col border-r border-slate-800 bg-slate-900 transition-[width] duration-200 lg:flex ' +
          (collapsed ? 'w-[72px]' : 'w-60')
        }
      >
        <Brand collapsed={collapsed} />
        <NavList tab={tab} onPick={pick} collapsed={collapsed} />
        <div className="border-t border-slate-800 px-2 py-2">
          <button
            onClick={() => setCollapsed((v) => !v)}
            className="flex w-full items-center justify-center gap-2 rounded-md px-2 py-1.5 text-[11px] font-medium text-slate-400 hover:bg-slate-800 hover:text-white"
            title={collapsed ? 'Expand the menu' : 'Collapse to icons'}
          >
            <span className="text-[13px] leading-none">{collapsed ? '»' : '«'}</span>
            {!collapsed && <span>Collapse menu</span>}
          </button>
          {!collapsed && (
            <p className="px-2 pb-1 pt-2 text-[10px] leading-relaxed text-slate-600">
              Nothing is saved — a reload restores the samples. Use Backup to keep your work.
            </p>
          )}
        </div>
      </aside>

      {/* mobile drawer */}
      {drawer && (
        <div className="no-print fixed inset-0 z-40 lg:hidden">
          <div className="absolute inset-0 bg-slate-900/50" onClick={() => setDrawer(false)} />
          <aside className="absolute inset-y-0 left-0 flex w-64 flex-col bg-slate-900 shadow-xl">
            <div className="flex items-center justify-between border-b border-slate-800 pr-2">
              <div className="flex-1"><Brand collapsed={false} /></div>
              <button onClick={() => setDrawer(false)} className="rounded p-1.5 text-slate-400 hover:bg-slate-800 hover:text-white" title="Close menu">
                &#10005;
              </button>
            </div>
            <NavList tab={tab} onPick={pick} collapsed={false} />
            <p className="border-t border-slate-800 px-4 py-3 text-[10px] leading-relaxed text-slate-600">
              Nothing is saved — a reload restores the samples. Use Backup to keep your work.
            </p>
          </aside>
        </div>
      )}

      <div className="flex min-w-0 flex-1 flex-col">
        {/* top bar — hamburger and page name on narrow screens, tools on every screen */}
        <header className="no-print sticky top-0 z-30 flex items-center gap-3 border-b border-slate-200 bg-white/95 px-3 py-2.5 backdrop-blur sm:px-4 lg:px-8">
          <button
            onClick={() => setDrawer(true)}
            className="rounded-md border border-slate-300 px-2.5 py-1.5 text-slate-600 hover:bg-slate-50 lg:hidden"
            title="Open the menu"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" className="h-4 w-4">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>

          <div className="min-w-0 lg:hidden">
            <div className="truncate text-[13px] font-semibold text-slate-800">{current.label}</div>
            <div className="truncate text-[11px] text-slate-400">Sprint Health &amp; Governance</div>
          </div>

          <div className="hidden min-w-0 lg:block">
            <div className="truncate text-[12px] font-medium text-slate-500">
              Nothing here is saved to this browser — <span className="text-slate-700">Backup</span> writes a JSON file you can
              restore later or on another machine.
            </div>
          </div>

          <div className="ml-auto flex shrink-0 items-center gap-2">
            <button className={toolBtnCls} onClick={() => window.print()} title="Print the open tab, or save it as a PDF">
              <ToolIcon name="print" /><span className="hidden sm:inline">Print</span>
            </button>
            <button className={toolBtnCls} onClick={doBackup} title="Download every tab's data as a JSON file">
              <ToolIcon name="download" /><span className="hidden sm:inline">Backup</span>
            </button>
            <button className={toolBtnCls} onClick={() => fileRef.current && fileRef.current.click()} title="Replace everything on screen from a backup file">
              <ToolIcon name="upload" /><span className="hidden sm:inline">Restore</span>
            </button>
            <input ref={fileRef} type="file" accept=".json,application/json" onChange={onRestoreFile} className="hidden" />
          </div>
        </header>

        <main className="min-w-0 flex-1 px-4 py-5 sm:px-6 lg:px-8 lg:py-7">
          <div className="mx-auto max-w-[1180px]">
            <div className="print-only mb-5 border-b border-slate-300 pb-2">
              <div className="text-[10px] font-semibold uppercase tracking-[0.14em] text-slate-500">
                Sprint Health &amp; Governance
              </div>
              <div className="text-lg font-bold text-slate-900">{current.label}</div>
              <div className="text-[11px] text-slate-500">Printed {shortDate(TODAY_ISO)}</div>
            </div>
            {body}
          </div>
        </main>
      </div>

      <Toast message={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
