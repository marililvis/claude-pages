/* ==========================================================================
   SPRINT HEALTH & GOVERNANCE DASHBOARD
   Single file, no build step, no persistence — every bit of state lives in

/* ================================ helpers ================================= */

const uid = (p) => p + '-' + Math.random().toString(36).slice(2, 8);
const pad = (n) => String(n).padStart(2, '0');
const toISO = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

const TODAY = new Date();
TODAY.setHours(0, 0, 0, 0);
const TODAY_ISO = toISO(TODAY);

/** ISO date n calendar days before today. */
const ago = (n) => {
  const d = new Date(TODAY);
  d.setDate(d.getDate() - n);
  return toISO(d);
};
/** ISO datetime n days ago at HH:MM. */
const agoAt = (n, hhmm) => ago(n) + 'T' + hhmm;
/**
 * Same as ago(), but stepped back to the nearest weekday. Sample dates are
 * relative to whenever the file is opened, so without this a seeded story
 * could start and finish on a Saturday and read as a zero-day cycle.
 */
const agoWeekday = (n) => {
  const d = new Date(TODAY);
  d.setDate(d.getDate() - n);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() - 1);
  return toISO(d);
};

const parseISO = (s) => {
  const [y, m, d] = String(s).slice(0, 10).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
};
const calDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);

/** Business days from a to b, both ends counted. Mon to Wed = 3. */
const workingDays = (a, b) => {
  const cur = parseISO(a);
  const end = parseISO(b);
  if (end < cur) return 0;
  let n = 0;
  while (cur <= end) {
    const w = cur.getDay();
    if (w !== 0 && w !== 6) n++;
    cur.setDate(cur.getDate() + 1);
  }
  return n;
};

/** Every calendar day from a to b inclusive, as ISO strings. */
const dayRange = (a, b) => {
  const out = [];
  const cur = parseISO(a);
  const end = parseISO(b);
  while (cur <= end) {
    out.push(toISO(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return out;
};

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const shortDate = (iso) => {
  const d = parseISO(iso);
  return d.getDate() + ' ' + MONTHS[d.getMonth()];
};
const shortDateTime = (s) => shortDate(s) + ', ' + (String(s).split('T')[1] || '').slice(0, 5);

const round1 = (n) => Math.round(n * 10) / 10;
const round2 = (n) => Math.round(n * 100) / 100;
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const sum = (a) => a.reduce((s, x) => s + x, 0);
const avg = (a) => (a.length ? sum(a) / a.length : 0);

const upd = (arr, id, patch) =>
  arr.map((x) => (x.id === id ? { ...x, ...(typeof patch === 'function' ? patch(x) : patch) } : x));
const rm = (arr, id) => arr.filter((x) => x.id !== id);

const FIB = [1, 2, 3, 5, 8, 13];

/** Double-click to edit, Enter or blur to save, Escape to cancel. */
function Editable({ value, onChange, className = '', multiline = false, placeholder = 'empty' }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(value);
  useEffect(() => { if (!editing) setDraft(value); }, [value, editing]);

  if (!editing) {
    return (
      <span
        title="Double-click to edit"
        onDoubleClick={() => { setDraft(value); setEditing(true); }}
        className={'cursor-text rounded hover:bg-slate-100 ' + className}
      >
        {value || <span className="italic text-slate-300">{placeholder}</span>}
      </span>
    );
  }
  const commit = () => { onChange(String(draft).trim()); setEditing(false); };
  const key = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); setEditing(false); }
    if (e.key === 'Enter' && (!multiline || e.metaKey || e.ctrlKey)) { e.preventDefault(); commit(); }
  };
  if (multiline) {
    return (
      <textarea
        autoFocus rows={3} value={draft}
        onChange={(e) => setDraft(e.target.value)} onBlur={commit} onKeyDown={key}
        className={inputCls + ' w-full resize-y'}
      />
    );
  }
  return (
    <input
      autoFocus value={draft}
      onChange={(e) => setDraft(e.target.value)} onBlur={commit} onKeyDown={key}
      className={inputCls + ' w-full'}
    />
  );
}

/* ============================== chart atoms =============================== */

const AXIS = '#cbd5e1';

/** Tick values from 0 to at least max, on a 1 / 2 / 2.5 / 5 step. */
function niceTicks(max, count = 5) {
  if (!(max > 0)) return [0, 1];
  const raw = max / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || mag * 10;
  const out = [];
  for (let v = 0; v <= max + step * 0.0001; v += step) out.push(round2(v));
  return out;
}

const STATUS_NEXT = { open: 'in-progress', 'in-progress': 'done', done: 'open' };

/* ---- recurrence matching: deliberately crude keyword overlap, no NLP ---- */

const STOPWORDS = new Set(
  ('the a an and or but for with that this these those from into them they it its of to in on at as we us our you your ' +
   'is are was were be been being do does did done have has had will would should could can may might not no so if then ' +
   'than there here when what which who how any all more most some such only own same too very just now also up out off ' +
   'over under again once each other new one two three next last').split(' ')
);
const KEYWORDS = (text) =>
  Array.from(new Set(
    String(text).toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/)
      .filter((w) => w.length >= 2 && !STOPWORDS.has(w))
  ));

/** Two action items count as "the same issue" when they share >= 2 keywords. */
const overlap = (a, b) => a.filter((w) => b.includes(w));
const SIMILARITY_MIN = 2;

/**
 * Greedy clustering of every action item across every sprint. A cluster is
 * flagged when it spans 2 or more distinct sprints — that is the real signal.
 */
function recurrenceClusters(sprints) {
  const items = [];
  sprints.forEach((sp) => sp.actions.forEach((a) => items.push({ ...a, sprintId: sp.id, sprintName: sp.name, kw: KEYWORDS(a.text) })));

  const clusters = [];
  items.forEach((item) => {
    let best = null;
    let bestShared = [];
    clusters.forEach((c) => {
      c.members.forEach((m) => {
        const shared = overlap(item.kw, m.kw);
        if (shared.length >= SIMILARITY_MIN && shared.length > bestShared.length) {
          best = c;
          bestShared = shared;
        }
      });
    });
    if (best) {
      best.members.push(item);
      best.shared = overlap(best.shared, item.kw).length ? overlap(best.shared, item.kw) : bestShared;
    } else {
      clusters.push({ id: uid('c'), members: [item], shared: item.kw });
    }
  });

  return clusters
    .map((c) => ({
      ...c,
      sprintIds: Array.from(new Set(c.members.map((m) => m.sprintId))),
    }))
    .filter((c) => c.sprintIds.length >= 2)
    .sort((a, b) => b.sprintIds.length - a.sprintIds.length || b.members.length - a.members.length);
}

function RetrospectiveTab({ sprints, setSprints }) {
  const [activeId, setActiveId] = useState(sprints[sprints.length - 1].id);
  const [showRecurrence, setShowRecurrence] = useState(true);
  const sprint = sprints.find((s) => s.id === activeId) || sprints[0];

  const patch = (fn) => setSprints((all) => all.map((s) => (s.id === sprint.id ? fn(s) : s)));
  const editList = (key, fn) => patch((s) => ({ ...s, [key]: fn(s[key]) }));

  const addSprint = () => {
    const n = sprints.length + 22;
    const s = { id: uid('SP'), name: 'Sprint ' + n, wentWell: [], wentWrong: [], actions: [] };
    setSprints((all) => [...all, s]);
    setActiveId(s.id);
  };

  const convert = (wrongItem) => {
    patch((s) => ({
      ...s,
      actions: [...s.actions, { id: uid('a'), text: wrongItem.text, owner: '', status: 'open', votes: wrongItem.votes, fromWrongId: wrongItem.id }],
    }));
  };

  const clusters = useMemo(() => recurrenceClusters(sprints), [sprints]);
  const openRepeats = clusters.filter((c) => c.members.some((m) => m.status !== 'done')).length;
  const allActions = sprints.flatMap((s) => s.actions);
  const doneRate = allActions.length ? Math.round((allActions.filter((a) => a.status === 'done').length / allActions.length) * 100) : 0;

  return (
    <div className="space-y-5">
      <PageHead
        title="Retrospective"
        lead="One board per sprint, with votes to surface what the team actually cares about. Action items are converted straight out of the went-wrong column so they keep their context — and the recurrence view checks whether you are solving them or just rewriting them."

          <>
            <select value={activeId} onChange={(e) => setActiveId(e.target.value)} className={inputCls}>
              {sprints.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            <button className={btnCls} onClick={addSprint}>+ Sprint</button>
          </>
        }
      />

      <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
        <StatCard label="Sprints on record" value={sprints.length} />
        <StatCard label="Action items" value={allActions.length} sub={doneRate + '% marked done'} />
        <StatCard label="Repeat themes" value={clusters.length} sub="seen in 2+ sprints" tone={clusters.length ? 'amber' : 'slate'} />
        <StatCard label="Still unresolved" value={openRepeats} sub="repeat themes with an open action" tone={openRepeats ? 'red' : 'green'} />
      </div>

      <div className="grid grid-cols-1 gap-4 lg:grid-cols-3">
        <RetroColumn
          title="Went well"
          tone="green"
          hint="What should we keep doing?"
          items={sprint.wentWell}
          onAdd={(text) => editList('wentWell', (l) => [...l, it(text, 0)])}
          onVote={(id, d) => editList('wentWell', (l) => upd(l, id, (x) => ({ votes: Math.max(0, x.votes + d) })))}
          onText={(id, v) => editList('wentWell', (l) => upd(l, id, { text: v }))}
          onRemove={(id) => editList('wentWell', (l) => rm(l, id))}
        />

        <RetroColumn
          title="Went wrong"
          tone="red"
          hint="What got in the way?"
          items={sprint.wentWrong}
          onAdd={(text) => editList('wentWrong', (l) => [...l, it(text, 0)])}
          onVote={(id, d) => editList('wentWrong', (l) => upd(l, id, (x) => ({ votes: Math.max(0, x.votes + d) })))}
          onText={(id, v) => editList('wentWrong', (l) => upd(l, id, { text: v }))}
          onRemove={(id) => editList('wentWrong', (l) => rm(l, id))}
          extra={(item) => {
            const converted = sprint.actions.some((a) => a.fromWrongId === item.id);
            return (
              <div className="mt-1.5">
                {converted ? (
                  <Chip tone="teal">&#10003; converted to an action</Chip>
                ) : (
                  <button className={btnCls + ' text-[11px]'} onClick={() => convert(item)}>
                    Convert to action item &rarr;
                  </button>
                )}
              </div>
            );
          }}
        />

        <RetroColumn
          title="Action items"
          tone="teal"
          hint="What will we change, and who owns it?"
          items={sprint.actions}
          onAdd={(text) => editList('actions', (l) => [...l, act(text, '', 'open')])}
          onVote={(id, d) => editList('actions', (l) => upd(l, id, (x) => ({ votes: Math.max(0, x.votes + d) })))}
          onText={(id, v) => editList('actions', (l) => upd(l, id, { text: v }))}
          onRemove={(id) => editList('actions', (l) => rm(l, id))}
          extra={(item) => (
            <div className="mt-1.5 flex flex-wrap items-center gap-2 text-[11px]">
              <span className="text-slate-400">Owner</span>
              <span className="min-w-[70px] font-medium text-slate-700">
                <Editable value={item.owner} onChange={(v) => editList('actions', (l) => upd(l, item.id, { owner: v }))} placeholder="unassigned" className="px-1" />
              </span>
              <Chip
                tone={STATUS_TONE[item.status]}
                title="Click to cycle status"
                onClick={() => editList('actions', (l) => upd(l, item.id, (x) => ({ status: STATUS_NEXT[x.status] })))}
              >
                {item.status}
              </Chip>
            </div>
          )}
        />
      </div>

      <Card
        title="Recurrence view — issues that keep coming back"
        right={<button className={btnCls} onClick={() => setShowRecurrence((v) => !v)}>{showRecurrence ? 'Hide' : 'Show'}</button>}
      >
        {showRecurrence && (
          <div className="divide-y divide-slate-100">
            <p className="px-3 py-2 text-[12px] leading-relaxed text-slate-500">
              Action items across every stored sprint are grouped by shared keywords. A group is flagged when the same
              theme shows up in two or more sprints — a repeat action is usually a signal the underlying cause was
              never addressed, only re-described.
            </p>

            {clusters.length === 0 && <Empty>No theme has repeated across sprints yet.</Empty>}

            {clusters.map((c) => {
              const unresolved = c.members.some((m) => m.status !== 'done');
              return (
                <div key={c.id} className="px-3 py-3">
                  <div className="flex flex-wrap items-center gap-2">
                    <Chip tone={unresolved ? 'red' : 'green'}>
                      {c.sprintIds.length}&#215; across sprints
                    </Chip>
                    {unresolved
                      ? <Chip tone="amber">still open somewhere</Chip>
                      : <Chip tone="green">closed everywhere</Chip>}
                    <span className="text-[11px] text-slate-400">
                      matched on: {c.shared.slice(0, 5).map((w) => '"' + w + '"').join(', ')}
                    </span>
                  </div>
                  <ul className="mt-2 space-y-1.5">
                    {c.members.map((m) => (
                      <li key={m.id} className="flex flex-wrap items-baseline gap-2 text-[13px] text-slate-700">
                        <span className="w-[110px] shrink-0 text-[11px] font-semibold uppercase tracking-wide text-slate-400">
                          {m.sprintName}
                        </span>
                        <span className="min-w-0 flex-1">{m.text}</span>
                        <span className="text-[11px] text-slate-400">{m.owner || 'unassigned'}</span>
                        <Chip tone={STATUS_TONE[m.status]}>{m.status}</Chip>
                      </li>
                    ))}
                  </ul>
                </div>
              );
            })}
          </div>
        )}
      </Card>

      <FootNote>
        recurrence is a plain keyword-overlap match, not language understanding. Two action items are grouped when they
        share at least {SIMILARITY_MIN} significant words after stop-words are stripped, so re-wordings of the same
        problem usually group and unrelated items occasionally will too. Treat a flagged group as a prompt to look, not
        as a verdict. Votes are anonymous counters — nothing records who cast them.
      </FootNote>
    </div>
  );
}

/** checks is keyed by criterion id; a missing key reads as unchecked. */
const dodStory = (id, title, status, checks) => ({ id, title, status, checks });

const SEED_DOD_STORIES = [

  dodStory('S-204', 'Search: fuzzy match on product names', 'Done', { 'c-tests': true, 'c-docs': true, 'c-review': true, 'c-po': false }),
  dodStory('S-205', 'Migrate the session store to Redis', 'Done', { 'c-tests': true, 'c-docs': false, 'c-review': true, 'c-po': false }),

];

const DOD_STATUSES = ['To do', 'In progress', 'Done'];

function DefinitionOfDoneTab({ criteria, setCriteria, stories, setStories }) {
  const [newCriterion, setNewCriterion] = useState('');
  const [newStory, setNewStory] = useState('');

  const addCriterion = () => {
    const label = newCriterion.trim();
    if (!label) return;
    setCriteria((c) => [...c, { id: uid('c'), label }]);
    setNewCriterion('');
  };

  const removeCriterion = (id) => {
    setCriteria((c) => rm(c, id));
    setStories((ss) => ss.map((s) => {
      const checks = { ...s.checks };
      delete checks[id];
      return { ...s, checks };
    }));
  };

  const addStory = () => {
    const title = newStory.trim();
    if (!title) return;
    const nums = stories.map((s) => Number(String(s.id).replace(/\D/g, '')) || 0);
    const next = 'S-' + (Math.max(200, ...nums) + 1);
    setStories((ss) => [...ss, dodStory(next, title, 'To do', {})]);
    setNewStory('');
  };

  const toggle = (storyId, critId) =>
    setStories((ss) => upd(ss, storyId, (s) => ({ checks: { ...s.checks, [critId]: !s.checks[critId] } })));

  const metCount = (s) => criteria.filter((c) => s.checks[c.id]).length;

  const done = stories.filter((s) => s.status === 'Done');
  const full = done.filter((s) => criteria.length > 0 && metCount(s) === criteria.length);
  const partial = done.filter((s) => !(criteria.length > 0 && metCount(s) === criteria.length));
  const fullPct = done.length ? Math.round((full.length / done.length) * 100) : 0;
  const partialPct = done.length ? 100 - fullPct : 0;

  /** Which criterion gets skipped most often on stories already called Done. */
  const skipRanking = criteria
    .map((c) => ({ ...c, skipped: done.filter((s) => !s.checks[c.id]).length }))
    .sort((a, b) => b.skipped - a.skipped);
  const worst = skipRanking[0];

  return (
    <div className="space-y-5">
      <PageHead
        title="Definition of Done"
        lead="The DoD is only worth having if closing a story without it is visible. Configure the criteria, tick them per story, and watch the compliance split — the gap between stories marked Done and stories actually done."
      />

      <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
        <StatCard label="Stories marked Done" value={done.length} sub={'of ' + stories.length + ' tracked'} />
        <StatCard label="Full DoD compliance" value={fullPct + '%'} sub={full.length + ' of ' + done.length + ' closed clean'} tone={fullPct >= 80 ? 'green' : fullPct >= 50 ? 'amber' : 'red'} />
        <StatCard label="Closed with a gap" value={partialPct + '%'} sub={partial.length + ' skipped at least one criterion'} tone={partialPct > 0 ? 'amber' : 'green'} />
        <StatCard label="Most-skipped criterion" value={worst && worst.skipped ? worst.skipped : 0} sub={worst && worst.skipped ? worst.label : 'nothing skipped'} tone={worst && worst.skipped ? 'red' : 'green'} />
      </div>

      <div className="grid grid-cols-1 gap-4 lg:grid-cols-[minmax(0,270px)_minmax(0,1fr)]">
        <Card title="DoD criteria">
          <ul className="divide-y divide-slate-100">
            {criteria.length === 0 && <Empty>No criteria — every story counts as compliant.</Empty>}
            {criteria.map((c) => {
              const skipped = done.filter((s) => !s.checks[c.id]).length;
              return (
                <li key={c.id} className="group flex items-center gap-2 px-3 py-2">
                  <span className="min-w-0 flex-1 text-[13px] text-slate-700">
                    <Editable value={c.label} onChange={(v) => setCriteria((all) => upd(all, c.id, { label: v }))} className="px-1" />
                  </span>
                  <Chip tone={skipped === 0 ? 'green' : skipped > done.length / 3 ? 'red' : 'amber'} title="Done stories that skipped this">
                    {skipped} skipped
                  </Chip>
                  <span className="opacity-0 transition group-hover:opacity-100">
                    <XBtn onClick={() => removeCriterion(c.id)} title="Remove criterion from every story" />
                  </span>
                </li>
              );
            })}
          </ul>
          <div className="no-print flex items-center gap-2 border-t border-slate-100 bg-slate-50 px-3 py-2">
            <input
              value={newCriterion}
              onChange={(e) => setNewCriterion(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && addCriterion()}
              placeholder="e.g. Deployed to staging"
              className={inputCls + ' flex-1'}
            />
            <button className={btnCls} onClick={addCriterion}>Add</button>
          </div>

          <div className="border-t border-slate-100 px-3 py-3">
            <div className="text-[11px] font-semibold uppercase tracking-wide text-slate-400">Compliance split</div>
            <div className="mt-2 flex h-3 overflow-hidden rounded-full bg-slate-100">
              <div className="bg-emerald-500" style={{ width: fullPct + '%' }} title={'Full compliance: ' + fullPct + '%'} />
              <div className="bg-amber-400" style={{ width: partialPct + '%' }} title={'At least one skipped: ' + partialPct + '%'} />
            </div>
            <div className="mt-2 flex justify-between text-[11px] text-slate-500">
              <span><span className="num font-semibold text-emerald-700">{fullPct}%</span> clean</span>
              <span><span className="num font-semibold text-amber-700">{partialPct}%</span> with a gap</span>
            </div>
          </div>
        </Card>

        <Card
          title="Per-story checklist"
          right={<span className="text-[11px] text-slate-400">Double-click a title to edit &middot; click a status to cycle</span>}
        >
          <div className="overflow-x-auto">
            <table className="w-full min-w-[700px] text-[13px]">
              <thead>
                <tr className="border-b border-slate-100 text-[11px] uppercase tracking-wide text-slate-400">
                  <th className="px-3 py-2 text-left font-semibold min-w-[240px]">Story</th>
                  {criteria.map((c) => (
                    <th key={c.id} className="px-2 py-2 text-center font-semibold" title={c.label}>
                      <span className="block max-w-[92px] truncate">{c.label}</span>
                    </th>
                  ))}
                  <th className="px-3 py-2 text-right font-semibold">Status</th>
                  <th className="w-8" />
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {stories.length === 0 && (
                  <tr><td colSpan={criteria.length + 3}><Empty>No stories yet.</Empty></td></tr>
                )}
                {stories.map((s) => {
                  const met = metCount(s);
                  const clean = criteria.length > 0 && met === criteria.length;
                  const flagged = s.status === 'Done' && !clean;
                  return (
                    <tr key={s.id} className={'group ' + (flagged ? 'bg-amber-50/50' : 'hover:bg-slate-50')}>
                      <td className="px-3 py-2">
                        <div className="flex items-baseline gap-2">
                          <span className="num shrink-0 text-[11px] font-semibold text-slate-400">{s.id}</span>
                          <span className="min-w-0 text-slate-700">
                            <Editable value={s.title} onChange={(v) => setStories((all) => upd(all, s.id, { title: v }))} className="px-1" />
                          </span>
                        </div>
                        {flagged && (
                          <div className="mt-1 text-[11px] text-amber-700">
                            closed with {criteria.length - met} criterion{criteria.length - met === 1 ? '' : 's'} skipped
                          </div>
                        )}
                      </td>
                      {criteria.map((c) => (
                        <td key={c.id} className="px-2 py-2 text-center">
                          <input
                            type="checkbox"
                            checked={!!s.checks[c.id]}
                            onChange={() => toggle(s.id, c.id)}
                            className="h-4 w-4 cursor-pointer accent-teal-600"
                          />
                        </td>
                      ))}
                      <td className="px-3 py-2 text-right">
                        <Chip
                          tone={s.status === 'Done' ? (clean ? 'green' : 'amber') : s.status === 'In progress' ? 'teal' : 'slate'}
                          title="Click to cycle status"
                          onClick={() => setStories((all) => upd(all, s.id, (x) => ({ status: DOD_STATUSES[(DOD_STATUSES.indexOf(x.status) + 1) % DOD_STATUSES.length] })))}
                        >
                          {s.status} &middot; <span className="num">{met}/{criteria.length}</span>
                        </Chip>
                      </td>
                      <td className="pr-2 text-right">
                        <span className="opacity-0 transition group-hover:opacity-100">
                          <XBtn onClick={() => setStories((all) => rm(all, s.id))} />
                        </span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div className="no-print flex items-center gap-2 border-t border-slate-100 bg-slate-50 px-3 py-2">
            <input
              value={newStory}
              onChange={(e) => setNewStory(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && addStory()}
              placeholder="New story title"
              className={inputCls + ' flex-1'}
            />
            <button className={btnCls} onClick={addStory}>+ Story</button>
          </div>
        </Card>
      </div>

      <FootNote>
        the compliance percentages count only stories whose status is <strong>Done</strong> — anything still to do or in
        progress is excluded, since an unfinished checklist there is expected rather than a breach. Removing a criterion
        drops it from every story's checklist and recomputes the split immediately, so historical compliance is measured
        against the criteria list as it stands right now, not as it stood when the story closed.
      </FootNote>
    </div>
  );
}

function ScatterChart({ rows, avgRatio, threshold }) {
  const W = 760, H = 330;
  const m = { l: 46, r: 18, t: 16, b: 40 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;

  const maxX = Math.max(14, ...rows.map((r) => r.points)) * 1.05;
  const maxY = Math.max(4, ...rows.map((r) => r.days)) * 1.12;
  const x = (v) => m.l + (v / maxX) * pw;
  const y = (v) => m.t + ph - (v / maxY) * ph;
  const yTicks = niceTicks(maxY, 5);

  return (
    <svg viewBox={'0 0 ' + W + ' ' + H} className="h-[330px] w-full" preserveAspectRatio="xMidYMid meet">
      {yTicks.map((t) => (
        <g key={t}>
          <line x1={m.l} x2={W - m.r} y1={y(t)} y2={y(t)} stroke={GRID} strokeWidth="1" />
          <text x={m.l - 8} y={y(t) + 4} textAnchor="end" fontSize="11" fill={TICK} className="num">{t}</text>
        </g>
      ))}

      {FIB.map((p) => (
        <text key={p} x={x(p)} y={H - 18} textAnchor="middle" fontSize="11" fill={TICK} className="num">{p}</text>
      ))}

      {/* what the average days-per-point ratio predicts */}
      <line x1={x(0)} y1={y(0)} x2={x(maxX)} y2={y(avgRatio * maxX)} stroke="#0d9488" strokeWidth="2" strokeDasharray="6 5" />
      <line x1={x(0)} y1={y(0)} x2={x(maxX)} y2={y(avgRatio * threshold * maxX)} stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="3 4" />

      {rows.map((r) => (
        <circle
          key={r.id}
          cx={x(r.points)} cy={y(r.days)} r={r.flag ? 6 : 4.5}
          fill={r.flag === 'over' ? '#dc2626' : r.flag === 'under' ? '#0891b2' : '#0d9488'}
          fillOpacity={r.flag ? 0.95 : 0.65}
          stroke="#fff" strokeWidth="1.5"
        >
          <title>{r.id + ' — ' + r.title + '\n' + r.points + ' pts, ' + r.days + ' working days (' + round2(r.ratio) + ' d/pt)'}</title>
        </circle>
      ))}

      <line x1={m.l} x2={m.l} y1={m.t} y2={m.t + ph} stroke={AXIS} />
      <line x1={m.l} x2={W - m.r} y1={m.t + ph} y2={m.t + ph} stroke={AXIS} />
      <text x={m.l + pw / 2} y={H - 3} textAnchor="middle" fontSize="11" fill={TICK}>estimated points</text>
      <text x={12} y={m.t + ph / 2} textAnchor="middle" fontSize="11" fill={TICK} transform={'rotate(-90 12 ' + (m.t + ph / 2) + ')'}>
        actual cycle time (working days)
      </text>
    </svg>
  );
}

function VelocityChart({ points }) {
  const W = 760, H = 250;
  const m = { l: 46, r: 18, t: 16, b: 40 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const maxY = Math.max(5, ...points.map((p) => p.value)) * 1.18;
  const yTicks = niceTicks(maxY, 4);
  const step = points.length > 1 ? pw / (points.length - 1) : 0;
  const x = (i) => (points.length === 1 ? m.l + pw / 2 : m.l + i * step);
  const y = (v) => m.t + ph - (v / maxY) * ph;
  const barW = Math.min(46, (pw / Math.max(points.length, 1)) * 0.5);
  const mean = avg(points.map((p) => p.value));

  return (
    <svg viewBox={'0 0 ' + W + ' ' + H} className="h-[250px] w-full" preserveAspectRatio="xMidYMid meet">
      {yTicks.map((t) => (
        <g key={t}>
          <line x1={m.l} x2={W - m.r} y1={y(t)} y2={y(t)} stroke={GRID} strokeWidth="1" />
          <text x={m.l - 8} y={y(t) + 4} textAnchor="end" fontSize="11" fill={TICK} className="num">{t}</text>
        </g>
      ))}

      {points.map((p, i) => (
        <rect key={p.label} x={x(i) - barW / 2} y={y(p.value)} width={barW} height={Math.max(0, m.t + ph - y(p.value))} rx="3" fill="#99f6e4">
          <title>{p.label + ': ' + p.value + ' pts'}</title>
        </rect>
      ))}

      <line x1={m.l} x2={W - m.r} y1={y(mean)} y2={y(mean)} stroke="#94a3b8" strokeWidth="1.5" strokeDasharray="5 4" />
      <text x={W - m.r} y={y(mean) - 6} textAnchor="end" fontSize="10" fill="#94a3b8">
        mean {round1(mean)}
      </text>

      <polyline
        points={points.map((p, i) => x(i) + ',' + y(p.value)).join(' ')}
        fill="none" stroke="#0d9488" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"
      />
      {points.map((p, i) => (
        <g key={p.label}>
          <circle cx={x(i)} cy={y(p.value)} r="4" fill="#0d9488" stroke="#fff" strokeWidth="1.5" />
          <text x={x(i)} y={y(p.value) - 10} textAnchor="middle" fontSize="11" fill="#0f766e" fontWeight="700" className="num">{p.value}</text>
          <text x={x(i)} y={H - 16} textAnchor="middle" fontSize="11" fill={TICK}>{p.label}</text>
        </g>
      ))}

      <line x1={m.l} x2={m.l} y1={m.t} y2={m.t + ph} stroke={AXIS} />
      <line x1={m.l} x2={W - m.r} y1={m.t + ph} y2={m.t + ph} stroke={AXIS} />
    </svg>
  );
}

function EstimationAccuracyTab({ sprints, setSprints, stories, setStories }) {
  const [threshold, setThreshold] = useState(2);
  const [draft, setDraft] = useState({ title: '', sprintId: sprints[sprints.length - 1].id, points: 3, start: ago(5), end: TODAY_ISO });

  const measured = useMemo(
    () => stories.map((s) => {
      const days = workingDays(s.start, s.end);
      return { ...s, days, ratio: s.points > 0 ? days / s.points : 0 };
    }),
    [stories]
  );

  const totalDays = sum(measured.map((r) => r.days));
  const totalPoints = sum(measured.map((r) => r.points));
  const avgRatio = totalPoints > 0 ? totalDays / totalPoints : 0;

  const rows = measured.map((r) => ({
    ...r,
    flag: avgRatio > 0 && r.ratio > avgRatio * threshold ? 'over'
        : avgRatio > 0 && r.ratio < avgRatio / threshold ? 'under'
        : null,
  }));
  const flagged = rows.filter((r) => r.flag);

  const velocity = sprints.map((sp) => ({
    label: sp.name.replace('Sprint ', 'S'),
    value: sum(measured.filter((r) => r.sprintId === sp.id).map((r) => r.points)),
  }));
  const lastTwo = velocity.slice(-2);
  const trend = lastTwo.length === 2 ? lastTwo[1].value - lastTwo[0].value : 0;

  const addStory = () => {
    if (!draft.title.trim()) return;
    const nums = stories.map((s) => Number(String(s.id).replace(/\D/g, '')) || 0);
    setStories((ss) => [...ss, { ...draft, title: draft.title.trim(), id: 'S-' + (Math.max(300, ...nums) + 1) }]);
    setDraft((d) => ({ ...d, title: '' }));
  };

  const addSprint = () => {
    const n = 20 + sprints.length;
    setSprints((all) => [...all, { id: uid('ES'), name: 'Sprint ' + n }]);
  };

  return (
    <div className="space-y-5">
      <PageHead
        title="Estimation Accuracy"
        lead="Estimated points against measured cycle time, story by story. The point of the scatter is not to grade the estimates but to find the stories that behaved nothing like their size — those are where the hidden work lives."
        right={
          <label className="flex items-center gap-2 text-[12px] text-slate-500">
            Outlier threshold
            <NumField value={threshold} step={0.25} min={1.25} width="w-20" onChange={(v) => setThreshold(clamp(v, 1.25, 6))} suffix="&#215; mean" />
          </label>
        }
      />

      <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
        <StatCard label="Stories measured" value={rows.length} sub={totalPoints + ' points, ' + totalDays + ' working days'} />
        <StatCard label="Mean days per point" value={round2(avgRatio)} sub="the ratio every flag is judged against" tone="teal" />
        <StatCard label="Outliers flagged" value={flagged.length} sub={'beyond ' + threshold + '× or under 1/' + threshold + '× the mean'} tone={flagged.length ? 'amber' : 'green'} />
        <StatCard
          label="Velocity, last sprint"
          value={velocity.length ? velocity[velocity.length - 1].value : 0}
          sub={trend === 0 ? 'flat on the sprint before' : (trend > 0 ? '▲ +' : '▼ ') + trend + ' pts on the sprint before'}
          tone={trend >= 0 ? 'green' : 'amber'}
        />
      </div>

      <Card title="Estimated points vs. actual cycle time">
        <Legend items={[
          { color: '#0d9488', label: 'story (within range)' },
          { color: '#dc2626', label: 'took far longer than its size' },
          { color: '#0891b2', label: 'finished far faster than its size' },
        ]} />
        <ScatterChart rows={rows} avgRatio={avgRatio} threshold={threshold} />
        <p className="px-3 pb-3 text-[11px] text-slate-400">
          The teal dashed line is the team's mean days-per-point ratio; the amber line is the outlier threshold at{' '}
          <span className="num">{threshold}&#215;</span> that ratio. Hover a dot for the story.
        </p>
      </Card>

      <Card title="Velocity trend — completed points per sprint" right={<button className={btnCls} onClick={addSprint}>+ Sprint</button>}>
        <VelocityChart points={velocity} />
      </Card>

      {flagged.length > 0 && (
        <Card title={'Flagged stories (' + flagged.length + ')'}>
          <ul className="divide-y divide-slate-100">
            {flagged.sort((a, b) => b.ratio - a.ratio).map((r) => (
              <li key={r.id} className="flex flex-wrap items-baseline gap-x-3 gap-y-1 px-3 py-2 text-[13px]">
                <span className="num shrink-0 text-[11px] font-semibold text-slate-400">{r.id}</span>
                <span className="min-w-0 flex-1 text-slate-700">{r.title}</span>
                <span className="num text-slate-500">{r.points} pts</span>
                <span className="num text-slate-500">{r.days} d</span>
                <Chip tone={r.flag === 'over' ? 'red' : 'teal'}>
                  <span className="num">{round2(r.ratio)}</span> d/pt &middot; {round1(r.ratio / avgRatio)}&#215; mean
                </Chip>
                <span className="w-full text-[11px] text-slate-400 sm:w-auto">
                  {r.flag === 'over'
                    ? 'took much longer than the estimate implies — look for a hidden dependency, a wait state, or a story that should have been split'
                    : 'closed far faster than the estimate implies — likely over-sized at refinement'}
                </span>

            ))}

        </Card>

      <Card title="Stories" right={<span className="text-[11px] text-slate-400">Double-click a title &middot; edit points and dates inline</span>}>
        <div className="overflow-x-auto">

            </thead>
            <tbody className="divide-y divide-slate-100">

                      <span className="min-w-0 text-slate-700">

                      </span>
                    </div>
                  </td>
                  <td className="px-2 py-1.5">
                    <select
                      value={r.sprintId}
                      onChange={(e) => setStories((all) => upd(all, r.id, { sprintId: e.target.value }))}
                      className={inputCls + ' py-0.5 text-[12px]'}
                    >
                      {sprints.map((sp) => <option key={sp.id} value={sp.id}>{sp.name}</option>)}

                  </td>
                  <td className="px-2 py-1.5 text-right">

        </div>

        <div className="no-print flex flex-wrap items-center gap-2 border-t border-slate-100 bg-slate-50 px-3 py-2">
          <input
            value={draft.title}
            onChange={(e) => setDraft({ ...draft, title: e.target.value })}
            onKeyDown={(e) => e.key === 'Enter' && addStory()}

          <select value={draft.points} onChange={(e) => setDraft({ ...draft, points: Number(e.target.value) })} className={inputCls + ' num'}>

  { id: 'EV-25', name: 'Sprint 25', pv: 35000, ev: 31500, ac: 35900 },
];

const indexTone = (v) => (!isFinite(v) || v <= 0 ? 'slate' : v < 0.9 ? 'red' : v <= 1.0 ? 'amber' : 'green');
const INDEX_COLOR = { red: '#dc2626', amber: '#f59e0b', green: '#059669', slate: '#94a3b8' };

const money = (n) => n.toLocaleString('en-US', { maximumFractionDigits: 0 });

function EvmLineChart({ rows }) {
  const W = 780, H = 300;
  const m = { l: 62, r: 18, t: 18, b: 40 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const maxY = Math.max(1, ...rows.flatMap((r) => [r.pv, r.ev, r.ac])) * 1.12;
  const yTicks = niceTicks(maxY, 5);
  const step = rows.length > 1 ? pw / (rows.length - 1) : 0;
  const x = (i) => (rows.length === 1 ? m.l + pw / 2 : m.l + i * step);
  const y = (v) => m.t + ph - (v / maxY) * ph;

  const series = [
    { key: 'pv', label: 'Planned value (PV)', color: '#94a3b8', dash: '6 5' },
    { key: 'ev', label: 'Earned value (EV)', color: '#0d9488', dash: null },
    { key: 'ac', label: 'Actual cost (AC)', color: '#f59e0b', dash: null },
  ];

  return (
    <svg viewBox={'0 0 ' + W + ' ' + H} className="h-[300px] w-full" preserveAspectRatio="xMidYMid meet">
      {yTicks.map((t) => (
        <g key={t}>
          <line x1={m.l} x2={W - m.r} y1={y(t)} y2={y(t)} stroke={GRID} strokeWidth="1" />
          <text x={m.l - 8} y={y(t) + 4} textAnchor="end" fontSize="11" fill={TICK} className="num">{money(t)}</text>
        </g>
      ))}

      {series.map((s) => (
        <g key={s.key}>
          <polyline
            points={rows.map((r, i) => x(i) + ',' + y(r[s.key])).join(' ')}
            fill="none" stroke={s.color} strokeWidth={s.key === 'pv' ? 2 : 2.5}
            strokeDasharray={s.dash || undefined} strokeLinejoin="round" strokeLinecap="round"
          />
          {rows.map((r, i) => (
            <circle key={r.id} cx={x(i)} cy={y(r[s.key])} r="3.6" fill={s.color} stroke="#fff" strokeWidth="1.5">
              <title>{r.name + ' — ' + s.label + ': ' + money(r[s.key])}</title>
            </circle>
          ))}
        </g>
      ))}

      {rows.map((r, i) => (
        <text key={r.id} x={x(i)} y={H - 16} textAnchor="middle" fontSize="11" fill={TICK}>
          {r.name.replace('Sprint ', 'S')}
        </text>
      ))}

      <line x1={m.l} x2={m.l} y1={m.t} y2={m.t + ph} stroke={AXIS} />
      <line x1={m.l} x2={W - m.r} y1={m.t + ph} y2={m.t + ph} stroke={AXIS} />
    </svg>
  );
}

/** Semicircular gauge, 0 to 1.5, banded red / amber / green. */
function IndexGauge({ label, value, caption }) {
  const W = 230, H = 150;
  const cx = W / 2, cy = 120, r = 88;
  const MAX = 1.5;
  const polar = (radius, deg) => {
    const a = ((deg - 180) * Math.PI) / 180;
    return [cx + radius * Math.cos(a), cy + radius * Math.sin(a)];
  };
  const arc = (radius, d0, d1) => {
    const [x0, y0] = polar(radius, d0);
    const [x1, y1] = polar(radius, d1);
    return 'M ' + x0 + ' ' + y0 + ' A ' + radius + ' ' + radius + ' 0 ' + (d1 - d0 > 180 ? 1 : 0) + ' 1 ' + x1 + ' ' + y1;
  };
  const deg = (v) => (clamp(v, 0, MAX) / MAX) * 180;

  const ok = isFinite(value) && value > 0;
  const tone = indexTone(value);
  const [nx, ny] = polar(r - 14, deg(ok ? value : 0));

  return (
    <div className="flex flex-col items-center px-2 py-3">
      <svg viewBox={'0 0 ' + W + ' ' + H} className="h-[150px] w-full max-w-[230px]">
        <path d={arc(r, 0, deg(0.9))} stroke="#fecaca" strokeWidth="16" fill="none" strokeLinecap="butt" />
        <path d={arc(r, deg(0.9), deg(1.0))} stroke="#fde68a" strokeWidth="16" fill="none" strokeLinecap="butt" />
        <path d={arc(r, deg(1.0), 180)} stroke="#a7f3d0" strokeWidth="16" fill="none" strokeLinecap="butt" />

        <line x1={cx} y1={cy} x2={nx} y2={ny} stroke={INDEX_COLOR[tone]} strokeWidth="3.5" strokeLinecap="round" />
        <circle cx={cx} cy={cy} r="5" fill={INDEX_COLOR[tone]} />

        <text x={polar(r + 14, 0)[0] + 6} y={cy + 4} textAnchor="start" fontSize="10" fill={TICK} className="num">0</text>
        <text x={polar(r + 14, 180)[0] - 6} y={cy + 4} textAnchor="end" fontSize="10" fill={TICK} className="num">1.5</text>
        <text x={cx} y={cy - 26} textAnchor="middle" fontSize="34" fontWeight="700" fill={INDEX_COLOR[tone]} className="num">
          {ok ? value.toFixed(2) : '—'}
        </text>
      </svg>
      <div className="text-[13px] font-semibold uppercase tracking-wide text-slate-600">{label}</div>
      <div className="mt-0.5 text-center text-[11px] leading-snug text-slate-400">{caption}</div>
      <div className="mt-1.5">
        <Chip tone={tone}>
          {!ok ? 'no data' : value < 0.9 ? 'off track' : value <= 1.0 ? 'watch' : 'on or ahead of plan'}
        </Chip>
      </div>
    </div>
  );
}

  const withIdx = rows.map((r) => ({
    ...r,
    cpi: r.ac > 0 ? r.ev / r.ac : 0,
    spi: r.pv > 0 ? r.ev / r.pv : 0,
    cv: r.ev - r.ac,
    sv: r.ev - r.pv,
  }));
  const sel = withIdx.find((r) => r.id === (selected && selected.id)) || withIdx[withIdx.length - 1];

  const totals = {
    pv: sum(rows.map((r) => r.pv)),
    ev: sum(rows.map((r) => r.ev)),
    ac: sum(rows.map((r) => r.ac)),
  };
  const cumCpi = totals.ac > 0 ? totals.ev / totals.ac : 0;
  const cumSpi = totals.pv > 0 ? totals.ev / totals.pv : 0;

  const addSprint = () => {
    const n = 20 + rows.length;

        PV, EV and AC come from your own budget and progress reporting, in whatever currency unit you use consistently.
        Story points measure relative effort, not money, and converting between them silently would make the indices
        look authoritative while meaning nothing.
      </div>

      <div className="grid grid-cols-1 gap-4 lg:grid-cols-[minmax(0,1fr)_minmax(0,300px)]">
        <Card title={'PV / EV / AC across ' + rows.length + ' sprints'}>
          <Legend items={[
            { color: '#94a3b8', label: 'Planned value (PV)' },
            { color: '#0d9488', label: 'Earned value (EV)' },

          ]} />
          <EvmLineChart rows={rows} />

        <Card title={sel ? sel.name + ' — indices' : 'Indices'}>
          <div className="divide-y divide-slate-100">
            <IndexGauge label="CPI" value={sel ? sel.cpi : 0} caption="EV ÷ AC — cost efficiency. Below 1.0 means you are spending more than you are earning." />
            <IndexGauge label="SPI" value={sel ? sel.spi : 0} caption="EV ÷ PV — schedule efficiency. Below 1.0 means less was earned than planned." />
          </div>
          <div className="border-t border-slate-100 bg-slate-50 px-3 py-2 text-[11px] text-slate-500">
            <div className="flex justify-between"><span>Cost variance (EV − AC)</span><span className={'num font-semibold ' + (sel && sel.cv >= 0 ? 'text-emerald-700' : 'text-red-700')}>{sel ? (sel.cv >= 0 ? '+' : '−') + money(Math.abs(sel.cv)) : '—'}</span></div>

                <th className="px-2 py-2 text-right font-semibold">Actual cost</th>
                <th className="px-2 py-2 text-right font-semibold">CPI</th>
                <th className="px-2 py-2 text-right font-semibold">SPI</th>
                <th className="w-8" />
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {withIdx.map((r) => (
                <tr
                  key={r.id}
                  onClick={() => setSelectedId(r.id)}
                  className={'group cursor-pointer ' + (sel && r.id === sel.id ? 'bg-teal-50/60' : 'hover:bg-slate-50')}
                >
                  <td className="px-3 py-1.5 font-medium text-slate-700">
                    <Editable value={r.name} onChange={(v) => setRows((all) => upd(all, r.id, { name: v }))} className="px-1" />
                  </td>
                  <td className="px-2 py-1.5 text-right"><NumField value={r.pv} step={500} min={0} width="w-28" onChange={(v) => setRows((all) => upd(all, r.id, { pv: v }))} /></td>
                  <td className="px-2 py-1.5 text-right"><NumField value={r.ev} step={500} min={0} width="w-28" onChange={(v) => setRows((all) => upd(all, r.id, { ev: v }))} /></td>
                  <td className="px-2 py-1.5 text-right"><NumField value={r.ac} step={500} min={0} width="w-28" onChange={(v) => setRows((all) => upd(all, r.id, { ac: v }))} /></td>
                  <td className="px-2 py-1.5 text-right">
                    <Chip tone={indexTone(r.cpi)}><span className="num">{r.ac > 0 ? r.cpi.toFixed(2) : '—'}</span></Chip>
                  </td>
                  <td className="px-2 py-1.5 text-right">
                    <Chip tone={indexTone(r.spi)}><span className="num">{r.pv > 0 ? r.spi.toFixed(2) : '—'}</span></Chip>
                  </td>
                  <td className="pr-2 text-right">
                    <span className="opacity-0 transition group-hover:opacity-100">
                      <XBtn onClick={(e) => { e.stopPropagation(); setRows((all) => rm(all, r.id)); }} />
                    </span>
                  </td>
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr className="border-t border-slate-200 bg-slate-50 text-[12px] font-semibold text-slate-600">
                <td className="px-3 py-2">Total</td>
                <td className="num px-2 py-2 text-right">{money(totals.pv)}</td>
                <td className="num px-2 py-2 text-right">{money(totals.ev)}</td>
                <td className="num px-2 py-2 text-right">{money(totals.ac)}</td>
                <td className="num px-2 py-2 text-right">{round2(cumCpi)}</td>
                <td className="num px-2 py-2 text-right">{round2(cumSpi)}</td>
                <td />
              </tr>
            </tfoot>
          </table>
        </div>
      </Card>

      <FootNote>
        PV, EV and AC are entered by hand and are never inferred from story points, velocity or the boards on the other
        tabs. Only CPI (EV ÷ AC) and SPI (EV ÷ PV) are calculated, per sprint and cumulatively; a sprint with a zero
        denominator shows a dash rather than a misleading index. The gauge bands follow the common convention — red below
        0.90, amber from 0.90 to 1.00, green above 1.00 — and the gauge itself is clipped at 1.5 for readability, so an
        exceptional index still parks the needle at the far right.
      </FootNote>
    </div>
  );
}

/* ==========================================================================
   TAB 5 — CUMULATIVE FLOW / BOTTLENECK FINDER
   The board's column history, sampled per day into a CFD, plus the Theory of
   Constraints question: which column is the work actually waiting in?
   ========================================================================== */

const SEED_COLUMNS = [
  { id: 'todo', name: 'To Do' },
  { id: 'inprog', name: 'In Progress' },
  { id: 'review', name: 'Review' },
  { id: 'done', name: 'Done' },
];

/** entries: [[columnId, daysAgo], ...] oldest first. */
const flow = (id, title, entries) => {
  const history = entries.map(([columnId, d]) => ({ columnId, at: ago(d) }));
  const last = history[history.length - 1];
  return { id, title, history, columnId: last.columnId, enteredColumnAt: last.at };
};

const SEED_FLOW_STORIES = [
  flow('S-401', 'Checkout: apply promo code at the payment step', [['todo', 13], ['inprog', 11], ['review', 9], ['done', 3]]),
  flow('S-402', 'Invoice PDF layout for EU VAT', [['todo', 13], ['inprog', 10], ['review', 7], ['done', 2]]),
  flow('S-403', 'Dark mode for the settings screen', [['todo', 13], ['inprog', 10], ['review', 7]]),
  flow('S-404', 'Bulk refund tooling for support agents', [['todo', 13], ['inprog', 8]]),
  flow('S-405', 'Rate-limit the public API', [['todo', 13], ['inprog', 12], ['review', 10], ['done', 8]]),
  flow('S-406', 'Password reset email throttling', [['todo', 13], ['inprog', 12], ['review', 11], ['done', 9]]),
  flow('S-407', 'Search: fuzzy match on product names', [['todo', 12], ['inprog', 8], ['review', 5]]),
  flow('S-408', 'Wishlist sharing links', [['todo', 12], ['inprog', 7], ['review', 3]]),
  flow('S-409', 'Order history pagination', [['todo', 11], ['inprog', 9], ['review', 6], ['done', 1]]),
  flow('S-410', 'Accessibility pass on the main navigation', [['todo', 11], ['inprog', 5]]),
  flow('S-411', 'Session timeout warning modal', [['todo', 10], ['inprog', 5], ['review', 2]]),
  flow('S-412', 'Migrate the session store to Redis', [['todo', 9], ['inprog', 3]]),
  flow('S-413', 'Customer address book CRUD', [['todo', 7]]),
  flow('S-414', 'Email template localisation (RO / EN)', [['todo', 5]]),
  flow('S-415', 'Fix broken breadcrumb on category pages', [['todo', 3]]),
];

const FLOW_PALETTE = ['#cbd5e1', '#7dd3fc', '#fcd34d', '#5eead4', '#c4b5fd', '#fda4af', '#a3e635', '#fdba74'];
const colColor = (i) => FLOW_PALETTE[i % FLOW_PALETTE.length];

/** Which column a story sat in on a given day, or null if it had not started. */
const columnOnDay = (story, dayISO) => {
  let col = null;
  story.history.forEach((h) => { if (h.at <= dayISO) col = h.columnId; });
  return col;
};

function CfdChart({ days, columns, counts }) {
  const W = 820, H = 320;
  const m = { l: 40, r: 16, t: 16, b: 40 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const maxY = Math.max(1, ...days.map((_, i) => sum(columns.map((c) => counts[c.id][i])))) * 1.1;
  const yTicks = niceTicks(maxY, 5);
  const step = days.length > 1 ? pw / (days.length - 1) : 0;
  const x = (i) => (days.length === 1 ? m.l + pw / 2 : m.l + i * step);
  const y = (v) => m.t + ph - (v / maxY) * ph;

  // stacked bottom-up: last column (usually Done) sits at the bottom
  const stackOrder = [...columns].reverse();
  const lower = days.map(() => 0);
  const bands = stackOrder.map((c) => {
    const top = days.map((_, i) => lower[i] + counts[c.id][i]);
    const band = { col: c, lower: [...lower], upper: top };
    top.forEach((v, i) => { lower[i] = v; });
    return band;
  });

  const labelEvery = Math.max(1, Math.ceil(days.length / 8));

  return (
    <svg viewBox={'0 0 ' + W + ' ' + H} className="h-[320px] w-full" preserveAspectRatio="xMidYMid meet">
      {yTicks.map((t) => (
        <g key={t}>
          <line x1={m.l} x2={W - m.r} y1={y(t)} y2={y(t)} stroke={GRID} strokeWidth="1" />
          <text x={m.l - 8} y={y(t) + 4} textAnchor="end" fontSize="11" fill={TICK} className="num">{t}</text>
        </g>
      ))}

      {bands.map((b) => {
        const idx = columns.findIndex((c) => c.id === b.col.id);
        const top = b.upper.map((v, i) => x(i) + ',' + y(v)).join(' ');
        const bottom = b.lower.map((v, i) => x(i) + ',' + y(v)).reverse().join(' ');
        return (
          <polygon key={b.col.id} points={top + ' ' + bottom} fill={colColor(idx)} fillOpacity="0.9" stroke="#fff" strokeWidth="0.6">
            <title>{b.col.name}</title>
          </polygon>
        );
      })}

      {days.map((d, i) => (i % labelEvery === 0 || i === days.length - 1 ? (
        <text key={d} x={x(i)} y={H - 16} textAnchor="middle" fontSize="10" fill={TICK}>{shortDate(d)}</text>
      ) : null))}

      <line x1={m.l} x2={m.l} y1={m.t} y2={m.t + ph} stroke={AXIS} />
      <line x1={m.l} x2={W - m.r} y1={m.t + ph} y2={m.t + ph} stroke={AXIS} />
      <text x={12} y={m.t + ph / 2} textAnchor="middle" fontSize="11" fill={TICK} transform={'rotate(-90 12 ' + (m.t + ph / 2) + ')'}>
        stories
      </text>
    </svg>
  );
}

function CumulativeFlowTab({ columns, setColumns, stories, setStories, sprintStart, setSprintStart }) {
  const [newCol, setNewCol] = useState('');
  const [newStory, setNewStory] = useState('');

  const days = useMemo(() => dayRange(sprintStart, TODAY_ISO), [sprintStart]);

  /** counts[columnId][dayIndex] — derived purely from the entered-column dates. */
  const counts = useMemo(() => {
    const out = {};
    columns.forEach((c) => { out[c.id] = days.map(() => 0); });
    days.forEach((d, i) => {
      stories.forEach((s) => {
        const col = columnOnDay(s, d);
        if (col && out[col]) out[col][i] += 1;
      });
    });
    return out;
  }, [columns, stories, days]);

  /** Average dwell per column, in calendar days. Open spells count up to today. */
  const dwell = useMemo(() => {
    const acc = {};
    columns.forEach((c) => { acc[c.id] = { total: 0, samples: 0, open: 0 }; });
    stories.forEach((s) => {
      s.history.forEach((h, i) => {
        const exit = s.history[i + 1] ? s.history[i + 1].at : TODAY_ISO;
        if (!acc[h.columnId]) return;
        acc[h.columnId].total += Math.max(0, calDays(h.at, exit));
        acc[h.columnId].samples += 1;
        if (!s.history[i + 1]) acc[h.columnId].open += 1;
      });
    });
    return columns.map((c) => ({
      ...c,
      avg: acc[c.id].samples ? acc[c.id].total / acc[c.id].samples : 0,
      samples: acc[c.id].samples,
      open: acc[c.id].open,
      wip: stories.filter((s) => s.columnId === c.id).length,
    }));
  }, [columns, stories]);

  /**
   * Only the columns doing work can be the constraint. The last column is
   * terminal — time in Done is finished work, not a queue — and the first is
   * the intake queue, where dwell measures backlog age rather than a process
   * that cannot keep up. On a board too short for that, fall back to
   * everything except the terminal column.
   */
  const active = dwell.slice(1, -1);
  const candidates = active.length ? active : dwell.slice(0, Math.max(1, dwell.length - 1));
  const excludedIds = dwell.filter((c) => !candidates.some((x) => x.id === c.id)).map((c) => c.id);
  const constraint = candidates.reduce((best, c) => (!best || c.avg > best.avg ? c : best), null);
  const secondWorst = candidates.filter((c) => !constraint || c.id !== constraint.id)
    .reduce((best, c) => (!best || c.avg > best.avg ? c : best), null);

  const throughput = stories.filter((s) => s.columnId === columns[columns.length - 1].id).length;
  const totalWip = stories.length - throughput;

  const moveStory = (storyId, columnId) =>
    setStories((all) => upd(all, storyId, (s) => (
      s.columnId === columnId ? s : {
        columnId,
        enteredColumnAt: TODAY_ISO,
        history: [...s.history, { columnId, at: TODAY_ISO }],
      }
    )));

  /** Editing the entered date rewrites the last history entry — that is the same fact. */
  const setEnteredAt = (storyId, at) =>
    setStories((all) => upd(all, storyId, (s) => {
      const history = s.history.slice();
      history[history.length - 1] = { ...history[history.length - 1], at };
      return { enteredColumnAt: at, history };
    }));

  const addColumn = () => {
    const name = newCol.trim();
    if (!name) return;
    const col = { id: uid('col'), name };
    setColumns((all) => [...all.slice(0, -1), col, all[all.length - 1]]);
    setNewCol('');
  };

  const removeColumn = (id) => {
    if (columns.length <= 2) return;
    const remaining = columns.filter((c) => c.id !== id);
    setColumns(remaining);
    setStories((all) => all.map((s) => {
      const history = s.history.filter((h) => h.columnId !== id);
      const safe = history.length ? history : [{ columnId: remaining[0].id, at: s.history[0].at }];
      const last = safe[safe.length - 1];
      return { ...s, history: safe, columnId: last.columnId, enteredColumnAt: last.at };
    }));
  };

  const addStory = () => {
    const title = newStory.trim();
    if (!title) return;
    const nums = stories.map((s) => Number(String(s.id).replace(/\D/g, '')) || 0);
    const id = 'S-' + (Math.max(400, ...nums) + 1);
    setStories((all) => [...all, {
      id, title,
      columnId: columns[0].id,
      enteredColumnAt: TODAY_ISO,
      history: [{ columnId: columns[0].id, at: TODAY_ISO }],
    }]);
    setNewStory('');
  };

  return (
    <div className="space-y-5">
      <PageHead
        title="Cumulative Flow / Bottleneck Finder"
        lead="A cumulative flow diagram built from each story's column history, and the constraint that follows from it. A widening band is work arriving faster than it leaves — that column, not the busiest person, is what sets the team's pace."
        right={
          <label className="flex items-center gap-2 text-[12px] text-slate-500">
            Sprint start
            <input type="date" value={sprintStart} max={TODAY_ISO} onChange={(e) => setSprintStart(e.target.value)} className={inputCls + ' num'} />
          </label>
        }
      />

      <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
        <StatCard label="Stories on the board" value={stories.length} sub={days.length + ' days sampled'} />
        <StatCard label="Work in progress" value={totalWip} sub={'not yet in ' + columns[columns.length - 1].name} />
        <StatCard label="Completed" value={throughput} sub={'in ' + columns[columns.length - 1].name} tone="green" />
        <StatCard
          label="Current constraint"
          value={constraint ? constraint.name : '—'}
          sub={constraint ? round1(constraint.avg) + ' days average dwell' : 'no data'}
          tone="red"
        />
      </div>

      <Card title="Cumulative flow diagram">
        <Legend items={columns.map((c, i) => ({ color: colColor(i), label: c.name }))} />
        <CfdChart days={days} columns={columns} counts={counts} />
        <p className="px-3 pb-3 text-[11px] text-slate-400">
          Bands are stacked with {columns[columns.length - 1].name} at the bottom. The vertical thickness of a band on any
          given day is the number of stories sitting in that column; a band that keeps widening left to right is filling
          faster than it drains.
        </p>
      </Card>

      <div className="grid grid-cols-1 gap-4 lg:grid-cols-[minmax(0,1fr)_minmax(0,340px)]">
        <Card title="Dwell time by column">
          <ul className="divide-y divide-slate-100">
            {dwell.map((c, i) => {
              const isConstraint = constraint && c.id === constraint.id;
              const maxAvg = Math.max(1, ...dwell.map((d) => d.avg));
              const terminal = i === dwell.length - 1;
              return (
                <li key={c.id} className={'group px-3 py-2.5 ' + (isConstraint ? 'bg-red-50/50' : '')}>
                  <div className="flex flex-wrap items-center gap-2">
                    <span className="inline-block h-3 w-3 shrink-0 rounded-sm" style={{ background: colColor(i) }} />
                    <span className="min-w-0 flex-1 text-[13px] font-medium text-slate-700">
                      <Editable value={c.name} onChange={(v) => setColumns((all) => upd(all, c.id, { name: v }))} className="px-1" />
                    </span>
                    {isConstraint && <Chip tone="red">constraint</Chip>}
                    {excludedIds.indexOf(c.id) !== -1 && (
                      <Chip tone="slate" title={terminal ? 'Finished work, not a queue' : 'Intake queue — dwell here is backlog age'}>
                        {terminal ? 'terminal' : 'intake'} &middot; not scanned
                      </Chip>
                    )}
                    <span className="num text-[13px] font-semibold text-slate-700">{round1(c.avg)} d</span>
                    <span className="opacity-0 transition group-hover:opacity-100">
                      <XBtn onClick={() => removeColumn(c.id)} title="Remove column" />
                    </span>
                  </div>
                  <div className="mt-1.5 h-2 overflow-hidden rounded-full bg-slate-100">
                    <div
                      className="h-full rounded-full"
                      style={{ width: Math.round((c.avg / maxAvg) * 100) + '%', background: isConstraint ? '#dc2626' : colColor(i) }}
                    />
                  </div>
                  <div className="mt-1 text-[11px] text-slate-400">
                    <span className="num">{c.wip}</span> here now &middot; <span className="num">{c.samples}</span> visit
                    {c.samples === 1 ? '' : 's'} recorded, <span className="num">{c.open}</span> still open
                  </div>
                </li>
              );
            })}
          </ul>
          <div className="no-print flex items-center gap-2 border-t border-slate-100 bg-slate-50 px-3 py-2">
            <input
              value={newCol}
              onChange={(e) => setNewCol(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && addColumn()}
              placeholder="New column, e.g. Ready for QA"
              className={inputCls + ' flex-1'}
            />
            <button className={btnCls} onClick={addColumn}>Add column</button>
          </div>
        </Card>

        <Card title="Theory of constraints read">
          {constraint ? (
            <div className="space-y-3 px-3 py-3 text-[13px] leading-relaxed text-slate-600">
              <div className="rounded-lg border border-red-200 bg-red-50 px-3 py-2">
                <div className="text-[11px] font-semibold uppercase tracking-wide text-red-600">Current constraint</div>
                <div className="mt-0.5 text-lg font-bold text-red-700">{constraint.name}</div>
                <div className="num mt-0.5 text-[12px] text-red-600">
                  {round1(constraint.avg)} days average dwell &middot; {constraint.wip} stories sitting there now
                </div>
              </div>
              <p>
                Work spends longer in <strong>{constraint.name}</strong> than in any other active column
                {secondWorst && secondWorst.avg > 0 && (
                  <> — <span className="num">{round1(constraint.avg / Math.max(secondWorst.avg, 0.1))}&#215;</span> the dwell of {secondWorst.name}, the next slowest</>
                )}
                . Until that changes, speeding up any other column just grows the queue in front of this one.
              </p>
              <ul className="list-disc space-y-1 pl-4 text-[12px]">
                <li>Cap WIP <em>upstream</em> of {constraint.name} rather than adding more work to it.</li>
                <li>Ask what {constraint.name} is waiting on — people, an environment, or an approval.</li>
                <li>Swarm the oldest item in {constraint.name} before pulling anything new.</li>
              </ul>
              <p className="text-[11px] text-slate-400">
                Only working columns are scanned. {columns[columns.length - 1].name} is terminal — time there is completed
                work — and {columns[0].name} is the intake queue, where a long dwell means the backlog is ageing rather
                than that a stage cannot keep up.
              </p>
            </div>
          ) : (
            <Empty>Not enough column history to name a constraint.</Empty>
          )}
        </Card>
      </div>

      <Card title="Board" right={<span className="text-[11px] text-slate-400">Move a story to stamp today's date onto its history</span>}>
        <div className="overflow-x-auto">
          <table className="w-full min-w-[720px] text-[13px]">
            <thead>
              <tr className="border-b border-slate-100 text-[11px] uppercase tracking-wide text-slate-400">
                <th className="px-3 py-2 text-left font-semibold">Story</th>
                <th className="px-2 py-2 text-left font-semibold">Column</th>
                <th className="px-2 py-2 text-left font-semibold">Entered column at</th>
                <th className="px-2 py-2 text-right font-semibold">Days here</th>
                <th className="px-2 py-2 text-left font-semibold">Path</th>
                <th className="w-8" />
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {stories.map((s) => {
                const here = calDays(s.enteredColumnAt, TODAY_ISO);
                const isTerminal = s.columnId === columns[columns.length - 1].id;
                const stuck = !isTerminal && constraint && s.columnId === constraint.id && here >= Math.ceil(constraint.avg);
                return (
                  <tr key={s.id} className={'group ' + (stuck ? 'bg-red-50/40' : 'hover:bg-slate-50')}>
                    <td className="px-3 py-1.5">
                      <div className="flex items-baseline gap-2">
                        <span className="num shrink-0 text-[11px] font-semibold text-slate-400">{s.id}</span>
                        <span className="min-w-0 text-slate-700">
                          <Editable value={s.title} onChange={(v) => setStories((all) => upd(all, s.id, { title: v }))} className="px-1" />
                        </span>
                      </div>
                    </td>
                    <td className="px-2 py-1.5">
                      <select value={s.columnId} onChange={(e) => moveStory(s.id, e.target.value)} className={inputCls + ' py-0.5 text-[12px]'}>
                        {columns.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    </td>
                    <td className="px-2 py-1.5">
                      <input type="date" value={s.enteredColumnAt} onChange={(e) => setEnteredAt(s.id, e.target.value)} className={inputCls + ' num py-0.5 text-[12px]'} />
                    </td>
                    <td className={'num px-2 py-1.5 text-right ' + (stuck ? 'font-semibold text-red-700' : 'text-slate-600')}>
                      {here}
                      {stuck && <span className="ml-1 text-[10px] uppercase">stuck</span>}
                    </td>
                    <td className="px-2 py-1.5 text-[11px] text-slate-400">
                      {s.history.map((h) => {
                        const c = columns.find((x) => x.id === h.columnId);
                        return (c ? c.name : h.columnId) + ' ' + shortDate(h.at);
                      }).join('  →  ')}
                    </td>
                    <td className="pr-2 text-right">
                      <span className="opacity-0 transition group-hover:opacity-100">
                        <XBtn onClick={() => setStories((all) => rm(all, s.id))} />
                      </span>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div className="no-print flex items-center gap-2 border-t border-slate-100 bg-slate-50 px-3 py-2">
          <input
            value={newStory}
            onChange={(e) => setNewStory(e.target.value)}
            onKeyDown={(e) => e.key === 'Enter' && addStory()}
            placeholder={'New story — enters ' + columns[0].name + ' today'}
            className={inputCls + ' flex-1'}
          />
          <button className={btnCls} onClick={addStory}>+ Story</button>
        </div>
      </Card>

      <FootNote>
        the daily snapshot is <strong>derived from each story's entered-column dates, not from live tracking</strong>. A
        story is counted in whichever column it last entered on or before that day, so a card that moved twice in one day
        only registers its final position, and a card moved late without correcting the date will shift history when you
        fix it. Dwell time is calendar days, weekends included, and a spell that has not ended yet counts up to today —
        which means an idle board slowly inflates its own constraint. The constraint scan covers the working columns only:
        the first column is treated as the intake queue and the last as terminal, so neither is ever nominated — on a
        two-column board that rule relaxes to excluding the terminal column alone.
      </FootNote>
    </div>
  );
}

   TAB 6 — TEAM HEALTH CHECK-IN (ANONYMOUS)
   Sentiment is stored as per-day counts only. There is no author field on a
   check-in anywhere in this model, so no view can ever attribute one.
   ========================================================================== */

const MOOD = [
  { score: 1, face: '\u{1F61E}', label: 'Rough' },
  { score: 2, face: '\u{1F641}', label: 'Strained' },

];

/** counts[i] is the number of anonymous submissions that chose score i+1. */
const mood = (daysAgo, counts) => ({ id: uid('m'), date: ago(daysAgo), counts });

const SEED_SENTIMENT = [

  mood(5, [1, 2, 4, 1, 0]),
  mood(4, [0, 1, 4, 3, 0]),
  mood(3, [0, 1, 2, 4, 1]),
  mood(2, [0, 0, 2, 4, 2]),
  mood(1, [0, 0, 2, 5, 1]),
  mood(0, [0, 1, 1, 4, 2]),
];

const SEED_SWARMS = [
  { id: uid('sw'), storyRef: 'S-402', note: 'VAT rounding disagreed with the finance export', people: 5, startedAt: agoAt(9, '11:00'), resolvedAt: agoAt(8, '15:00') },
  { id: uid('sw'), storyRef: 'S-407', note: 'Search index rebuild timed out on the staging dataset', people: 4, startedAt: agoAt(6, '09:30'), resolvedAt: agoAt(6, '16:00') },
